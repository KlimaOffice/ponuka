<!DOCTYPE html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cenová ponuka</title><style>
*{box-sizing:border-box}body{font-family:"Segoe UI",Helvetica,Arial,sans-serif;color:#0f1b2d;margin:0;background:#eef2f7;font-size:14px;line-height:1.45}
.page{max-width:820px;margin:24px auto;background:#fff;padding:40px 46px;box-shadow:0 8px 30px rgba(0,0,0,.08)}.top{display:flex;justify-content:space-between;gap:30px;border-bottom:3px solid #0284c7;padding-bottom:18px;margin-bottom:24px}.top h1{margin:0 0 4px;font-size:26px;letter-spacing:-.5px}.sup{color:#667589;font-size:12.5px}.meta{text-align:right;font-size:12.5px}.meta div{display:flex;justify-content:space-between;gap:18px}.meta span{color:#667589}.cust{background:#f3f7fb;border-radius:10px;padding:14px 18px;margin-bottom:24px}.cust small{color:#667589;text-transform:uppercase;letter-spacing:.6px;font-size:10.5px}.cust b{display:block;font-size:15px;margin:2px 0}.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:#667589;text-align:left;padding:8px 10px;border-bottom:1px solid #d5deea}td{padding:7px 10px;border-bottom:1px solid #edf1f6}.c{text-align:center;white-space:nowrap}.r{text-align:right;white-space:nowrap}th.c{text-align:center}th.r{text-align:right}tr.band td{font-weight:650;border:0;padding:8px 10px;background:#e8f1fa}tr.band.h1 td{background:#0b1f3a;color:#fff}.total{display:flex;justify-content:flex-end;margin-top:14px}.total div{background:#0b1f3a;color:#fff;border-radius:10px;padding:12px 22px;display:flex;gap:30px;align-items:baseline}.total b{font-size:22px}.note{margin-top:22px;color:#334155;white-space:pre-wrap}.foot{margin-top:26px;color:#667589;font-size:12px;white-space:pre-wrap}.vh{font-size:15px;margin:26px 0 8px}.vt td{padding:9px 10px}.vt .vk{font-weight:700;width:70px}.vt b{font-size:15px}.vn{color:#667589;font-size:12px;margin:8px 0 0}.appr{margin-top:30px}.appr label{display:block;font-weight:600;margin-bottom:6px}.appr textarea{width:100%;min-height:90px;padding:10px 12px;border:1px solid #c5d0de;border-radius:10px;font:inherit;resize:vertical}.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.btns button{flex:1 1 180px;background:#fff;color:#0f1b2d;border:1px solid #c5d0de;border-radius:10px;padding:14px 18px;font-size:15.5px;font-weight:600;cursor:pointer}.btns button:hover{background:#f3f7fb}.btns .yes{background:#15803d;border-color:#15803d;color:#fff}.btns .yes:hover{background:#166534}.btns .no{color:#b91c1c;border-color:#fca5a5}.btns .no:hover{background:#fef2f2}.appr p{color:#667589;font-size:12.5px;margin:10px 0 0}.notes{margin-top:30px;background:#f3f7fb;border-radius:10px;padding:14px 18px}.notes h3{margin:0 0 6px;font-size:14px}.notes p{margin:6px 0 0;white-space:pre-wrap}.notes span{color:#667589;font-size:12px;margin-right:8px}.box{margin-top:30px;border-radius:10px;padding:18px 24px;text-align:center}.box h2{margin:0 0 6px;font-size:19px}.box p{margin:0}.box.ok{background:#f0fdf4;border:1px solid #86efac;color:#14532d}.box.exp{background:#fffbeb;border:1px solid #fcd34d;color:#78350f}.box.no{background:#fef2f2;border:1px solid #fca5a5;color:#7f1d1d}.vt.pick td{padding:0}.vt.pick label{display:block;padding:9px 10px;cursor:pointer}.vt.pick tr:hover td{background:#f3f7fb}.vt.pick tr:has(input:checked) td,.vt tr.sel td{background:#e0f2fe}.vt input{margin-right:4px}.sm{display:none}@media(max-width:640px){.page{margin:0;padding:22px 14px}.top{flex-direction:column;gap:12px}.meta{text-align:left}.top h1{font-size:22px}.hm{display:none}.sm{display:inline}th,td{padding:7px 5px}.vt.pick label{padding:9px 5px}th{letter-spacing:0}.vt .vk{width:auto}.total div{gap:16px;padding:12px 16px}}
</style></head><body><div class="page" id="app"><div class="box exp"><p>Načítavam ponuku…</p></div></div>
<script>
var URL_='https://xwvortdduvywdyxqlusa.supabase.co', KEY_='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh3dm9ydGRkdXZ5d2R5eHFsdXNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ5MzQyNzcsImV4cCI6MjExMDUxMDI3N30.9_n6wqAeWpNAxwyBB1smJ-fSMC9OcALsjbhO2FH293w';
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function eur(n){return (+n||0).toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' €';}
function mnozstvo(n){return String(+(+n).toFixed(2)).replace('.',',');}
function datum(s){var p=String(s||'').slice(0,10).split('-');return p.length===3?+p[2]+'. '+(+p[1])+'. '+p[0]:'';}
function den(iso){var d=new Date(iso);return d.getDate()+'. '+(d.getMonth()+1)+'. '+d.getFullYear();}
function dnes(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function vyprsala(q){return !!q.validUntil&&q.validUntil<dnes();}
function rpc(fn,body){return fetch(URL_+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEY_,Authorization:'Bearer '+KEY_,'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();});}
function ponukaHtml(q,info){
  var riadky='';
  (q.items||[]).forEach(function(it){
    riadky+=it.group?'<tr class="band '+esc(it.kind)+'"><td colspan="4">'+esc(it.group)+'</td></tr>'
      :'<tr><td>'+esc(it.name)+'</td><td class="c">'+esc(it.unit)+'</td><td class="c">'+mnozstvo(it.qty)+'</td><td class="r">'+eur(it.total)+'</td></tr>';
  });
  var vars=q.variants||[], otvorena=!q._approved&&!q._rejected&&!vyprsala(q), vyber=otvorena&&vars.length>1, varianty='';
  if(vars.length){
    varianty='<h2 class="vh">Varianty zariadenia</h2><table class="vt'+(vyber?' pick':'')+'"><thead><tr><th>Variant</th><th>Zariadenie</th><th class="r">Cena spolu</th></tr></thead><tbody>'
    +vars.map(function(v,i){
      var id='v'+i,kluc='ABCDEFGHIJ'.charAt(i),vybrany=!!q._approved&&q._variant===i;
      var c=function(t){return vyber?'<label for="'+id+'">'+t+'</label>':t;};
      return '<tr class="'+(vybrany?'sel':'')+'"><td class="vk">'+(vyber?'<label for="'+id+'"><input type="radio" form="pf" name="variant" id="'+id+'" value="'+i+'"'+(info&&info.sel===i?' checked':'')+'> '+kluc+'</label>':kluc)+'</td><td>'+c(esc(v.name))+'</td><td class="r"><b>'+c(eur((+q.total||0)+(+v.sell||0)))+'</b></td></tr>';
    }).join('')+'</tbody></table><p class="vn">'+(vyber?'Kliknutím na riadok vyberte variant, ktorý chcete. ':'')+'Cena spolu = spoločné položky + zariadenie zvoleného variantu.</p>';
  }
  var poznamky=(q._notes||[]).length?'<div class="notes"><h3>Vaše pripomienky</h3>'+q._notes.map(function(n){return '<p><span>'+den(n.at)+'</span>'+esc(n.text)+'</p>';}).join('')+'</div>':'';
  var stav;
  if(q._approved) stav='<div class="box ok"><h2>Ponuka je schválená</h2><p>Ďakujeme. Schválené '+den(q._approvedAt)+(vars.length>1&&vars[q._variant]?', variant '+'ABCDEFGHIJ'.charAt(q._variant)+' ('+esc(vars[q._variant].name)+')':'')+'. Ozveme sa Vám s termínom.</p></div>';
  else if(q._rejected) stav='<div class="box no"><h2>Ponuku ste zamietli</h2><p>Zamietnuté '+den(q._rejectedAt)+'. Ak ste si to rozmysleli, ozvite sa nám.</p></div>';
  else if(vyprsala(q)) stav='<div class="box exp"><p>Platnosť tejto ponuky vypršala. Ozvite sa nám, pripravíme novú.</p></div>';
  else stav=(info?'<div class="box '+(info.ok?'ok':'exp')+'"><p>'+esc(info.ok||info.chyba)+'</p></div>':'')
    +'<form class="appr" id="pf"><label for="text">Pripomienky alebo otázky k ponuke (nepovinné)</label>'
    +'<textarea id="text" name="text" maxlength="1000" placeholder="Napíšte, čo by ste chceli zmeniť alebo doplniť.">'+esc(info&&info.text||'')+'</textarea>'
    +'<div class="btns"><button type="submit" value="schvalit" class="yes">Schváliť ponuku</button><button type="submit" value="pripomienka">Poslať pripomienky</button><button type="submit" value="zamietnut" class="no">Zamietnuť ponuku</button></div>'
    +'<p>Schválením potvrdíte, že s ponukou súhlasíte. Text z poľa sa odošle spolu s Vašou odpoveďou.</p></form>';
  stav=poznamky+stav;
  return '<div class="top"><div><h1>'+esc(q.company||'Cenová ponuka')+'</h1><div class="sup">'+(q.sup||[]).map(esc).join('<br>')+'</div></div>'
    +'<div class="meta"><div><span>Cenová ponuka č.</span><b>'+esc(q.number)+'</b></div><div><span>Dátum</span><b>'+datum(q.date)+'</b></div>'+(q.validUntil?'<div><span>Platnosť do</span><b>'+datum(q.validUntil)+'</b></div>':'')+'</div></div>'
    +'<div class="cust"><small>Zákazník</small><b>'+esc(q.custName||'–')+'</b>'+esc(q.custInfo)+'</div>'
    +'<div class="tw"><table><thead><tr><th>Popis položky</th><th class="c"><span class="hm">Merná jednotka</span><span class="sm">MJ</span></th><th class="c"><span class="hm">Množstvo</span><span class="sm">Počet</span></th><th class="r">Cena<span class="hm"> spolu</span></th></tr></thead><tbody>'+riadky+'</tbody></table></div>'
    +'<div class="total"><div><span>'+(vars.length?'Spoločné položky spolu':'Spolu')+'</span><b>'+eur(q.total)+'</b></div></div>'
    +(varianty?'<div class="tw">'+varianty+'</div>':'')
    +(q.note?'<div class="note">'+esc(q.note)+'</div>':'')+(q.footer?'<div class="foot">'+esc(q.footer)+'</div>':'')
    +(q.termin?'<div class="box exp" style="background:#f0f9ff;border-color:#7dd3fc;color:#0c4a6e"><p>'+esc(q.termin)+'</p></div>':'')
    +stav;
}
var PID=(location.search.match(/[?&]p=([^&]+)/)||[])[1]||'';
function zloz(r){var q=Object.assign({},r.data);q._approved=!!r.approved_at;q._approvedAt=r.approved_at;q._rejected=!!r.rejected_at;q._rejectedAt=r.rejected_at;q._variant=r.variant_idx;q._notes=r.notes||[];return q;}
var Q=null;
function kresli(info){document.getElementById('app').innerHTML=ponukaHtml(Q,info);document.title='Cenová ponuka '+(Q.number||'');var f=document.getElementById('pf');if(f)f.addEventListener('submit',odosli);}
function nacitaj(info){return rpc('share_get',{p_pid:PID}).then(function(r){if(!r){document.getElementById('app').innerHTML='<div class="box exp"><h2>Ponuka sa nenašla</h2><p>Odkaz je neplatný alebo ponuka už nie je zdieľaná.</p></div>';return;}Q=zloz(r);kresli(info);}).catch(function(){document.getElementById('app').innerHTML='<div class="box exp"><p>Ponuku sa nepodarilo načítať. Skúste to, prosím, neskôr.</p></div>';});}
function odosli(e){
  e.preventDefault();var akcia=e.submitter&&e.submitter.value,text=String(document.getElementById('text').value||'').trim().slice(0,1000);
  var vars=Q.variants||[],vr=document.querySelector('input[name=variant]:checked'),vi=vr?+vr.value:(vars.length>1?-1:0);
  if(akcia==='schvalit'&&vars.length>1&&vi<0){kresli({chyba:'Kliknutím na riadok vyberte variant zariadenia, ktorý chcete.',sel:-1,text:text});return;}
  if(akcia==='pripomienka'&&!text){kresli({chyba:'Napíšte, prosím, pripomienku do poľa nad tlačidlami.',sel:vi,text:text});return;}
  Array.prototype.forEach.call(document.querySelectorAll('.btns button'),function(b){b.disabled=true;});
  rpc('share_respond',{p_pid:PID,p_action:akcia,p_variant_idx:vi>=0?vi:null,p_text:text}).then(function(r){
    var info=r&&r.ok&&akcia==='pripomienka'?{ok:'Pripomienky sme prijali. Ďakujeme, ozveme sa Vám.'}:(r&&r.error==='variant'?{chyba:'Kliknutím na riadok vyberte variant zariadenia, ktorý chcete.',sel:-1,text:text}:null);
    return nacitaj(info);
  }).catch(function(){kresli({chyba:'Odpoveď sa nepodarilo odoslať. Skúste to, prosím, znova alebo nám zavolajte.',sel:vi,text:text});});
}
if(!PID){document.getElementById('app').innerHTML='<div class="box exp"><h2>Ponuka sa nenašla</h2><p>Odkaz je neplatný.</p></div>';}else nacitaj(null);
</script></body></html>
