function tlChange(el){
  const f=el.dataset.tl; if(!['status','location','holder'].includes(f)) return;
  const t=tlById(el.closest('tr').dataset.tid); if(!t) return;
  const old=t[f]||'', nv=el.value; if(old===nv) return; t[f]=nv;
  tlLog(t, f==='status' ? `Stav: ${(TL_ST[old]||[0,'–'])[1]} → ${TL_ST[nv][1]}` : f==='location' ? `Miesto: ${old||'–'} → ${nv||'–'}` : `Má ho: ${old||'–'} → ${nv||'–'}`);
  persist('app/naradie',S.tools); tlRefresh(t.id);
}

/* ============ sklad: objednávky materiálu ============ */
function skCommitted(){
  const c={};
  for(const d of S.quotes){
    if(cpStatus(d)!=='prijata'||S.montaze.some(m=>m.quoteId===d.id&&m.status==='hotova')) continue;
    for(const i of d.items||[]) if(i.stockId&&i.qty>0) c[i.stockId]=(c[i.stockId]||0)+i.qty;
  }
  return c;
}
function skNeeds(){
  const c=skCommitted();
  return S.sklad.items.map(it=>({it,res:c[it.id]||0,need:r3((c[it.id]||0)+(+it.min||0)-it.stock)})).filter(x=>x.need>0&&(x.res>0||+x.it.min>0));
}
const skOrderQty=x=>S.skOrder[x.it.id]!==undefined?S.skOrder[x.it.id]:Math.ceil(x.need);
function skTabs(){
  const n=skNeeds().length, t=(k,l)=>`<button data-act="sk-tab" data-tab="${k}" class="${S.skTab===k?'on':''}">${l}</button>`;
  return `<div class="seg">${t('zoznam','Zoznam')}${t('objednavky','Na objednanie'+(n?' ('+n+')':''))}</div>`;
}
function skOrderBody(){
  const needs=skNeeds();
  if(!needs.length) return {rows:`<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:34px">Nič netreba objednať. Položka sa tu objaví, keď klesne pod minimum alebo keď prijatá ponuka potrebuje viac, než máš skladom.</td></tr>`,total:0,text:''};
  let total=0, text=[];
  const rows=needs.map(x=>{ const q=skOrderQty(x), sum=q*(+x.it.buy||0); total+=sum; if(q>0) text.push(`${x.it.name} – ${fq(q)} ${x.it.unit}`);
    return `<tr data-sid="${esc(x.it.id)}"><td class="name"><b>${esc(x.it.name)}</b>${x.it.spec?`<small class="tl-sub">${esc(x.it.spec)}</small>`:''}</td>
      <td class="num">${fq(x.it.stock)} ${esc(x.it.unit)}</td><td class="num">${x.res?fq(x.res)+' '+esc(x.it.unit):'–'}</td><td class="num">${x.it.min?fq(x.it.min):'–'}</td>
      <td class="num"><input type="number" class="n" min="0" step="any" data-sko="qty" value="${q}"></td><td class="num">${eur(x.it.buy)}</td><td class="num"><b>${eur(sum)}</b></td>
      <td><button class="btn small" data-act="sk-receive">Prijať na sklad</button></td></tr>`; }).join('');
  return {rows,total,text:text.join('\n')};
}
function viewSkOrder(){
  const o=skOrderBody();
  return `<div class="page-head"><div><h1>Sklad materiálu</h1><p>Čo treba dokúpiť: položky pod minimom a materiál rezervovaný pre prijaté ponuky.</p></div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${skTabs()}</div></div>
  <section class="card"><div class="card-head"><h3>Na objednanie</h3><div style="display:flex;gap:8px;align-items:center"><b>Odhad: ${eur(o.total)}</b><button class="btn small" data-act="sk-copy" ${o.text?'':'disabled'}>Kopírovať zoznam</button></div></div>
    <p class="hint">Navrhnuté množstvo = minimum + rezervované pre prijaté ponuky − skladom. Môžeš ho prepísať. „Prijať na sklad“ pridá množstvo do skladu a zapíše príjem do histórie.</p>
    <div class="tablewrap"><table><thead><tr><th>Položka</th><th class="r">Skladom</th><th class="r">Rezervované</th><th class="r">Min.</th><th class="r">Objednať</th><th class="r">Nákup €/MJ</th><th class="r">Spolu</th><th></th></tr></thead><tbody>${o.rows}</tbody></table></div>
    ${S.skCopy?`<label class="f" style="margin-top:12px">Kopírovanie sa nepodarilo – označ a skopíruj:<textarea readonly onclick="this.select()" style="min-height:110px">${esc(S.skCopy)}</textarea></label>`:''}</section>`;
}
function viewSklad(){ return S.skTab==='objednavky' ? viewSkOrder() : viewSkladList(); }
async function skReceive(id){
  const x=skNeeds().find(n=>n.it.id===id), it=S.sklad.items.find(i=>i.id===id); if(!it) return;
  const q=x?skOrderQty(x):0; if(!(q>0)){ toast('Zadaj množstvo na prijatie.'); return; }
  it.stock=r3(it.stock+q); skLog(it,q,'Príjem z objednávky'); delete S.skOrder[id];
  await skSave(); renderView(); toast(`Prijaté na sklad: ${it.name} +${fq(q)} ${it.unit}.`);
}

/* ============ modul: Zákazníci ============ */
const custKey=n=>(n||'').trim().toLowerCase().replace(/\s+/g,' ');
function custList(){
  const map={}, blank=k=>({key:k,name:'',phone:'',email:'',address:'',note:'',id:null,quotes:[],montaze:[]});
  const get=name=>{ const k=custKey(name); if(!k) return null; return map[k]||(map[k]=Object.assign(blank(k),{name:name.trim()})); };
  const fill=(c,o)=>{ for(const f of ['phone','email','address']) if(!c[f]&&o&&o[f]) c[f]=o[f]; };
  for(const d of S.quotes){ const c=get(d.customer&&d.customer.name); if(c){ c.quotes.push(d); fill(c,d.customer); } }
  for(const m of S.montaze){ const c=get(m.customer&&m.customer.name); if(c){ c.montaze.push(m); fill(c,m.customer); } }
  for(const s of S.customers){
    const k=s.key||custKey(s.name); if(!k) continue;
    const c=map[k]||(map[k]=Object.assign(blank(k),{name:s.name}));
    c.id=s.id; c.phone=s.phone??c.phone; c.email=s.email??c.email; c.address=s.address??c.address; c.note=s.note||'';
    if(!c.quotes.length&&!c.montaze.length) c.name=s.name;
  }
  return Object.values(map).sort((a,b)=>a.name.localeCompare(b.name,'sk'));
}
function custEnsure(key){
  let s=S.customers.find(x=>(x.key||custKey(x.name))===key);
  if(!s){ const c=custList().find(x=>x.key===key)||{}; s={id:'cu-'+uid(),key,name:c.name||'',phone:c.phone||'',email:c.email||'',address:c.address||'',note:c.note||'',createdAt:new Date().toISOString()}; S.customers.push(s); }
  return s;
}
const saveCuDeb=debounce(s=>persist('customers/'+s.id,s),700);
const svcMonths=()=>(+S.settings.serviceMonths)||12;
function svcNextOf(m){ const done=(m.service||[]).filter(s=>s.date).length; return {done,next:(m.status==='hotova'&&m.startDate&&done<10)?addMonths(m.startDate,svcMonths()*(done+1)):null}; }
function nextBadge(iso){
  if(!iso) return '<span style="color:var(--muted)">–</span>';
  const d=dayDiff(iso); return d<0?`<span class="badge out">po termíne ${-d} d</span>`:d<=30?`<span class="badge low">o ${d} d</span>`:`<span class="badge ok">${dfmt(iso)}</span>`;
}
function cuRows(){
  const q=S.cuQuery.trim().toLowerCase();
  const list=custList().filter(c=>!q||(c.name+' '+c.phone+' '+c.email+' '+c.address).toLowerCase().includes(q));
  if(!list.length) return `<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:34px">${S.quotes.length||S.customers.length?'Nič nezodpovedá hľadaniu.':'Zákazníci sa tu objavia automaticky z uložených ponúk. Môžeš pridať aj ručne.'}</td></tr>`;
  return list.map(c=>{
    const sum=c.quotes.reduce((s,d)=>s+(d.totals&&d.totals.total||0),0), done=c.montaze.filter(m=>m.status==='hotova').length;
    const nexts=c.montaze.map(m=>svcNextOf(m).next).filter(Boolean).sort();
    const open=S.cuOpen===c.key;
    let r=`<tr data-ckey="${esc(c.key)}"><td class="cust"><b>${esc(c.name)}</b><small>${esc(c.address)}</small></td>

/* ============ modul: Servisné prehliadky ============ */
function svcRows(){
  return S.montaze.filter(m=>m.status==='hotova'&&m.startDate).map(m=>{ const s=svcNextOf(m); return {m,done:s.done,next:s.next,days:s.next?dayDiff(s.next):null}; })

}

      <td><div class="rowact">${r.done<10?`<button class="btn small ${open?'':'primary'}" data-act="sv-open">Zapísať vykonanú</button>`:''}${r.next?`<button class="btn small ${r.days<=30&&m.svcRemFor!==r.next?'':'ghost'}" data-act="sv-remind" title="Pošle zákazníkovi mail s pripomienkou prehliadky">Poslať pripomienku</button>`:''}<button class="btn small ghost" data-act="sv-proto">Protokol</button></div></td></tr>`;
    if(open&&r.done<10) t+=`<tr class="tl-detail" data-mid="${esc(m.id)}"><td colspan="7"><div class="proto-grid">
      <label class="f">Dňa<input type="date" data-sv="date" value="${today()}"></label><label class="f">Technik<input type="text" data-sv="tech" value="${esc(m.worker||'')}"></label>
      <label class="f s2">Stav po prehliadke<input type="text" data-sv="state" placeholder="napr. v poriadku, vyčistené filtre"></label></div>
      <div style="display:flex;gap:8px;margin-top:12px"><button class="btn primary small" data-act="sv-save">Zapísať ${r.done+1}. prehliadku</button><button class="btn small ghost" data-act="sv-cancel">Zrušiť</button></div></td></tr>`;

  }).join('') || `<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:34px">${all.length?'V tomto filtri nič nie je.':'Servisné prehliadky sa tu objavia po ukončení prvej montáže (dátum spustenia + interval).'}</td></tr>`;
  return `<div class="page-head"><div><h1>Servisné prehliadky</h1><p>Komu je čas zavolať. Termín = dátum spustenia + interval za každú ďalšiu prehliadku.</p></div>
    <label class="f" style="flex-direction:row;align-items:center;gap:8px">Interval<select data-sv="months" style="width:120px">${[6,12,24].map(n=>`<option value="${n}" ${svcMonths()===n?'selected':''}>${n} mesiacov</option>`).join('')}</select></label></div>

async function svSave(mid,row){
  const m=S.montaze.find(x=>x.id===mid); if(!m) return;
  const i=m.service.findIndex(s=>!s.date); if(i<0){ toast('Všetkých 10 prehliadok je zapísaných.'); return; }
  const g=k=>row.querySelector(`[data-sv="${k}"]`).value;
  if(!g('date')){ toast('Zadaj dátum prehliadky.'); return; }
  m.service[i]={date:g('date'),tech:g('tech'),state:g('state')}; S.svOpen=null;
  await persist('montaze/'+m.id,m); renderView(); toast((i+1)+'. servisná prehliadka zapísaná.');
}

const CS={zasah:{tab:'zasahy',one:'zásah',title:'Servisné zásahy',lead:'Opravy a zásahy mimo pravidelných prehliadok: čo sa robilo, kedy a koľko to stálo.',what:'Porucha / dôvod zásahu',done:'Čo sa urobilo, použitý materiál'},

const CS_ST={otvorena:['wait','Otvorená'],vyriesena:['ok','Vyriešená'],zamietnuta:['out','Zamietnutá']};
const csMoLabel = m => [m.indoorModel||'Zariadenie',m.number?'zákazka '+m.number:''].filter(Boolean).join(' · ');

function svTabs(){

      ${rekl?`<td><span class="badge ${CS_ST[c.status][0]}">${CS_ST[c.status][1]}</span>${c.resolvedDate&&c.status!=='otvorena'?`<div style="font-size:11.5px;color:var(--muted);margin-top:3px">${dfmt(c.resolvedDate)}</div>`:''}</td><td class="num">${eur(c.cost)}</td>`:`<td class="num">${eur(c.price)}</td>`}

    if(open) r+=`<tr class="tl-detail" data-csid="${esc(c.id)}"><td colspan="${cols}"><div class="proto-grid">
      <label class="f">Dátum<input type="date" data-cs="date" value="${esc(c.date)}"></label>
      <label class="f">Zákazník<input type="text" data-cs="customer" list="cs-cust" value="${esc(c.customer)}"></label>
      <label class="f s2">Zariadenie<select data-cs="moId"><option value="">– neurčené –</option>${csMos(c.customer).map(m=>`<option value="${esc(m.id)}" ${m.id===c.moId?'selected':''}>${esc(csMoLabel(m))}</option>`).join('')}</select></label>
      <label class="f s4">${k.what}<textarea data-cs="problem">${esc(c.problem)}</textarea></label>

function csAdd(type){
  const customer=$('#cs-c').value.trim(); if(!customer){ toast('Zadaj zákazníka.'); return; }

  const c={id:'cs-'+uid(),type,date:$('#cs-d').value||today(),customer,moId:mos.length===1?mos[0].id:'',problem:$('#cs-p').value.trim(),work:'',price:0,cost:0,status:'otvorena',resolvedDate:'',createdAt:new Date().toISOString()};

function csChange(el){
  const c=S.cases.find(x=>x.id===el.closest('tr').dataset.csid); if(!c) return;
  const f=el.dataset.cs; c[f]=(f==='price'||f==='cost')?(parseFloat(String(el.value).replace(',','.'))||0):el.value;
  if(f==='customer'&&!csMos(c.customer).some(m=>m.id===c.moId)) c.moId='';
  if(f==='status'&&c.status!=='otvorena'&&!c.resolvedDate) c.resolvedDate=today();
  persist('cases/'+c.id,c);
  /* prekreslenie až po presune kurzora, aby sa nestratilo pole, do ktorého používateľ práve prešiel */
  setTimeout(()=>{ const a=document.activeElement, k=a&&a.dataset&&a.dataset.cs; renderView(); if(k){ const n=$(`tr.tl-detail [data-cs="${k}"]`); if(n) n.focus(); } },0);
}

/* ============ modul: Mapa zákazníkov ============ */
const geoKey = a => String(a||'').trim().toLowerCase().replace(/\s+/g,' ');
const geoOf = a => (S.settings.geo||{})[geoKey(a)];   // [šírka, dĺžka] | 0 = adresa sa nenašla | undefined = ešte nezisťovaná
function mapStops(day){
  return [...S.montaze.filter(m=>m.plannedDate===day).map(m=>calInfo('mo',m)),...S.events.filter(e=>e.date===day).map(e=>calInfo('ev',e))]
    .map(i=>({time:i.time,title:i.title,address:(i.place||'').trim()})).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
}
function mapItems(){
  const stops=mapStops(S.mapDay).filter(s=>s.address), no=a=>stops.findIndex(s=>geoKey(s.address)===geoKey(a))+1;
  const items=custList().filter(c=>(c.address||'').trim()).map(c=>({name:c.name,address:c.address.trim(),phone:c.phone,done:c.montaze.some(m=>m.status==='hotova'),no:no(c.address)}));
  stops.forEach((s,i)=>{ if(!items.some(x=>geoKey(x.address)===geoKey(s.address))) items.push({name:s.title,address:s.address,phone:'',done:false,no:i+1}); });
  return items;
}
function mapRouteUrl(day){
  const pts=mapStops(day).map(s=>s.address).filter(Boolean); if(!pts.length) return '';
  const home=(S.settings.address||'').trim(), all=home?[home,...pts]:pts;
  if(all.length<2) return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(all[0]);
  const p=new URLSearchParams({api:'1',origin:all[0],destination:all[all.length-1],travelmode:'driving'});
  if(all.length>2) p.set('waypoints',all.slice(1,-1).join('|'));
  return 'https://www.google.com/maps/dir/?'+p;
}
function viewMapa(){
  const head=`<div class="page-head"><div><h1>Mapa zákazníkov</h1><p>Kde máš zákazníkov a kam ideš vo vybraný deň. Poloha sa zisťuje z adresy zákazníka.</p></div></div>`;
  if(!window.klimaMap) return head+`<section class="card"><p class="hint" style="margin:0">Mapa funguje len v nainštalovanej aplikácii Klima Office.</p></section>`;
  const stops=mapStops(S.mapDay), miss=mapItems().filter(i=>geoOf(i.address)===0);
  return head+`<section class="card"><div class="toolbar"><label class="f" style="flex-direction:row;align-items:center;gap:8px">Deň<input type="date" data-map="day" value="${esc(S.mapDay)}" style="width:160px"></label>

let leafletP=null, mapRun=0;
function leafletLoad(){
  return leafletP||(leafletP=new Promise((ok,no)=>{
    const l=document.createElement('link'); l.rel='stylesheet'; l.href='leaflet/leaflet.css'; document.head.appendChild(l);
    const sc=document.createElement('script'); sc.src='leaflet/leaflet.js'; sc.onload=()=>ok(window.L); sc.onerror=no; document.head.appendChild(sc);
  }));
}
async function mapInit(){
  const run=++mapRun, el=$('#map'); if(!el) return;
  const live=()=>run===mapRun&&el.isConnected;
  let L; try{ L=await leafletLoad(); }catch(e){ el.textContent='Mapu sa nepodarilo načítať.'; return; }
  if(!live()) return;
  const map=L.map(el).setView([48.7,19.5],8), box=[], items=mapItems(), st=$('#map-state');
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
  const put=i=>{ const pos=geoOf(i.address); if(!pos) return; box.push(pos);
    const mk=L.circleMarker(pos,{radius:i.no?12:8,color:'#fff',weight:2,fillOpacity:.95,fillColor:i.no?'#ea580c':i.done?'#16a34a':'#0284c7'}).addTo(map)
      .bindPopup('<b>'+esc(i.name)+'</b><br>'+esc(i.address)+(i.phone?'<br>'+esc(i.phone):''));
    if(i.no){ mk.bindTooltip(String(i.no),{permanent:true,direction:'center',className:'map-no'}); mk.bringToFront(); } };
  const fit=()=>{ if(box.length) map.fitBounds(box,{padding:[40,40],maxZoom:14}); };
  items.forEach(put); fit();
  const todo=[...new Set(items.filter(i=>geoOf(i.address)===undefined).map(i=>i.address))];
  for(let n=0;n<todo.length;n++){
    st.textContent='Zisťujem polohu adries '+(n+1)+' / '+todo.length+'…';
    const r=await window.klimaMap.geocode({address:todo[n]});
    if(!r.ok){ if(live()) st.textContent='Polohu adries sa nepodarilo zistiť. Skontroluj internetové pripojenie.'; return; }
    (S.settings.geo=S.settings.geo||{})[geoKey(todo[n])]=r.pos||0; saveSettings();
    if(!live()) return;
    items.filter(i=>geoKey(i.address)===geoKey(todo[n])).forEach(put); fit();
  }
  if(todo.length){ if(items.some(i=>geoOf(i.address)===0)) renderView(); else st.textContent=''; }   // prekreslenie doplní zoznam nenájdených adries
}

/* ---- prepojenie s Google kalendárom (len v nainštalovanej aplikácii – window.klimaCal dodáva Electron).
        Termíny sa posielajú malému skriptu v Google účte používateľa (Apps Script), ktorý udalosť vytvorí, prepíše alebo zmaže. ---- */
const calToken = () => S.settings.calToken || (S.settings.calToken=[...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,'0')).join(''));
const calUrl = () => (S.settings.calUrl||'').trim();
const calOn = () => !!(window.klimaCal && calUrl() && S.settings.calSync!==false);
/* kód, ktorý si používateľ vloží na script.google.com; kľúč je jeho vlastný a pozná ho len aplikácia a skript */
const calScript = () => `// Klima Office – prepojenie s Google kalendárom a zdieľanie ponúk
const KLUC = '${calToken()}';

function doPost(e) {
  try {
    if (e.parameter && e.parameter.ponuka) return odpovedZakaznika(e.parameter);   // zákazník odoslal formulár pod ponukou
    const d = JSON.parse(e.postData.contents);
    if (d.token !== KLUC) return odpoved({ ok: false, error: 'Kľúč v skripte nesedí s aplikáciou. Skopíruj skript z aplikácie znova.' });
    const zoznam = PropertiesService.getScriptProperties();

    /* ---- ponuky ---- */
    if (d.action === 'quote_save') {
      const stara = zoznam.getProperty('p_' + d.pid);
      if (stara) { const n = JSON.parse(stara)._notes; if (n) d.data._notes = n; }   // pripomienky zákazníka ostávajú aj pri novom znení
      try { zoznam.setProperty('p_' + d.pid, JSON.stringify(d.data)); }
      catch (x) { return odpoved({ ok: false, error: 'Ponuka je na zdieľanie cez odkaz príliš dlhá. Pošli ju ako PDF.' }); }
      return odpoved({ ok: true, v: 2 });
    }
    if (d.action === 'quote_status') {
      const raw = zoznam.getProperty('p_' + d.pid);
      if (!raw) return odpoved({ ok: false, error: 'Ponuka sa v skripte nenašla.' });
      const q = JSON.parse(raw);
      return odpoved({ ok: true, approved: !!q._approved, approvedAt: q._approvedAt || '', rejected: !!q._rejected, rejectedAt: q._rejectedAt || '', notes: q._notes || [], variant: q._variant == null ? -1 : q._variant, variantId: q._variantId || '' });
    }
    if (d.action === 'quote_delete') {
      zoznam.deleteProperty('p_' + d.pid);
      return odpoved({ ok: true });
    }

    /* ---- kalendár ---- */
    const kal = CalendarApp.getDefaultCalendar();
    if (d.action === 'ping') return odpoved({ ok: true, calendar: kal.getName() });
    const id = zoznam.getProperty(d.uid);
    let udalost = null;
    if (id) { try { udalost = kal.getEventById(id); } catch (x) {} }
    if (d.action === 'delete') {
      if (udalost) { try { udalost.deleteEvent(); } catch (x) {} }
      zoznam.deleteProperty(d.uid);
      return odpoved({ ok: true });
    }
    const den = d.date.split('-'), celyDen = new Date(+den[0], den[1] - 1, +den[2]);
    if (udalost) {
      try {
        udalost.setTitle(d.title);
        if (d.allDay) udalost.setAllDayDate(celyDen); else udalost.setTime(new Date(d.start), new Date(d.end));
        udalost.setLocation(d.place || '');
        udalost.setDescription(d.desc || '');
      } catch (x) { udalost = null; }
    }
    if (!udalost) {
      const viac = { location: d.place || '', description: d.desc || '' };
      udalost = d.allDay ? kal.createAllDayEvent(d.title, celyDen, viac) : kal.createEvent(d.title, new Date(d.start), new Date(d.end), viac);
      zoznam.setProperty(d.uid, udalost.getId());
    }
    return odpoved({ ok: true });
  } catch (err) {
    return odpoved({ ok: false, error: String(err) });
  }
}

function odpoved(o) {
  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);
}

/* ---- stránka s ponukou pre zákazníka ---- */
function doGet(e) {
  const pid = (e.parameter || {}).p, q = pid ? ponuka(pid) : null;
  if (!q) return stranka('<div class="box exp"><h2>Ponuka sa nenašla</h2><p>Odkaz je neplatný alebo ponuka už nie je zdieľaná.</p></div>', 'Cenová ponuka');
  return stranka(ponukaHtml(q, pid), 'Cenová ponuka ' + (q.number || ''));
}
function ponuka(pid) {
  const raw = PropertiesService.getScriptProperties().getProperty('p_' + pid);
  return raw ? JSON.parse(raw) : null;
}
function vyprsala(q) {
  return !!q.validUntil && q.validUntil < Utilities.formatDate(new Date(), Session.getScriptTimeZone(), 'yyyy-MM-dd');
}
function odpovedZakaznika(p) {
  const pid = p.ponuka, text = String(p.text || '').trim().slice(0, 1000);
  let q = ponuka(pid), info = null;
  if (!q) return doGet({ parameter: {} });
  const vars = q.variants || [], vi = vars.length > 1 ? parseInt(p.variant, 10) : (vars.length ? 0 : -1);
  if (!q._approved && !q._rejected && !vyprsala(q)) {
    if (p.akcia === 'schvalit' && vars.length > 1 && !(vi >= 0 && vi < vars.length)) info = { chyba: 'Kliknutím na riadok vyberte variant zariadenia, ktorý chcete.', sel: -1, text: text };
    else if (p.akcia === 'pripomienka' && !text) info = { chyba: 'Napíšte, prosím, pripomienku do poľa nad tlačidlami.', sel: vi, text: text };
    else {
      const teraz = new Date().toISOString();
      if (text) q._notes = (q._notes || []).concat({ at: teraz, text: text });
      if (p.akcia === 'schvalit') { q._approved = true; q._approvedAt = teraz; if (vi >= 0) { q._variant = vi; q._variantId = vars[vi].id || ''; } }
      else if (p.akcia === 'zamietnut') { q._rejected = true; q._rejectedAt = teraz; }
      else info = { ok: 'Pripomienky sme prijali. Ďakujeme, ozveme sa Vám.' };
      try { PropertiesService.getScriptProperties().setProperty('p_' + pid, JSON.stringify(q)); }
      catch (x) { q = ponuka(pid); info = { chyba: 'Text sa nepodarilo uložiť, je príliš dlhý. Skráťte ho, prosím, alebo nám zavolajte.', sel: vi, text: text }; }
    }
  }
  return stranka(ponukaHtml(q, pid, info), 'Cenová ponuka ' + (q.number || ''));
}
function den(iso) { return Utilities.formatDate(new Date(iso), Session.getScriptTimeZone(), 'd. M. yyyy'); }
function ponukaHtml(q, pid, info) {
  let riadky = '';
  (q.items || []).forEach(function (it) {
    riadky += it.group
      ? '<tr class="band ' + esc(it.kind) + '"><td colspan="4">' + esc(it.group) + '</td></tr>'
      : '<tr><td>' + esc(it.name) + '</td><td class="c">' + esc(it.unit) + '</td><td class="c">' + mnozstvo(it.qty) + '</td><td class="r">' + eur(it.total) + '</td></tr>';
  });
  const vars = q.variants || [];
  const otvorena = !q._approved && !q._rejected && !vyprsala(q), vyber = otvorena && vars.length > 1;
  let varianty = '';
  if (vars.length) {
    varianty = '<h2 class="vh">Varianty zariadenia</h2><table class="vt' + (vyber ? ' pick' : '') + '"><thead><tr><th>Variant</th><th>Zariadenie</th><th class="r hm">Cena zariadenia</th><th class="r">Cena spolu</th></tr></thead><tbody>'
      + vars.map(function (v, i) {
        const id = 'v' + i, kluc = 'ABCDEFGHIJ'.charAt(i), vybrany = !!q._approved && q._variant === i;
        const c = function (t) { return vyber ? '<label for="' + id + '">' + t + '</label>' : t; };

      }).join('')
      + '</tbody></table><p class="vn">' + (vyber ? 'Kliknutím na riadok vyberte variant, ktorý chcete. ' : '') + 'Cena spolu = spoločné položky + zariadenie zvoleného variantu.</p>';
  }
  const poznamky = (q._notes || []).length ? '<div class="notes"><h3>Vaše pripomienky</h3>' + q._notes.map(function (n) { return '<p><span>' + den(n.at) + '</span>' + esc(n.text) + '</p>'; }).join('') + '</div>' : '';
  let stav;
  if (q._approved) stav = '<div class="box ok"><h2>Ponuka je schválená</h2><p>Ďakujeme. Schválené ' + den(q._approvedAt) + (vars.length > 1 && vars[q._variant] ? ', variant ' + 'ABCDEFGHIJ'.charAt(q._variant) + ' (' + esc(vars[q._variant].name) + ')' : '') + '. Ozveme sa Vám s termínom.</p></div>';
  else if (q._rejected) stav = '<div class="box no"><h2>Ponuku ste zamietli</h2><p>Zamietnuté ' + den(q._rejectedAt) + '. Ak ste si to rozmysleli, ozvite sa nám.</p></div>';
  else if (vyprsala(q)) stav = '<div class="box exp"><p>Platnosť tejto ponuky vypršala. Ozvite sa nám, pripravíme novú.</p></div>';
  else stav = (info ? '<div class="box ' + (info.ok ? 'ok' : 'exp') + '"><p>' + esc(info.ok || info.chyba) + '</p></div>' : '')
    + '<form class="appr" id="pf" method="post" action="' + esc(q.url) + '" target="_top"><input type="hidden" name="ponuka" value="' + esc(pid) + '">'
    + '<label for="text">Pripomienky alebo otázky k ponuke (nepovinné)</label>'
    + '<textarea id="text" name="text" maxlength="1000" placeholder="Napíšte, čo by ste chceli zmeniť alebo doplniť.">' + esc(info && info.text || '') + '</textarea>'

    + '<p>Schválením potvrdíte, že s ponukou súhlasíte. Text z poľa sa odošle spolu s Vašou odpoveďou.</p></form>';
  stav = poznamky + stav;
  return '<div class="top"><div><h1>' + esc(q.company || 'Cenová ponuka') + '</h1><div class="sup">' + (q.sup || []).map(esc).join('<br>') + '</div></div>'
    + '<div class="meta"><div><span>Cenová ponuka č.</span><b>' + esc(q.number) + '</b></div><div><span>Dátum</span><b>' + datum(q.date) + '</b></div>' + (q.validUntil ? '<div><span>Platnosť do</span><b>' + datum(q.validUntil) + '</b></div>' : '') + '</div></div>'
    + '<div class="cust"><small>Zákazník</small><b>' + esc(q.custName || '–') + '</b>' + esc(q.custInfo) + '</div>'
    + '<div class="tw"><table><thead><tr><th>Popis položky</th><th class="c"><span class="hm">Merná jednotka</span><span class="sm">MJ</span></th><th class="c"><span class="hm">Množstvo</span><span class="sm">Počet</span></th><th class="r">Cena<span class="hm"> spolu</span></th></tr></thead><tbody>' + riadky + '</tbody></table></div>'
    + '<div class="total"><div><span>' + (vars.length ? 'Spoločné položky spolu' : 'Spolu') + '</span><b>' + eur(q.total) + '</b></div></div>'
    + (varianty ? '<div class="tw">' + varianty + '</div>' : '')
    + (q.note ? '<div class="note">' + esc(q.note) + '</div>' : '') + (q.footer ? '<div class="foot">' + esc(q.footer) + '</div>' : '')
    + stav;
}
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function eur(n) { return (+n || 0).toFixed(2).replace('.', ',').replace(/\\B(?=(\\d{3})+(?!\\d))/g, ' ') + ' €'; }

const calDur = v => parseFloat(String(v||'').replace(',','.'))||2;
/* čo sa má o termíne poslať do kalendára; null = v kalendári nemá byť */
function calInfo(kind,o){
  if(kind==='mo'){
    if(!o.plannedDate) return null;
    const c=o.customer||{};
    return {uid:'mo-'+o.id,date:o.plannedDate,time:o.plannedTime||'',dur:calDur(o.plannedDur),title:'Montáž – '+(c.name||'bez mena'),place:c.address||'',
      desc:[c.name,c.phone?'Tel.: '+c.phone:'',o.number?'Zákazka č. '+o.number:''].filter(Boolean).join('\n')};
  }
  const c=custList().find(x=>x.key===custKey(o.customer))||{};
  return {uid:o.id,date:o.date,time:o.time||'',dur:calDur(o.dur),title:[EV_TYPES[o.type]||'Udalosť',o.title,o.customer].filter(Boolean).join(' – '),place:o.place||c.address||'',
    desc:[o.customer,c.phone?'Tel.: '+c.phone:'',o.note].filter(Boolean).join('\n')};
}
const calSend = body => window.klimaCal.call({url:calUrl(),body:Object.assign({token:calToken()},body)});
const calBusy=new Set(), calTimers={};
const calSyncSoon = (kind,o) => { clearTimeout(calTimers[o.id]); calTimers[o.id]=setTimeout(()=>calSync(kind,o),1500); };
/* vráti true, ak sa do kalendára niečo poslalo */
async function calSync(kind,o,removed,quiet){
  if(!calOn()) return false;
  if(calBusy.has(o.id)){ if(!removed) calSyncSoon(kind,o); return false; }
  const info=removed?null:calInfo(kind,o), sig=info?JSON.stringify(info):'';
  if(sig===(o.gcalSig||'')) return false;          // nič podstatné sa nezmenilo alebo termín v kalendári nikdy nebol
  calBusy.add(o.id);
  try{
    let body;
    if(info){
      body={action:'upsert',uid:info.uid,title:info.title,place:info.place,desc:info.desc,date:info.date,allDay:!info.time};
      if(info.time){ const a=new Date(info.date+'T'+info.time); body.start=a.toISOString(); body.end=new Date(a.getTime()+info.dur*36e5).toISOString(); }
    } else body={action:'delete',uid:JSON.parse(o.gcalSig).uid};
    const r=await calSend(body);
    if(!r.ok){ toast('Kalendár sa nepodarilo aktualizovať: '+r.error); return false; }
    o.gcalSig=sig;
    if(!removed) await persist((kind==='mo'?'montaze/':'events/')+o.id,o);
    if(!quiet) toast(info?'Termín je zapísaný v Google kalendári.':'Termín je z Google kalendára odstránený.');
    return true;
  } finally { calBusy.delete(o.id); }
}
async function calTest(){
  if(!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(calUrl())){ toast('Adresa má začínať https://script.google.com/macros/s/ a končiť /exec.'); return; }
  await persist('app/settings',S.settings);
  const r=await calSend({action:'ping'});
  S.calState=r.ok?'Prepojené s kalendárom „'+r.calendar+'“.':'Nepodarilo sa: '+r.error; S.calOk=!!r.ok; renderView();
}
/* po nastavení: pošle do kalendára všetky dnešné a budúce termíny */
async function calSyncAll(){
  if(!calOn()){ toast('Najprv vlož adresu skriptu a otestuj prepojenie.'); return; }
  let n=0;
  for(const m of S.montaze) if(m.plannedDate&&m.plannedDate>=today()){ delete m.gcalSig; if(await calSync('mo',m,false,true)) n++; }
  for(const e of S.events) if(e.date>=today()){ delete e.gcalSig; if(await calSync('ev',e,false,true)) n++; }
  toast(n?'Do Google kalendára zapísaných termínov: '+n+'.':'Žiadne dnešné ani budúce termíny na zapísanie.');
}

const cpStatus = d => ['odoslana','prijata','zamietnuta'].includes(d.status) ? d.status : 'odoslana';

/* ---- fotky v montáži (len v nainštalovanej aplikácii – window.klimaPhotos dodáva Electron).
        Záznam fotky {id,file,type,caption,takenAt,addedAt,source,size,w,h}; source je pripravený aj pre budúcu aplikáciu v telefóne. ---- */
const PH_TYPES={stitok:'Štítok zariadenia',pred:'Pred montážou',po:'Po montáži',ine:'Iné'};
const PH_MAX=250000;   // bajtov na fotku
const phFolder = m => (m.number?'Zakazka-'+m.number:'Montaz-'+m.id).replace(/[^\w.-]+/g,'_');
const phUrl = p => (p.storage==='cloud'||!S.ph)?'':S.ph.baseUrl+'/'+p.file.split('/').map(encodeURIComponent).join('/');
const phBlobs = new Map();
const PH_BLANK = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
async function phHydrate(){
  await Promise.all([...document.querySelectorAll('img[data-ps]')].map(async img=>{
    const f=img.dataset.ps;
    try{ let u=phBlobs.get(f); if(!u){ const r=await Cloud.sto('GET','authenticated/fotky/'+f); u=URL.createObjectURL(await r.blob()); phBlobs.set(f,u); } img.src=u; }
    catch(e){ img.alt='Fotku sa nepodarilo načítať'; }
  }));
}
const blobB64 = blob => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result.split(',')[1]); r.onerror=rej; r.readAsDataURL(blob); });
async function phUploadLocal(){
  const todo=[]; for(const m of S.montaze) for(const p of (m.photos||[])) if(p.storage!=='cloud') todo.push([m,p]);
  if(!todo.length){ toast('Všetky fotky už sú v spoločnej databáze.'); return; }
  let ok=0, bad=0; toast('Nahrávam '+todo.length+' fotiek…');
  const touched=new Set();
  for(const [m,p] of todo){
    try{
      const r=await window.klimaPhotos.read({file:p.file}); if(!r.ok) throw new Error(r.error);
      const bin=Uint8Array.from(atob(r.base64),c=>c.charCodeAt(0)), file=m.id+'/'+p.id+'.jpg';
      await Cloud.sto('POST','fotky/'+file,{headers:{'Content-Type':'image/jpeg'},body:new Blob([bin],{type:'image/jpeg'})});
      p.file=file; p.storage='cloud'; touched.add(m); ok++;
    }catch(e){ bad++; }
  }
  for(const m of touched) await persist('montaze/'+m.id,m);
  renderView(); toast('Nahrané fotky: '+ok+(bad?' · '+bad+' sa nepodarilo (chýba súbor alebo oprávnenie)':'')+'.');
}
async function phShrink(file){
  const bmp=await createImageBitmap(file,{imageOrientation:'from-image'});
  let scale=Math.min(1,1600/Math.max(bmp.width,bmp.height)), q=.85;
  for(;;){
    const w=Math.max(1,Math.round(bmp.width*scale)), h=Math.max(1,Math.round(bmp.height*scale));
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,w,h); g.drawImage(bmp,0,0,w,h);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',q));
    if(blob.size<=PH_MAX||w<=320){ bmp.close(); return {blob,w,h}; }
    if(q>.6) q-=.1; else scale*=.8;
  }
}
async function phAdd(m,files){
  if(!m||!files.length) return;
  let ok=0, bad=0;
  for(const f of files){
    try{
      const {blob,w,h}=await phShrink(f), id='ph-'+uid();
      let fileRef, storage;
      if(Cloud.on){ fileRef=m.id+'/'+id+'.jpg'; await Cloud.sto('POST','fotky/'+fileRef,{headers:{'Content-Type':'image/jpeg'},body:blob}); storage='cloud'; }
      else { const base64=await blobB64(blob); const r=await window.klimaPhotos.save({folder:phFolder(m),name:id+'.jpg',base64}); if(!r.ok) throw new Error(r.error); fileRef=r.file; }
      (m.photos=m.photos||[]).push({id,file:fileRef,storage,type:'ine',caption:'',takenAt:new Date(f.lastModified||Date.now()).toISOString(),addedAt:new Date().toISOString(),source:'pc',size:blob.size,w,h});
      ok++;
    }catch(e){ bad++; }
  }
  await persist('montaze/'+m.id,m); renderView();
  toast((ok?(ok===1?'Pridaná 1 fotka':'Pridané fotky: '+ok):'Fotky sa nepodarilo pridať')+(bad?` · ${bad} sa nepodarilo načítať (napr. formát HEIC – ulož ich ako JPG)`:'')+'.');
}

async function moFinish(m){
  if(m.status==='hotova') return;
  const why=`Montáž ${m.number||''} – ${m.customer.name||'bez mena'}`.replace('  ',' ');

  for(const l of moDeductList(m)){ const si=S.sklad.items.find(x=>x.id===l.stockId); if(si){ si.stock=r3(si.stock-l.qty); skLog(si,-l.qty,why); ded.push({stockId:si.id,qty:l.qty}); } }
  m.status='hotova'; m.completedAt=new Date().toISOString(); m.deductions=ded; if(!m.startDate) m.startDate=today();
  if(ded.length) await skSave();
  await persist('montaze/'+m.id,m);
  const d=S.quotes.find(q=>q.id===m.quoteId); if(d&&d.status!=='prijata'){ d.status='prijata'; await cpSave(d); }
  renderView(); toast(ded.length?`Montáž ukončená, zo skladu odpočítaných ${ded.length} položiek.`:'Montáž ukončená.');
}

}

const gsNorm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
let GS=[];
function gsFind(query){
  const q=gsNorm(query.trim()); if(q.length<2) return [];
  const hit=(...v)=>v.some(x=>gsNorm(x).includes(q)), out=[], add=(g,t,s,go)=>{ if(out.filter(x=>x.g===g).length<8) out.push({g,t,s,go}); };
  for(const c of custList()) if(hit(c.name,c.phone,c.email,c.address,c.note)) add('Zákazníci',c.name,[c.phone,c.email,c.address].filter(Boolean).join(' · '),{k:'zak',id:c.key,q:c.name});
  for(const d of S.quotes){ const c=d.customer||{}; if(hit(d.number,c.name,c.address,c.phone,d.statusNote)) add('Cenové ponuky','Ponuka č. '+(d.number||'–')+' – '+(c.name||'bez mena'),[dfmt(d.date),eur(d.totals?.total),CP_PILL[cpState(d)][1]].join(' · '),{k:'cp',q:d.number||c.name||''}); }
  for(const m of S.montaze){ const c=m.customer||{}; if(hit(m.number,c.name,c.address,c.phone,m.indoorModel,m.indoorSerial,m.outdoorModel,m.outdoorSerial,m.notes)) add('Montáže','Montáž '+(m.number||'')+' – '+(c.name||'bez mena'),[m.indoorModel,m.indoorSerial?'SN '+m.indoorSerial:'',m.outdoorSerial?'SN '+m.outdoorSerial:''].filter(Boolean).join(' · '),{k:'mo',id:m.id}); }
  for(const c of S.cases) if(hit(c.customer,c.problem,c.work)) add(c.type==='rekl'?'Reklamácie':'Servisné zásahy',(c.customer||'bez mena')+' – '+(c.problem||'bez popisu'),[c.date?dfmt(c.date):'',csDevice(c)].filter(Boolean).join(' · '),{k:'cs',id:c.id,tab:CS[c.type].tab});
  for(const it of S.sklad.items) if(hit(it.name,it.spec)) add('Sklad',it.name||'(bez názvu)','skladom '+fq(it.stock)+' '+it.unit,{k:'sklad',q:it.name});
  for(const t of S.tools.items) if(hit(t.name,t.model,t.serial,t.holder,t.location)) add('Náradie',t.name||'(bez názvu)',[t.model,t.serial?'SN '+t.serial:''].filter(Boolean).join(' · '),{k:'naradie',q:t.name});
  return out;
}
function gsRender(){
  const box=$('#gs-res'), q=$('#gs').value; GS=gsFind(q);
  box.hidden=q.trim().length<2;
  let g='';
  box.innerHTML=GS.length?GS.map((r,i)=>(r.g!==g?`<div class="gs-g">${g=r.g}</div>`:'')+`<button class="gs-item ${i?'':'on'}" data-i="${i}">${esc(r.t)}${r.s?`<small>${esc(r.s)}</small>`:''}</button>`).join(''):'<div class="gs-g">Nič sa nenašlo</div>';
}
function gsGo(r){
  const go=r.go; let key=go.k;
  if(go.k==='zak'){ S.cuQuery=go.q; S.cuOpen=go.id; }
  else if(go.k==='cp'){ S.cpQuery=go.q; S.cpFilter='all'; S.cpTab='cp'; S.moId=null; }
  else if(go.k==='mo'){ S.moId=go.id; S.cpTab='mont'; key='cp'; }
  else if(go.k==='cs'){ S.svTab=go.tab; S.csOpen=go.id; key='servis'; }
  else if(go.k==='sklad'){ S.skQuery=go.q; S.skFilter='all'; S.skTab='zoznam'; }
  else if(go.k==='naradie'){ S.tlQuery=go.q; S.tlFilter='all'; }
  $('#gs').value=''; $('#gs-res').hidden=true;
  S.module=key; location.hash='#'+MODULES.find(m=>m.key===key).hash; renderAll();
}
$('#gs').addEventListener('input',gsRender);
$('#gs').addEventListener('focus',()=>{ if($('#gs').value.trim().length>=2) gsRender(); });
$('#gs').addEventListener('keydown',e=>{ if(e.key==='Enter'&&GS.length) gsGo(GS[0]); else if(e.key==='Escape'){ $('#gs-res').hidden=true; $('#gs').blur(); } });
$('#gs-res').addEventListener('click',e=>{ const b=e.target.closest('.gs-item'); if(b) gsGo(GS[+b.dataset.i]); });
document.addEventListener('click',e=>{ if(!e.target.closest('.gs')) $('#gs-res').hidden=true; });
document.addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'&&!$('#lock')){ e.preventDefault(); $('#gs').focus(); $('#gs').select(); } });

/* ============ zámok aplikácie na PIN. Je to zámok obrazovky – údaje na disku nešifruje. ============ */
async function pinHash(pin){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('klima-office:'+pin));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
/* zamkne aplikáciu; vráti promise, ktorý sa splní po odomknutí */
function lockShow(){
  if($('#lock')) return Promise.resolve();
  closeMail(); $('.app').inert=true;
  const ov=document.createElement('div'); ov.id='lock'; let code='';
  ov.innerHTML=`<form class="lock-box"><div class="brand-mark">${ICON.lock}</div><h2>Klima Office je zamknutá</h2>
    <input type="password" id="lock-pin" autocomplete="off" placeholder="PIN">
    <button class="btn primary" type="submit">Odomknúť</button>
    <div class="lock-msg" id="lock-msg"></div>
    ${window.klimaMail?'<button class="link" type="button" id="lock-forgot">Zabudol som PIN</button>':''}</form>`;
  document.body.appendChild(ov);
  const pin=$('#lock-pin'), msg=t=>{ $('#lock-msg').textContent=t; };
  pin.focus();
  return new Promise(done=>{
    const open=()=>{ ov.remove(); $('.app').inert=false; done(); };
    ov.querySelector('form').addEventListener('submit',async e=>{
      e.preventDefault(); const v=pin.value.trim(); if(!v) return;
      if(code&&v===code){ delete S.settings.pinHash; await persist('app/settings',S.settings); open(); renderAll(); toast('PIN je zrušený. Nový si nastavíš v záložke Moje údaje.'); }
      else if(await pinHash(v)===S.settings.pinHash) open();
      else{ msg('Nesprávny PIN.'); pin.value=''; pin.focus(); }
    });
    const fg=$('#lock-forgot'); if(fg) fg.addEventListener('click',async()=>{
      const cfg=await window.klimaMail.getConfig();
      if(!cfg.hasPass){ msg('Odosielanie mailov nie je nastavené, kód sa nedá poslať.'); return; }
      fg.disabled=true; msg('Posielam kód…');
      const c=String(crypto.getRandomValues(new Uint32Array(1))[0]%1000000).padStart(6,'0');
      const r=await window.klimaMail.send({to:[cfg.user],cc:[],bcc:[],fromName:'Klima Office',subject:'Klima Office – kód na zrušenie PIN-u',text:'Kód na zrušenie PIN-u v aplikácii Klima Office: '+c+'\n\nZadaj ho namiesto PIN-u. Platí, kým aplikáciu nezavrieš.'});
      fg.disabled=false;
      if(r.ok){ code=c; msg('Kód som poslal na '+cfg.user+'. Zadaj ho namiesto PIN-u.'); pin.focus(); } else msg(r.error);
    });
  });
}
async function pinSave(off){
  const cur=$('#pin-cur'), n1=$('#pin-new'), n2=$('#pin-new2');
  if(S.settings.pinHash && await pinHash(cur.value.trim())!==S.settings.pinHash){ toast('Aktuálny PIN nesedí.'); return; }
  if(off){ delete S.settings.pinHash; await persist('app/settings',S.settings); renderAll(); toast('Zámok je vypnutý.'); return; }
  const v=n1.value.trim();
  if(v.length<4){ toast('PIN musí mať aspoň 4 znaky.'); return; }
  if(v!==n2.value.trim()){ toast('Nový PIN sa v oboch poliach nezhoduje.'); return; }
  S.settings.pinHash=await pinHash(v); await persist('app/settings',S.settings); renderAll(); toast('Zámok je zapnutý. PIN sa bude pýtať pri spustení.');
}
function viewPin(){
  const on=!!S.settings.pinHash, f=(id,l)=>`<label class="f">${l}<input type="password" id="${id}" autocomplete="off"></label>`;
  return `<section class="card" style="max-width:760px"><div class="card-head"><h3>Zámok aplikácie</h3><span class="badge ${on?'ok':'off'}">${on?'Zapnutý':'Vypnutý'}</span></div>
  <p class="hint">Pri spustení bude aplikácia pýtať PIN. Je to zámok obrazovky: chráni pred cudzím pohľadom, údaje na disku nešifruje. ${window.klimaMail?'Ak PIN zabudneš, aplikácia pošle kód na jeho zrušenie na tvoj Gmail – treba mať nastavené odosielanie mailov.':'V prehliadači sa zabudnutý PIN nedá obnoviť.'}</p>
  <div class="form-grid" style="grid-template-columns:repeat(3,minmax(0,1fr))">${on?f('pin-cur','Aktuálny PIN'):''}${f('pin-new',on?'Nový PIN':'PIN (aspoň 4 znaky)')}${f('pin-new2',on?'Nový PIN znova':'PIN znova')}</div>
  <div style="display:flex;gap:8px;margin-top:12px"><button class="btn primary" data-act="pin-save">${on?'Zmeniť PIN':'Zapnúť zámok'}</button>${on?'<button class="btn ghost danger" data-act="pin-off">Vypnúť zámok</button>':''}</div></section>`;
}
$('#lock-now').addEventListener('click',()=>{ if(S.settings.pinHash) lockShow(); });

/* ============ štart ============ */
async function boot(){
  routeFromHash(); renderAll();
  await Store.init(); await Cloud.start();
  try{
    const [cat,set,dr,sk,qs,ms,nr,cu,ev,ex,cs]=await Promise.all([Store.get('app/catalog'),Store.get('app/settings'),Store.get('app/draft'),Store.get('app/sklad'),Store.list('quotes'),Store.list('montaze'),Store.get('app/naradie'),Store.list('customers'),Store.list('events'),Store.list('expenses'),Store.list('cases')]);
    S.customers=cu||[]; S.events=ev||[]; S.expenses=ex||[]; S.cases=cs||[];
    if(nr&&Array.isArray(nr.items)) S.tools={items:nr.items,log:nr.log||[]};
    S.quotes=(qs||[]).map(d=>Object.assign(d,{status:cpStatus(d)})); S.montaze=ms||[];
    if(sk&&Array.isArray(sk.items)) S.sklad={items:sk.items,log:sk.log||[]};
    if(cat&&Array.isArray(cat.rows)&&cat.rows.length) S.catalog.rows=cat.rows;
    if(set) Object.assign(S.settings,set);
    if(dr&&dr.q){ const q=dr.q; Q=Object.assign(newQuote(),q,{customer:Object.assign(newQuote().customer,q.customer||{}),lines:q.lines||{},custom:q.custom||[],variants:q.variants||[]}); }
    await migrate();
    setStatus(Store.db?'cloud':'local'); if(Cloud.offline) setStatus('err');
  }catch(e){ Store.ok=false; setStatus('err'); }
  const unlocked=S.settings.pinHash?lockShow():Promise.resolve();
  S.loaded=true; renderAll();
  if(window.klimaPhotos){ try{ S.ph=await window.klimaPhotos.getConfig(); }catch(e){} }
  if(window.klimaBackup){ try{ S.bk=await window.klimaBackup.getConfig(); await autoBackup(); setInterval(()=>autoBackup(),3600e3); }catch(e){} renderView(); }
  await unlocked;
  shareCheckSoon();
  const nf=S.quotes.filter(cpNeedsFollow).length;
  if(nf) toast((nf===1?'1 ponuka čaká':nf<5?nf+' ponuky čakajú':nf+' ponúk čaká')+` na odpoveď dlhšie ako ${CP_FOLLOW_DAYS} dní.`,'Zobraziť',()=>{ S.moId=null; S.cpTab='cp'; S.cpFilter='follow'; S.module='cp'; location.hash='#evidencia-cp'; renderAll(); });
}
boot();
</script>
