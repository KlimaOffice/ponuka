    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><select data-ob="year" style="width:110px">${years.map(y=>`<option ${y===S.obYear?'selected':''}>${y}</option>`).join('')}</select>
    ${S.obTab==='prehlad'?`<div class="seg">${basis('hotove','Ukončené montáže')}${basis('prijate','+ prijaté ponuky')}</div>`:''}
    <div class="seg">${tab('prehlad','Prehľad')}${tab('vydavky','Výdavky')}${tab('uspech','Úspešnosť ponúk')}${tab('ludia','Podľa ľudí')}</div></div></div>`;
}
function obYears(recsAll){
  const ys=[new Date().getFullYear(),...recsAll.map(r=>+r.date.slice(0,4)),...S.expenses.map(e=>+(e.date||'').slice(0,4)),...S.quotes.map(d=>+(d.date||'').slice(0,4))].filter(Boolean);
  const years=[...new Set(ys)].sort((a,b)=>b-a); if(!years.includes(S.obYear)) S.obYear=years[0]; return years;
}
function viewObrat(){
  const recsAll=obRecords(S.obBasis==='prijate');
  const years=obYears(recsAll);
  if(S.obTab==='vydavky') return viewVydavky(years);
  if(S.obTab==='uspech') return viewUspech(years);
  if(S.obTab==='ludia') return viewLudia(years);
  const recs=recsAll.filter(r=>+r.date.slice(0,4)===S.obYear);
  OB_AGG=Array.from({length:12},()=>({total:0,cost:0,profit:0,n:0,exp:0,net:0}));
  for(const r of recs){ const a=OB_AGG[(+r.date.slice(5,7)||1)-1]; a.total+=r.total; a.cost+=r.cost; a.profit+=r.profit; a.n++; }
  for(const e of S.expenses){ if(+(e.date||'').slice(0,4)!==S.obYear) continue; OB_AGG[(+e.date.slice(5,7)||1)-1].exp+=(+e.amount||0); }
  OB_AGG.forEach(a=>a.net=a.profit-a.exp);
  const T=OB_AGG.reduce((s,a)=>({total:s.total+a.total,cost:s.cost+a.cost,profit:s.profit+a.profit,n:s.n+a.n,exp:s.exp+a.exp,net:s.net+a.net}),{total:0,cost:0,profit:0,n:0,exp:0,net:0});
  const pend=S.quotes.filter(d=>cpStatus(d)==='prijata'&&!S.montaze.some(m=>m.quoteId===d.id&&m.status==='hotova'));
  const pendSum=pend.reduce((s,d)=>s+(d.totals?.total||0),0);
  const kpi=(l,v,sub)=>`<div class="stat"><small>${l}</small><b>${v}</b><span>${sub}</span></div>`;
  const marg=T.total>0?nf.format(T.profit/T.total*100)+' %':'–';
  const byC={}; for(const r of recs){ const k=r.name.toLowerCase(); (byC[k]=byC[k]||{name:r.name,total:0,profit:0,n:0}); byC[k].total+=r.total; byC[k].profit+=r.profit; byC[k].n++; }
  const top=Object.values(byC).sort((a,b)=>b.total-a.total).slice(0,6), topMax=Math.max(1,...top.map(t=>t.total));
  const rows=OB_AGG.map((a,i)=>(a.n||a.exp)?`<tr><td>${MON_L[i]}</td><td class="num">${a.n}</td><td class="num">${eur(a.total)}</td><td class="num">${eur(a.profit)}</td><td class="num">${eur(a.exp)}</td><td class="num"><b>${eur(a.net)}</b></td></tr>`:'').join('');
  const show=T.n||T.exp>0;
  return obHead(years,'Obrat z ukončených montáží, výdavky zadáš v záložke Výdavky.')+`
  <div class="stats k4">${kpi('Obrat '+S.obYear,eur(T.total),T.n+(T.n===1?' zákazka':T.n>=2&&T.n<=4?' zákazky':' zákaziek')+(T.n?' · priemer '+eur(T.total/T.n):''))}${kpi('Hrubý zisk',eur(T.profit),'marža '+marg+' · nákup '+eur(T.cost))}${kpi('Výdavky',eur(T.exp),T.exp?'zo záložky Výdavky':'zatiaľ žiadne')}${kpi('Čistý zisk',eur(T.net),'hrubý zisk mínus výdavky')}</div>
  ${pend.length&&S.obBasis==='hotove'?`<p class="hint" style="margin:-6px 2px 16px">Čaká na ukončenie montáže: <b>${pend.length}</b> ${pend.length===1?'prijatá ponuka':pend.length<=4?'prijaté ponuky':'prijatých ponúk'} za ${eur(pendSum)} – do obratu sa započítajú po ukončení montáže.</p>`:''}

function viewLudia(years){
  const by={}; let tot={n:0,total:0,cost:0,profit:0};
  for(const m of S.montaze){
    if(m.status!=='hotova') continue;
    const d=S.quotes.find(q=>q.id===m.quoteId), date=((m.startDate||m.completedAt||'').slice(0,10))||(d&&d.date)||'';
    if(+date.slice(0,4)!==S.obYear) continue;
    const w=(m.worker||'').trim()||'(bez mena)', a=by[w]=by[w]||{name:w,n:0,total:0,cost:0,profit:0};
    for(const x of [a,tot]){ x.n++; if(d){ x.total+=d.totals?.total||0; x.cost+=d.totals?.cost||0; x.profit+=d.totals?.profit||0; } }
  }
  const rows=Object.values(by).sort((a,b)=>b.total-a.total);
  return obHead(years,'Ukončené montáže podľa pracovníka (podľa mena v poli „Montážny pracovník“ v protokole)')+`<section class="card"><div class="tablewrap"><table><thead><tr><th>Pracovník</th><th class="r">Montáží</th><th class="r">Obrat</th><th class="r">Náklady na materiál</th><th class="r">Zisk</th><th class="r">Zisk na montáž</th></tr></thead><tbody>
    ${rows.length?rows.map(a=>`<tr><td>${esc(a.name)}</td><td class="r">${a.n}</td><td class="r">${eur(a.total)}</td><td class="r">${eur(a.cost)}</td><td class="r">${eur(a.profit)}</td><td class="r">${eur(a.n?a.profit/a.n:0)}</td></tr>`).join('')+`<tr><td><b>Spolu</b></td><td class="r"><b>${tot.n}</b></td><td class="r"><b>${eur(tot.total)}</b></td><td class="r"><b>${eur(tot.cost)}</b></td><td class="r"><b>${eur(tot.profit)}</b></td><td class="r"><b>${eur(tot.n?tot.profit/tot.n:0)}</b></td></tr>`:'<tr><td colspan="6" class="hint">V tomto roku zatiaľ žiadne ukončené montáže.</td></tr>'}</tbody></table></div>
    <p class="hint" style="margin:12px 0 0">Meno pracovníka vyplň v protokole montáže v poli „Montážny pracovník“. Montáže bez ponuky sa do súm nepočítajú.</p></section>`;
}
function viewUspech(years){
  const blank=()=>({n:0,ok:0,no:0,exp:0,wait:0,sum:0,okSum:0,okProfit:0});
  const agg=Array.from({length:12},blank), T=blank();
  for(const d of S.quotes){
    if(+(d.date||'').slice(0,4)!==S.obYear) continue;
    const st=cpState(d), tot=d.totals?.total||0;
    for(const a of [agg[(+d.date.slice(5,7)||1)-1],T]){
      a.n++; a.sum+=tot;
      if(st==='prijata'){ a.ok++; a.okSum+=tot; a.okProfit+=d.totals?.profit||0; }
      else if(st==='zamietnuta') a.no++; else if(st==='prepadla') a.exp++; else a.wait++;
    }
  }
  const dec=a=>a.ok+a.no+a.exp;
  const rate=a=>dec(a)?nf.format(a.ok/dec(a)*100)+' %':'–';
  const marg=a=>a.okSum>0?nf.format(a.okProfit/a.okSum*100)+' %':'–';
  const avg=a=>a.n?eur(a.sum/a.n):'–';
  const kpi=(l,v,sub)=>`<div class="stat"><small>${l}</small><b>${v}</b><span>${sub}</span></div>`;
  const row=(l,a,cls='')=>`<tr class="${cls}"><td>${l}</td><td class="num">${a.n}</td><td class="num">${a.ok}</td><td class="num">${a.no}</td><td class="num">${a.exp}</td><td class="num">${a.wait}</td><td class="num"><b>${rate(a)}</b></td><td class="num">${avg(a)}</td><td class="num">${marg(a)}</td></tr>`;
  const rows=agg.map((a,i)=>a.n?row(MON_L[i],a):'').join('');
  return obHead(years,'Koľko ponúk zákazníci prijali. Počítajú sa všetky uložené ponuky podľa dátumu ponuky.')+`
  <div class="stats k4">${kpi('Úspešnosť '+S.obYear,rate(T),dec(T)?`prijaté ${T.ok} z ${dec(T)} vyhodnotených`:'zatiaľ nič vyhodnotené')}${kpi('Ponúk spolu',T.n,`čaká na odpoveď ${T.wait}`)}${kpi('Priemerná hodnota ponuky',avg(T),T.ok?'prijatej '+eur(T.okSum/T.ok):'žiadna prijatá')}${kpi('Marža prijatých ponúk',marg(T),'zisk '+eur(T.okProfit))}</div>
  <section class="card"><h3>Podľa mesiacov</h3>${T.n?`<div class="tablewrap"><table><thead><tr><th>Mesiac</th><th class="r">Ponúk</th><th class="r">Prijaté</th><th class="r">Zamietnuté</th><th class="r">Vypršané</th><th class="r">Čaká</th><th class="r">Úspešnosť</th><th class="r">Priem. hodnota</th><th class="r">Marža prijatých</th></tr></thead>
    <tbody>${rows}${row('Spolu',T,'totalrow')}</tbody></table></div>
    <p class="hint" style="margin:12px 0 0">Úspešnosť = prijaté ÷ (prijaté + zamietnuté + vypršané). Ponuky, ktoré ešte čakajú na odpoveď, sa nepočítajú.</p>`
    :`<p class="hint" style="margin:20px 0">V roku ${S.obYear} zatiaľ nie je uložená žiadna ponuka.</p>`}</section>`;
}

    <div class="tablewrap"><table><thead><tr><th>Dátum</th><th>Kategória</th><th>Popis</th><th class="r">Suma</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></section>`;

const BK_COLS=['quotes','montaze','customers','events','expenses','cases','doklady'];
function backupObj(){ return {app:'klima-office',version:1,exportedAt:new Date().toISOString(),

const bkCounts=d=>[['ponúk',(d.quotes||[]).length],['montáží',(d.montaze||[]).length],['zákazníkov',(d.customers||[]).length],['udalostí',(d.events||[]).length],['výdavkov',(d.expenses||[]).length],['zásahov a reklamácií',(d.cases||[]).length],['dokladov skladu',(d.doklady||[]).length],['položiek skladu',((d.sklad||{}).items||[]).length],['kusov náradia',((d.tools||{}).items||[]).length]];
async function doBackup(){
  S.settings.lastBackup=today(); await persist('app/settings',S.settings);

/* automatická záloha (len v nainštalovanej aplikácii – window.klimaBackup dodáva Electron): raz denne do priečinka, voliteľne raz týždenne mailom */
async function autoBackup(force){
  if(!window.klimaBackup||!S.loaded||Store.ok===false) return;
  if(Cloud.on){ try{ await Cloud.poll(); }catch(e){} }
  const obj=backupObj();
  if(!force && (S.settings.autoBkAt===today() || !bkCounts(obj.data).some(x=>x[1]))) return;
  const json=JSON.stringify(obj,null,1), name=`klima-office-zaloha-${today()}.json`;
  const r=await window.klimaBackup.save({filename:name,data:json});
  if(!r.ok){ toast('Automatická záloha zlyhala: '+r.error); return; }
  S.bk=r.cfg; S.settings.autoBkAt=S.settings.lastBackup=today();
  if(S.settings.bkMail && window.klimaMail && (!S.settings.bkMailAt || -dayDiff(S.settings.bkMailAt)>=7)){
    const cfg=await window.klimaMail.getConfig();
    if(!cfg.hasPass){ if(force) toast('Zálohu mailom pošlem, keď nastavíš odosielanie (Odoslať mail → Nastaviť).'); }
    else{
      const m=await window.klimaMail.send({to:[cfg.user],cc:[],bcc:[],subject:'Klima Office – záloha údajov '+dfmt(today()),fromName:'Klima Office',
        text:'V prílohe je automatická záloha údajov z aplikácie Klima Office.\nNahráš ju v module Záloha údajov → Nahrať zálohu.',files:[{filename:name,content:json}]});
      if(m.ok) S.settings.bkMailAt=today(); else toast('Zálohu sa nepodarilo poslať mailom: '+m.error);
    }
  }
  await persist('app/settings',S.settings); renderNav(); if(S.module==='zaloha') renderView();
  if(force) toast('Záloha je uložená v priečinku.');
}
async function replaceCol(col,arr){
  for(const o of S[col]) if(!arr.some(x=>x.id===o.id)) await Store.del(col+'/'+o.id).catch(()=>{});
  for(const x of arr) await persist(col+'/'+x.id,x);
  S[col]=arr;
}
async function applyImport(){
  const d=clone(S.imp.data); S.imp=null;
  if(d.catalog&&Array.isArray(d.catalog.rows)&&d.catalog.rows.length) S.catalog.rows=d.catalog.rows;
  if(d.settings){ if(!d.settings.migCyky3) delete S.settings.migCyky3; S.settings=Object.assign(S.settings,d.settings); }
  if(d.sklad&&Array.isArray(d.sklad.items)) S.sklad=skMake(d.sklad);
  if(d.tools&&Array.isArray(d.tools.items)) S.tools={items:d.tools.items,log:d.tools.log||[]};
  await persist('app/catalog',{rows:S.catalog.rows}); await persist('app/settings',S.settings); Cloud.skQ=[]; Cloud.forceSklad=true; await persist('app/sklad',S.sklad); await persist('app/naradie',S.tools);
  for(const c of BK_COLS){ if(c==='doklady'&&!Array.isArray(d[c])) continue; await replaceCol(c,Array.isArray(d[c])?d[c]:[]); }
  await migrate();
  renderAll(); toast('Záloha bola nahraná.');
}

function notifGo(link){
  const m=/^mo:(.+)$/.exec(link||''); if(!m) return;

  else { S.moId=m[1]; S.cpTab='mont'; S.module='cp'; location.hash='#evidencia-cp'; }

function bellUpdate(){
  const b=$('#bell'); if(!b) return; b.hidden=!Cloud.on;
  const n=Cloud.notifs.length; $('#bell-t').textContent='Upozornenia'+(n?' ('+n+')':'');
}
function bellOpen(){
  const ov=document.createElement('div'); ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;display:flex;align-items:flex-start;justify-content:center;padding:60px 16px';
  const draw=()=>{ ov.innerHTML=`<div class="card" style="max-width:520px;width:100%;max-height:80vh;overflow:auto"><div class="card-head"><h3>Upozornenia</h3><button class="btn small ghost" data-n="close">Zavrieť</button></div>
    ${Cloud.notifs.length?Cloud.notifs.map(n=>`<div style="padding:10px 0;border-top:1px solid var(--line);cursor:pointer" data-n="go" data-id="${n.id}"><div style="font-size:12px;color:var(--muted)">${new Date(n.at).toLocaleString('sk-SK',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'})}</div>${esc(n.text)}</div>`).join('')+'<div style="margin-top:12px"><button class="btn small" data-n="all">Označiť všetko ako prečítané</button></div>':'<p class="hint" style="margin:0">Žiadne nové upozornenia.</p>'}</div>`; };
  ov.addEventListener('click',async e=>{
    const t=e.target.closest('[data-n]');
    if(!t){ if(e.target===ov) ov.remove(); return; }
    if(t.dataset.n==='close') ov.remove();
    else if(t.dataset.n==='all'){ await Cloud.markRead(Cloud.notifs.map(n=>n.id)); draw(); }
    else if(t.dataset.n==='go'){ const n=Cloud.notifs.find(x=>String(x.id)===t.dataset.id); ov.remove(); if(n){ await Cloud.markRead([n.id]); notifGo(n.link); } }
  });
  draw(); document.body.appendChild(ov);
}

const AU_COL={quotes:'Ponuka',montaze:'Montáž',customers:'Zákazník',events:'Udalosť',expenses:'Výdavok',cases:'Servis / reklamácia','app/sklad':'Sklad','app/catalog':'Cenník','app/naradie':'Náradie','app/settings':'Nastavenia','app/draft':'Rozpracovaná ponuka'};
const AU_ACT={insert:'Pridané',update:'Zmenené',delete:'Zmazané'};
const AU_KEY={status:'stav',statusNote:'poznámka k stavu',notes:'poznámky',name:'názov',phone:'telefón',email:'e-mail',address:'adresa',stock:'stav zásob',buy:'nákupná cena',sell:'predajná cena',min:'minimum',unit:'jednotka',cat:'kategória',spec:'popis',number:'číslo',date:'dátum',startDate:'dátum montáže',plannedDate:'plánovaný dátum',worker:'pracovník',assignee:'pridelené',indoorSerial:'sér. č. vnútornej',outdoorSerial:'sér. č. vonkajšej',indoorModel:'model vnútornej',outdoorModel:'model vonkajšej',addKg:'dodatočné chladivo (kg)',title:'názov',validUntil:'platnosť do',completedAt:'ukončené',customer:'zákazník',items:'položky',totals:'súčty',variants:'varianty',photos:'fotky'};
const auKind = r => r.col==='app' ? 'app/'+r.doc_id : r.col;
const auVal = v => v===null||v===undefined||v===''?'—':(v==='…'?'…':typeof v==='object'?'zmenené':String(v));
const auChg = ch => Object.keys(ch||{}).map(k=>{ const [o,n]=ch[k]; const big=typeof o==='object'&&o!==null||typeof n==='object'&&n!==null||o==='…'||n==='…';
  return (AU_KEY[k]||k)+(big?': zmenené':': '+esc(auVal(o))+' → '+esc(auVal(n))); });
function auText(r){
  if(r.action!=='update') return AU_ACT[r.action];
  if(r.col==='app'&&r.doc_id==='sklad'){
    return ((r.changes&&r.changes.items)||[]).map(it=>esc(it.name||it.id)+': '+(it.added?'nová položka':it.removed?'odstránená':auChg(it.changes).join(', '))).join('<br>');
  }
  return auChg(r.changes).join('<br>');
}
async function auLoad(){
  if(S.audit.loading) return; S.audit.loading=true;
  try{ S.audit.rows=await Cloud.http('GET','/rest/v1/audit?select=at,email,col,doc_id,action,label,changes&order=at.desc&limit=500'); S.audit.err=''; }
  catch(e){ S.audit.rows=[]; S.audit.err=/404|relation|audit/.test(e.message)?'História zmien ešte nie je zapnutá v Supabase (treba spustiť súbor 5-supabase-historia.sql).':'Históriu sa nepodarilo načítať: '+e.message; }
  S.audit.loading=false; if(S.module==='historia'&&!Cloud.typing()) renderView();
}
function auRows(){

/* ============ modul: Evidencia náradia ============ */
const TL_ST={ok:['ok','V poriadku'],oprava:['low','V oprave'],stratene:['out','Stratené'],vyradene:['off','Vyradené']};
const addMonths=(iso,n)=>{ const d=new Date(iso+'T12:00'); d.setMonth(d.getMonth()+n); return d.toLocaleDateString('sv-SE'); };
const dayDiff=iso=>Math.round((new Date(iso+'T12:00')-new Date(today()+'T12:00'))/864e5);
const tlActive=t=>t.status==='ok'||t.status==='oprava';
const tlNext=t=> t.nextService || (t.lastService&&+t.interval>0 ? addMonths(t.lastService,+t.interval) : '');
const tlById=id=>S.tools.items.find(x=>x.id===id);
function tlSvc(t){
  const n=tlNext(t); if(!n) return {days:null,html:'<span style="color:var(--muted)">–</span>'};
  const d=dayDiff(n);
  const b = d<0 ? `<span class="badge out">po termíne ${-d} d</span>` : d<=30 ? `<span class="badge low">o ${d} d</span>` : `<span class="badge ok">${dfmt(n)}</span>`;
  return {days:d,html:b+(d<0||d<=30?`<div style="font-size:11.5px;color:var(--muted);margin-top:3px">${dfmt(n)}</div>`:'')};
}
function tlWar(t){
  if(!t.warrantyUntil) return '<span style="color:var(--muted)">–</span>';
  const d=dayDiff(t.warrantyUntil);
  return d<0 ? '<span class="badge off">skončila</span>' : d<=60 ? `<span class="badge low">končí o ${d} d</span>` : `<span class="badge ok">do ${dfmt(t.warrantyUntil)}</span>`;
}
function tlLog(t,text){ S.tools.log.unshift({ts:Date.now(),tid:t.id,name:t.name||'(bez názvu)',text}); if(S.tools.log.length>300) S.tools.log.length=300; }
function tlSub(t){ return esc([t.model,t.serial?'SN '+t.serial:''].filter(Boolean).join(' · ')); }
function tlStats(){
  const act=S.tools.items.filter(tlActive);
  const val=act.reduce((s,t)=>s+(+t.price||0),0);
  const rep=act.filter(t=>t.status==='oprava').length;
  const due=act.map(t=>tlSvc(t).days).filter(d=>d!==null&&d<=30);
  const over=due.filter(d=>d<0).length;
  return `<div class="stat"><small>Náradie v používaní</small><b>${act.length}</b><span>hodnota ${eur(val)}</span></div>
    <div class="stat"><small>V oprave</small><b>${rep}</b><span>${rep?'čaká na vrátenie':'všetko funguje'}</span></div>
    <div class="stat"><small>Servis do 30 dní</small><b>${due.length}</b><span>${over?over+' po termíne':'nič po termíne'}</span></div>`;
}
function tlRows(){
  const q=S.tlQuery.trim().toLowerCase(), f=S.tlFilter;
  const list=S.tools.items.filter(t=>{
    if(q && !([t.name,t.model,t.serial,t.location,t.holder].join(' ')).toLowerCase().includes(q)) return false;

  });
  if(!list.length) return `<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:34px">${S.tools.items.length?'Nič nezodpovedá filtru.':'Zatiaľ žiadne náradie. Pridaj ho tlačidlom „Nové náradie“.'}</td></tr>`;
  return list.map(t=>{
    const main=`<tr data-tid="${esc(t.id)}">

      <td><input type="text" class="txt-in" data-tl="location" value="${esc(t.location)}" placeholder="napr. dodávka"></td>
      <td><input type="text" class="txt-in" data-tl="holder" value="${esc(t.holder)}" placeholder="kto ho má"></td>
      <td class="svc-cell">${tlSvc(t).html}</td><td class="war-cell">${tlWar(t)}</td>
      <td><div class="rowact"><button class="btn small ${S.tlOpen===t.id?'':'ghost'}" data-act="tl-open">Detail ${S.tlOpen===t.id?'▴':'▾'}</button><button class="x" data-act="tl-del" title="Odstrániť">${ICON.trash}</button></div></td></tr>`;

    const fl=(k,l,type='text',cls='',ph='')=>`<label class="f ${cls}">${l}<input type="${type}" data-tl="${k}" value="${esc(t[k]||'')}" ${ph?`placeholder="${esc(ph)}"`:''}></label>`;

    return main+`<tr class="tl-detail" data-tid="${esc(t.id)}"><td colspan="7"><div class="proto-grid">
      ${fl('model','Výrobca / model','text','s2')}${fl('serial','Sériové číslo','text','s2')}
      ${fl('buyDate','Dátum nákupu','date')}${fl('price','Cena (€)','number')}${fl('warrantyUntil','Záruka do','date')}<span></span>
      ${fl('lastService','Posledný servis / kalibrácia','date')}${fl('interval','Interval (mesiace)','number','','napr. 12')}${fl('nextService','Ďalší servis (voliteľne ručne)','date','',dn?'automaticky '+dfmt(dn):'')}

      <label class="f s4">Poznámka<textarea data-tl="note">${esc(t.note||'')}</textarea></label></div></td></tr>`;
  }).join('');
}

    const d=new Date(l.ts); const tm=d.toLocaleDateString('sk-SK',{day:'numeric',month:'numeric'})+' '+d.toLocaleTimeString('sk-SK',{hour:'2-digit',minute:'2-digit'});

/* ============ sklad: objednávky materiálu ============ */
function skCommitted(){
  const c={};
  for(const d of S.quotes){
    if(cpStatus(d)!=='prijata'||S.montaze.some(m=>m.quoteId===d.id&&m.status==='hotova')) continue;
    for(const i of d.items||[]) if(i.stockId&&i.qty>0) c[i.stockId]=(c[i.stockId]||0)+i.qty;
  }
  return c;
}
function skNeeds(){
  const c=skCommitted();
  return S.sklad.items.map(it=>({it,res:c[it.id]||0,need:r3((c[it.id]||0)+(+it.min||0)-it.stock)})).filter(x=>x.need>0&&(x.res>0||+x.it.min>0));
}
const skOrderQty=x=>S.skOrder[x.it.id]!==undefined?S.skOrder[x.it.id]:Math.ceil(x.need);
function skTabKeys(){ const r=Cloud.curRole(), own=skIsOwner(), k=['zoznam']; if(r!=='brigadnik'){ k.push('doklady','objednavky'); if(own||r==='monter') k.push('inventura'); if(own) k.push('objednavka','nastavenie'); } return k; }
function skTabs(){
  const n=skNeeds().length, L={zoznam:'Zoznam',doklady:'Doklady',objednavky:'Na objednanie'+(n?' ('+n+')':''),objednavka:'Objednávka (PDF)',inventura:'Inventúra',nastavenie:'Sklady a dodávatelia'};
  return `<div class="seg" style="flex-wrap:wrap">${skTabKeys().map(k=>`<button data-act="sk-tab" data-tab="${k}" class="${S.skTab===k?'on':''}">${L[k]}</button>`).join('')}</div>`;
}
function skOrderBody(){
  const needs=skNeeds(), own=skIsOwner(), cols=own?8:6;
  if(!needs.length) return {rows:`<tr><td colspan="${cols}" style="text-align:center;color:var(--muted);padding:34px">Nič netreba objednať. Položka sa tu objaví, keď klesne pod minimum alebo keď prijatá ponuka potrebuje viac, než máš skladom.</td></tr>`,total:0,text:''};
  const sup=id=>(S.sklad.suppliers||[]).find(x=>x.id===id), g={};
  for(const x of needs){ const k=x.it.supplierId&&sup(x.it.supplierId)?x.it.supplierId:''; (g[k]=g[k]||[]).push(x); }
  const keys=Object.keys(g).sort((a,b)=>(a===''?1:0)-(b===''?1:0)||(sup(a)?sup(a).name:'').localeCompare(sup(b)?sup(b).name:'','sk'));
  let total=0, text=[], rows='';
  for(const k of keys){
    const sn=k?sup(k).name:'Bez dodávateľa', ls=[];
    rows+=`<tr class="sk-band"><td colspan="${cols}"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b>${esc(sn)}</b>${k&&sup(k).phone?`<span>${esc(sup(k).phone)}</span>`:''}${k&&sup(k).email?`<span>${esc(sup(k).email)}</span>`:''}<span class="grow"></span>${own&&k?`<button class="btn small" data-act="x-recv-sup" data-sup="${esc(k)}">Prijať celú objednávku</button>`:''}</div></td></tr>`;
    for(const x of g[k]){ const q=skOrderQty(x), sum=q*(+x.it.buy||0); total+=sum; if(q>0) ls.push(`${x.it.name} – ${fq(q)} ${x.it.unit}`);
      rows+=`<tr data-sid="${esc(x.it.id)}"><td class="name"><b>${esc(x.it.name)}</b>${x.it.spec?`<small class="tl-sub">${esc(x.it.spec)}</small>`:''}</td>
      <td class="num">${fq(x.it.stock)} ${esc(x.it.unit)}</td><td class="num">${x.res?fq(x.res)+' '+esc(x.it.unit):'–'}</td><td class="num">${x.it.min?fq(x.it.min):'–'}</td>
      <td class="num"><input type="number" class="n" min="0" step="any" data-sko="qty" value="${q}"></td>${own?`<td class="num">${eur(x.it.buy)}</td><td class="num"><b>${eur(sum)}</b></td><td><button class="btn small" data-act="sk-receive">Prijať na sklad</button></td>`:''}</tr>`; }
    if(ls.length) text.push((k?sn+':\n':'')+ls.join('\n'));
  }
  return {rows,total,text:text.join('\n\n')};
}
function viewSkOrder(){
  const o=skOrderBody(), own=skIsOwner();
  return `<div class="page-head"><div><h1>Sklad materiálu</h1><p>Čo treba dokúpiť: položky pod minimom a materiál rezervovaný pre prijaté ponuky, zoskupené podľa dodávateľa.</p></div>

    <div class="tablewrap"><table><thead><tr><th>Položka</th><th class="r">Skladom</th><th class="r">Rezervované</th><th class="r">Min.</th><th class="r">Objednať</th>${own?'<th class="r">Nákup €/MJ</th><th class="r">Spolu</th><th></th>':''}</tr></thead><tbody>${o.rows}</tbody></table></div>
    ${S.skCopy?`<label class="f" style="margin-top:12px">Kopírovanie sa nepodarilo – označ a skopíruj:<textarea readonly onclick="this.select()" style="min-height:110px">${esc(S.skCopy)}</textarea></label>`:''}</section>`;

async function skReceive(id){
  const x=skNeeds().find(n=>n.it.id===id), it=S.sklad.items.find(i=>i.id===id); if(!it) return;
  const q=x?skOrderQty(x):0; if(!(q>0)){ toast('Zadaj množstvo na prijatie.'); return; }
  const sp=(S.sklad.suppliers||[]).find(z=>z.id===it.supplierId);
  try{ const d=await dokCreate({type:'prijemka',loc:'main',supplierId:it.supplierId||'',supplierName:sp?sp.name:'',updatePrice:false,lines:[{id,qty:q,price:it.buy||0}]}); delete S.skOrder[id]; toast(`Príjemka ${d.number}: ${it.name} +${fq(q)} ${it.unit}.`); }

async function skReceiveSup(supId){
  const sp=(S.sklad.suppliers||[]).find(z=>z.id===supId); if(!sp) return;
  const xs=skNeeds().filter(n=>n.it.supplierId===supId&&skOrderQty(n)>0); if(!xs.length){ toast('Nie je čo prijať.'); return; }
  try{ const d=await dokCreate({type:'prijemka',loc:'main',supplierId:supId,supplierName:sp.name,updatePrice:false,lines:xs.map(n=>({id:n.it.id,qty:skOrderQty(n),price:n.it.buy||0}))}); for(const n of xs) delete S.skOrder[n.it.id]; toast(`Príjemka ${d.number}: prijatých ${xs.length} položiek od ${sp.name}.`); }
  catch(e){ toast(e.noDok?e.message:'Príjem sa nepodaril: '+(e.message||e)); }
  renderView();
}

/* ============ modul: Zákazníci ============ */
const custKey=n=>(n||'').trim().toLowerCase().replace(/\s+/g,' ');
function custList(){
  const map={}, blank=k=>({key:k,name:'',phone:'',email:'',address:'',note:'',id:null,quotes:[],montaze:[]});
  const get=name=>{ const k=custKey(name); if(!k) return null; return map[k]||(map[k]=Object.assign(blank(k),{name:name.trim()})); };
  const fill=(c,o)=>{ for(const f of ['phone','email','address']) if(!c[f]&&o&&o[f]) c[f]=o[f]; };
  for(const d of S.quotes){ const c=get(d.customer&&d.customer.name); if(c){ c.quotes.push(d); fill(c,d.customer); } }
  for(const m of S.montaze){ const c=get(m.customer&&m.customer.name); if(c){ c.montaze.push(m); fill(c,m.customer); } }
  for(const s of S.customers){
    const k=s.key||custKey(s.name); if(!k) continue;
    const c=map[k]||(map[k]=Object.assign(blank(k),{name:s.name}));
    c.id=s.id; c.phone=s.phone??c.phone; c.email=s.email??c.email; c.address=s.address??c.address; c.note=s.note||'';
    if(!c.quotes.length&&!c.montaze.length) c.name=s.name;
  }
  return Object.values(map).sort((a,b)=>a.name.localeCompare(b.name,'sk'));
}
function custEnsure(key){
  let s=S.customers.find(x=>(x.key||custKey(x.name))===key);
  if(!s){ const c=custList().find(x=>x.key===key)||{}; s={id:'cu-'+uid(),key,name:c.name||'',phone:c.phone||'',email:c.email||'',address:c.address||'',note:c.note||'',createdAt:new Date().toISOString()}; S.customers.push(s); }
  return s;
}

const svcMonths=()=>(+S.settings.serviceMonths)||12;
function svcNextOf(m){ const done=(m.service||[]).filter(s=>s.date).length; return {done,next:(m.status==='hotova'&&m.startDate&&done<10)?addMonths(m.startDate,svcMonths()*(done+1)):null}; }

async function svSave(mid,row){

/* ============ modul: Mapa zákazníkov ============ */
const geoKey = a => String(a||'').trim().toLowerCase().replace(/\s+/g,' ');
const geoOf = a => (S.settings.geo||{})[geoKey(a)];   // [šírka, dĺžka] | 0 = adresa sa nenašla | undefined = ešte nezisťovaná
function mapStops(day){
  return [...S.montaze.filter(m=>m.plannedDate===day).map(m=>calInfo('mo',m)),...S.events.filter(e=>e.date===day).map(e=>calInfo('ev',e))]
    .map(i=>({time:i.time,title:i.title,address:(i.place||'').trim()})).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
}
function mapItems(){
  const stops=mapStops(S.mapDay).filter(s=>s.address), no=a=>stops.findIndex(s=>geoKey(s.address)===geoKey(a))+1;
  const items=custList().filter(c=>(c.address||'').trim()).map(c=>({name:c.name,address:c.address.trim(),phone:c.phone,done:c.montaze.some(m=>m.status==='hotova'),no:no(c.address)}));
  stops.forEach((s,i)=>{ if(!items.some(x=>geoKey(x.address)===geoKey(s.address))) items.push({name:s.title,address:s.address,phone:'',done:false,no:i+1}); });
  return items;
}
function mapRouteUrl(day){
  const pts=mapStops(day).map(s=>s.address).filter(Boolean); if(!pts.length) return '';
  const home=(S.settings.address||'').trim(), all=home?[home,...pts]:pts;
  if(all.length<2) return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(all[0]);
  const p=new URLSearchParams({api:'1',origin:all[0],destination:all[all.length-1],travelmode:'driving'});
  if(all.length>2) p.set('waypoints',all.slice(1,-1).join('|'));
  return 'https://www.google.com/maps/dir/?'+p;
}
function viewMapa(){
  const head=`<div class="page-head"><div><h1>Mapa zákazníkov</h1><p>Kde máš zákazníkov a kam ideš vo vybraný deň. Poloha sa zisťuje z adresy zákazníka.</p></div></div>`;

  return head+`<section class="card"><div class="toolbar"><label class="f" style="flex-direction:row;align-items:center;gap:8px">Deň<input type="date" data-map="day" value="${esc(S.mapDay)}" style="width:160px"></label>

  ${miss.length?`<section class="card"><h3>Adresy, ktoré sa na mape nenašli</h3><p class="hint">Skontroluj adresu (ulica, číslo, obec) a potom klikni Skúsiť znova.</p><ul style="margin:0 0 12px;padding-left:20px;line-height:1.8">${miss.map(i=>`<li>${esc(i.name)} <span style="color:var(--muted)">· ${esc(i.address)}</span></li>`).join('')}</ul><button class="btn small" data-act="map-retry">Skúsiť znova</button></section>`:''}`;

let leafletP=null, mapRun=0;
function leafletLoad(){
  return leafletP||(leafletP=new Promise((ok,no)=>{
    const l=document.createElement('link'); l.rel='stylesheet'; l.href='leaflet/leaflet.css'; document.head.appendChild(l);
    const sc=document.createElement('script'); sc.src='leaflet/leaflet.js'; sc.onload=()=>ok(window.L); sc.onerror=no; document.head.appendChild(sc);
  }));
}
async function mapInit(){
  const run=++mapRun, el=$('#map'); if(!el) return;
  const live=()=>run===mapRun&&el.isConnected;
  let L; try{ L=await leafletLoad(); }catch(e){ el.textContent='Mapu sa nepodarilo načítať.'; return; }
  if(!live()) return;
  const map=L.map(el).setView([48.7,19.5],8), box=[], items=mapItems(), st=$('#map-state');
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
  const put=i=>{ const pos=geoOf(i.address); if(!pos) return; box.push(pos);
    const mk=L.circleMarker(pos,{radius:i.no?12:8,color:'#fff',weight:2,fillOpacity:.95,fillColor:i.no?'#ea580c':i.done?'#16a34a':'#0284c7'}).addTo(map)
      .bindPopup('<b>'+esc(i.name)+'</b><br>'+esc(i.address)+(i.phone?'<br>'+esc(i.phone):''));
    if(i.no){ mk.bindTooltip(String(i.no),{permanent:true,direction:'center',className:'map-no'}); mk.bringToFront(); } };
  const fit=()=>{ if(box.length) map.fitBounds(box,{padding:[40,40],maxZoom:14}); };
  items.forEach(put); fit();
  const todo=[...new Set(items.filter(i=>geoOf(i.address)===undefined).map(i=>i.address))];
  for(let n=0;n<todo.length;n++){
    st.textContent='Zisťujem polohu adries '+(n+1)+' / '+todo.length+'…';
    const r=await window.klimaMap.geocode({address:todo[n]});
    if(!r.ok){ if(live()) st.textContent='Polohu adries sa nepodarilo zistiť. Skontroluj internetové pripojenie.'; return; }
    (S.settings.geo=S.settings.geo||{})[geoKey(todo[n])]=r.pos||0; saveSettings();
    if(!live()) return;
    items.filter(i=>geoKey(i.address)===geoKey(todo[n])).forEach(put); fit();
  }
  if(todo.length){ if(items.some(i=>geoOf(i.address)===0)) renderView(); else st.textContent=''; }   // prekreslenie doplní zoznam nenájdených adries
}

const calScript = () => `// Klima Office – prepojenie s Google kalendárom a zdieľanie ponúk
const KLUC = '${calToken()}';

function doPost(e) {
  try {
    if (e.parameter && e.parameter.ponuka) return odpovedZakaznika(e.parameter);   // zákazník odoslal formulár pod ponukou
    const d = JSON.parse(e.postData.contents);
    if (d.token !== KLUC) return odpoved({ ok: false, error: 'Kľúč v skripte nesedí s aplikáciou. Skopíruj skript z aplikácie znova.' });
    const zoznam = PropertiesService.getScriptProperties();

    /* ---- ponuky ---- */
    if (d.action === 'quote_save') {
      const stara = zoznam.getProperty('p_' + d.pid);
      if (stara) { const n = JSON.parse(stara)._notes; if (n) d.data._notes = n; }   // pripomienky zákazníka ostávajú aj pri novom znení
      try { zoznam.setProperty('p_' + d.pid, JSON.stringify(d.data)); }
      catch (x) { return odpoved({ ok: false, error: 'Ponuka je na zdieľanie cez odkaz príliš dlhá. Pošli ju ako PDF.' }); }
      return odpoved({ ok: true, v: 2 });
    }
    if (d.action === 'quote_status') {
      const raw = zoznam.getProperty('p_' + d.pid);
      if (!raw) return odpoved({ ok: false, error: 'Ponuka sa v skripte nenašla.' });
      const q = JSON.parse(raw);
      return odpoved({ ok: true, approved: !!q._approved, approvedAt: q._approvedAt || '', rejected: !!q._rejected, rejectedAt: q._rejectedAt || '', notes: q._notes || [], variant: q._variant == null ? -1 : q._variant, variantId: q._variantId || '' });
    }
    if (d.action === 'quote_delete') {
      zoznam.deleteProperty('p_' + d.pid);
      return odpoved({ ok: true });
    }

    /* ---- kalendár ---- */
    const kal = CalendarApp.getDefaultCalendar();
    if (d.action === 'ping') return odpoved({ ok: true, calendar: kal.getName() });
    const id = zoznam.getProperty(d.uid);
    let udalost = null;
    if (id) { try { udalost = kal.getEventById(id); } catch (x) {} }
    if (d.action === 'delete') {
      if (udalost) { try { udalost.deleteEvent(); } catch (x) {} }
      zoznam.deleteProperty(d.uid);
      return odpoved({ ok: true });
    }
    const den = d.date.split('-'), celyDen = new Date(+den[0], den[1] - 1, +den[2]);
    if (udalost) {
      try {
        udalost.setTitle(d.title);
        if (d.allDay) udalost.setAllDayDate(celyDen); else udalost.setTime(new Date(d.start), new Date(d.end));
        udalost.setLocation(d.place || '');
        udalost.setDescription(d.desc || '');
      } catch (x) { udalost = null; }
    }
    if (!udalost) {
      const viac = { location: d.place || '', description: d.desc || '' };
      udalost = d.allDay ? kal.createAllDayEvent(d.title, celyDen, viac) : kal.createEvent(d.title, new Date(d.start), new Date(d.end), viac);
      zoznam.setProperty(d.uid, udalost.getId());
    }
    return odpoved({ ok: true });
  } catch (err) {
    return odpoved({ ok: false, error: String(err) });
  }
}

const calDur = v => parseFloat(String(v||'').replace(',','.'))||2;

function calInfo(kind,o){

    return {uid:'mo-'+o.id,date:o.plannedDate,time:o.plannedTime||'',dur:calDur(o.plannedDur),title:'Montáž – '+(c.name||'bez mena'),place:c.address||'',

  }

  return {uid:o.id,date:o.date,time:o.time||'',dur:calDur(o.dur),title:[EV_TYPES[o.type]||'Udalosť',o.title,o.customer].filter(Boolean).join(' – '),place:o.place||c.address||'',

/* vráti true, ak sa do kalendára niečo poslalo */
async function calSync(kind,o,removed,quiet){
  if(!calOn()) return false;
  if(calBusy.has(o.id)){ if(!removed) calSyncSoon(kind,o); return false; }
  const info=removed?null:calInfo(kind,o), sig=info?JSON.stringify(info):'';
  if(sig===(o.gcalSig||'')) return false;          // nič podstatné sa nezmenilo alebo termín v kalendári nikdy nebol
  calBusy.add(o.id);
  try{
    let body;
    if(info){
      body={action:'upsert',uid:info.uid,title:info.title,place:info.place,desc:info.desc,date:info.date,allDay:!info.time};
      if(info.time){ const a=new Date(info.date+'T'+info.time); body.start=a.toISOString(); body.end=new Date(a.getTime()+info.dur*36e5).toISOString(); }
    } else body={action:'delete',uid:JSON.parse(o.gcalSig).uid};
    const r=await calSend(body);
    if(!r.ok){ toast('Kalendár sa nepodarilo aktualizovať: '+r.error); return false; }
    o.gcalSig=sig;
    if(!removed) await persist((kind==='mo'?'montaze/':'events/')+o.id,o);
    if(!quiet) toast(info?'Termín je zapísaný v Google kalendári.':'Termín je z Google kalendára odstránený.');
    return true;
  } finally { calBusy.delete(o.id); }
}

  await persist('app/settings',S.settings);
  const r=await calSend({action:'ping'});

async function calSyncAll(){
  if(!calOn()){ toast('Najprv vlož adresu skriptu a otestuj prepojenie.'); return; }
  let n=0;
  for(const m of S.montaze) if(m.plannedDate&&m.plannedDate>=today()){ delete m.gcalSig; if(await calSync('mo',m,false,true)) n++; }

}

/* ---- fotky v montáži (len v nainštalovanej aplikácii – window.klimaPhotos dodáva Electron).
        Záznam fotky {id,file,type,caption,takenAt,addedAt,source,size,w,h}; source je pripravený aj pre budúcu aplikáciu v telefóne. ---- */
const PH_TYPES={stitok:'Štítok zariadenia',pred:'Pred montážou',po:'Po montáži',ine:'Iné'};
const PH_MAX=250000;   // bajtov na fotku
const phFolder = m => (m.number?'Zakazka-'+m.number:'Montaz-'+m.id).replace(/[^\w.-]+/g,'_');
const phUrl = p => (p.storage==='cloud'||!S.ph)?'':S.ph.baseUrl+'/'+p.file.split('/').map(encodeURIComponent).join('/');
const phBlobs = new Map();
const PH_BLANK = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
async function phHydrate(){
  await Promise.all([...document.querySelectorAll('img[data-ps]')].map(async img=>{
    const f=img.dataset.ps;
    try{ let u=phBlobs.get(f); if(!u){ const r=await Cloud.sto('GET','authenticated/fotky/'+f); u=URL.createObjectURL(await r.blob()); phBlobs.set(f,u); } img.src=u; }
    catch(e){ img.alt='Fotku sa nepodarilo načítať'; }
  }));
}
const blobB64 = blob => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result.split(',')[1]); r.onerror=rej; r.readAsDataURL(blob); });
async function phUploadLocal(){
  const todo=[]; for(const m of S.montaze) for(const p of (m.photos||[])) if(p.storage!=='cloud') todo.push([m,p]);
  if(!todo.length){ toast('Všetky fotky už sú v spoločnej databáze.'); return; }
  let ok=0, bad=0; toast('Nahrávam '+todo.length+' fotiek…');
  const touched=new Set();
  for(const [m,p] of todo){
    try{
      const r=await window.klimaPhotos.read({file:p.file}); if(!r.ok) throw new Error(r.error);
      const bin=Uint8Array.from(atob(r.base64),c=>c.charCodeAt(0)), file=m.id+'/'+p.id+'.jpg';
      await Cloud.sto('POST','fotky/'+file,{headers:{'Content-Type':'image/jpeg'},body:new Blob([bin],{type:'image/jpeg'})});
      p.file=file; p.storage='cloud'; touched.add(m); ok++;
    }catch(e){ bad++; }
  }
  for(const m of touched) await persist('montaze/'+m.id,m);
  renderView(); toast('Nahrané fotky: '+ok+(bad?' · '+bad+' sa nepodarilo (chýba súbor alebo oprávnenie)':'')+'.');
}
async function phShrink(file){
  const bmp=await createImageBitmap(file,{imageOrientation:'from-image'});
  let scale=Math.min(1,1600/Math.max(bmp.width,bmp.height)), q=.85;
  for(;;){
    const w=Math.max(1,Math.round(bmp.width*scale)), h=Math.max(1,Math.round(bmp.height*scale));
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,w,h); g.drawImage(bmp,0,0,w,h);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',q));
    if(blob.size<=PH_MAX||w<=320){ bmp.close(); return {blob,w,h}; }
    if(q>.6) q-=.1; else scale*=.8;
  }
}
async function phAdd(m,files){
  if(!m||!files.length) return;
  let ok=0, bad=0;
  for(const f of files){
    try{
      const {blob,w,h}=await phShrink(f), id='ph-'+uid();
      let fileRef, storage;
      if(Cloud.on){ fileRef=m.id+'/'+id+'.jpg'; await Cloud.sto('POST','fotky/'+fileRef,{headers:{'Content-Type':'image/jpeg'},body:blob}); storage='cloud'; }
      else { const base64=await blobB64(blob); const r=await window.klimaPhotos.save({folder:phFolder(m),name:id+'.jpg',base64}); if(!r.ok) throw new Error(r.error); fileRef=r.file; }
      (m.photos=m.photos||[]).push({id,file:fileRef,storage,type:'ine',caption:'',takenAt:new Date(f.lastModified||Date.now()).toISOString(),addedAt:new Date().toISOString(),source:'pc',size:blob.size,w,h});
      ok++;
    }catch(e){ bad++; }
  }
  await persist('montaze/'+m.id,m); renderView();
  toast((ok?(ok===1?'Pridaná 1 fotka':'Pridané fotky: '+ok):'Fotky sa nepodarilo pridať')+(bad?` · ${bad} sa nepodarilo načítať (napr. formát HEIC – ulož ich ako JPG)`:'')+'.');
}
function phCard(m){
  if(!Cloud.on&&(!window.klimaPhotos||!S.ph)) return `<section class="card"><h3>Fotky</h3><p class="hint" style="margin:0">Fotky sa dajú pridávať len v nainštalovanej aplikácii Klima Office alebo po prihlásení do spoločnej databázy.</p></section>`;

async function moFinish(m){
  if(m.status==='hotova') return;
  const why=`Montáž ${m.number||''} – ${m.customer.name||'bez mena'}`.replace('  ',' ');
  let ded=[], legacy=false;
  const want=[]; for(const l of moDeductList(m)){ const e=want.find(x=>x.id===l.stockId); if(e) e.qty=r3(e.qty+l.qty); else want.push({id:l.stockId,qty:l.qty}); }
  if(want.length){
    const loc=skMoLoc(m);
    try{ await dokCreate({type:'vydajka',loc,ref:{montazId:m.id,number:m.number||'',customer:m.customer.name||''},lines:want}); ded=want.map(x=>({stockId:x.id,qty:x.qty})); m.deductLoc=loc; }
    catch(e){
      if(e.noDok) legacy=true;
      else { toast('Odpočet zo skladu sa nepodaril, montáž nebola ukončená: '+(e.message||e)); return; }
    }
  }
  if(legacy) for(const l of moDeductList(m)){ const si=S.sklad.items.find(x=>x.id===l.stockId); if(si){ skShift(si,'main',-l.qty); skLog(si,-l.qty,why); ded.push({stockId:si.id,qty:l.qty}); } }
  m.status='hotova'; m.completedAt=new Date().toISOString(); m.deductions=ded; if(!m.startDate) m.startDate=today();
  if(legacy&&ded.length) await skSave();
  await persist('montaze/'+m.id,m);
  const d=S.quotes.find(q=>q.id===m.quoteId); if(d&&d.status!=='prijata'){ d.status='prijata'; await cpSave(d); }
  if(Cloud.on&&Cloud.role!=='majitel') Cloud.notify(null,['majitel'],'Montáž hotová: '+(m.number||'')+' – '+(m.customer.name||'bez mena')+' ('+Cloud.cfg.email.split('@')[0]+')','mo:'+m.id);
  renderView(); toast(ded.length?`Montáž ukončená, zo skladu odpočítaných ${ded.length} položiek.`:'Montáž ukončená.');
}
async function moReopen(m){
  if(m.status!=='hotova') return;
  const why=`Vrátený odpočet – montáž ${m.number||''}`, had=(m.deductions||[]).length;
  if(had){
    const loc=(m.deductLoc&&skLocs().some(l=>l.id===m.deductLoc))?m.deductLoc:'main';
    try{ await dokCreate({type:'vratenie',loc,ref:{montazId:m.id,number:m.number||'',customer:m.customer.name||''},lines:m.deductions.map(l=>({id:l.stockId,qty:l.qty}))}); }
    catch(e){
      if(e.noDok){ for(const l of m.deductions||[]){ const si=S.sklad.items.find(x=>x.id===l.stockId); if(si){ skShift(si,'main',l.qty); skLog(si,l.qty,why); } } await skSave(); }
      else { toast('Vrátenie do skladu sa nepodarilo: '+(e.message||e)); return; }
    }
  }
  m.status='planovana'; m.completedAt=null; m.deductions=[]; delete m.deductLoc;
  await persist('montaze/'+m.id,m); renderView(); toast('Montáž znovu otvorená'+(had?', sklad vrátený.':'.'));
}

/* ============ hľadanie v celej aplikácii (pole v bočnom paneli, Ctrl+K) ============ */
const gsNorm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
let GS=[];
function gsFind(query){
  const q=gsNorm(query.trim()); if(q.length<2) return [];
  const hit=(...v)=>v.some(x=>gsNorm(x).includes(q)), out=[], add=(g,t,s,go)=>{ if(out.filter(x=>x.g===g).length<8) out.push({g,t,s,go}); };
  for(const c of custList()) if(hit(c.name,c.phone,c.email,c.address,c.note)) add('Zákazníci',c.name,[c.phone,c.email,c.address].filter(Boolean).join(' · '),{k:'zak',id:c.key,q:c.name});
  for(const d of S.quotes){ const c=d.customer||{}; if(hit(d.number,c.name,c.address,c.phone,d.statusNote)) add('Cenové ponuky','Ponuka č. '+(d.number||'–')+' – '+(c.name||'bez mena'),[dfmt(d.date),eur(d.totals?.total),CP_PILL[cpState(d)][1]].join(' · '),{k:'cp',q:d.number||c.name||''}); }
  for(const m of S.montaze){ const c=m.customer||{}; if(hit(m.number,c.name,c.address,c.phone,m.indoorModel,m.indoorSerial,m.outdoorModel,m.outdoorSerial,m.notes,...(m.extraUnits||[]).flatMap(u=>[u.indoorModel,u.indoorSerial,u.outdoorModel,u.outdoorSerial]))) add('Montáže','Montáž '+(m.number||'')+' – '+(c.name||'bez mena'),[m.indoorModel,m.indoorSerial?'SN '+m.indoorSerial:'',m.outdoorSerial?'SN '+m.outdoorSerial:''].filter(Boolean).join(' · '),{k:'mo',id:m.id}); }
  for(const c of S.cases) if(hit(c.customer,c.problem,c.work)) add(c.type==='rekl'?'Reklamácie':'Servisné zásahy',(c.customer||'bez mena')+' – '+(c.problem||'bez popisu'),[c.date?dfmt(c.date):'',csDevice(c)].filter(Boolean).join(' · '),{k:'cs',id:c.id,tab:CS[c.type].tab});
  for(const it of S.sklad.items) if(hit(it.name,it.spec)) add('Sklad',it.name||'(bez názvu)','skladom '+fq(it.stock)+' '+it.unit,{k:'sklad',q:it.name});
  for(const t of S.tools.items) if(hit(t.name,t.model,t.serial,t.holder,t.location)) add('Náradie',t.name||'(bez názvu)',[t.model,t.serial?'SN '+t.serial:''].filter(Boolean).join(' · '),{k:'naradie',q:t.name});
  return out;
}
function gsRender(){
  const box=$('#gs-res'), q=$('#gs').value; GS=gsFind(q);
  box.hidden=q.trim().length<2;
  let g='';
  box.innerHTML=GS.length?GS.map((r,i)=>(r.g!==g?`<div class="gs-g">${g=r.g}</div>`:'')+`<button class="gs-item ${i?'':'on'}" data-i="${i}">${esc(r.t)}${r.s?`<small>${esc(r.s)}</small>`:''}</button>`).join(''):'<div class="gs-g">Nič sa nenašlo</div>';
}
function gsGo(r){
  const go=r.go; let key=go.k;
  if(go.k==='zak'){ S.cuQuery=go.q; S.cuOpen=go.id; }
  else if(go.k==='cp'){ S.cpQuery=go.q; S.cpFilter='all'; S.cpTab='cp'; S.moId=null; }
  else if(go.k==='mo'){ S.moId=go.id; S.cpTab='mont'; key='cp'; }
  else if(go.k==='cs'){ S.svTab=go.tab; S.csOpen=go.id; key='servis'; }
  else if(go.k==='sklad'){ S.skQuery=go.q; S.skFilter='all'; S.skTab='zoznam'; }
  else if(go.k==='naradie'){ S.tlQuery=go.q; S.tlFilter='all'; }
  $('#gs').value=''; $('#gs-res').hidden=true;
  S.module=key; location.hash='#'+MODULES.find(m=>m.key===key).hash; renderAll();
}

/* ============ zámok aplikácie na PIN. Je to zámok obrazovky – údaje na disku nešifruje. ============ */
async function pinHash(pin){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('klima-office:'+pin));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
/* zamkne aplikáciu; vráti promise, ktorý sa splní po odomknutí */
function lockShow(){
  if($('#lock')) return Promise.resolve();
  closeMail(); $('.app').inert=true;
  const ov=document.createElement('div'); ov.id='lock'; let code='';
  ov.innerHTML=`<form class="lock-box"><div class="brand-mark">${ICON.lock}</div><h2>Klima Office je zamknutá</h2>
    <input type="password" id="lock-pin" autocomplete="off" placeholder="PIN">
    <button class="btn primary" type="submit">Odomknúť</button>
    <div class="lock-msg" id="lock-msg"></div>
    ${window.klimaMail?'<button class="link" type="button" id="lock-forgot">Zabudol som PIN</button>':''}</form>`;
  document.body.appendChild(ov);
  const pin=$('#lock-pin'), msg=t=>{ $('#lock-msg').textContent=t; };
  pin.focus();
  return new Promise(done=>{
    const open=()=>{ ov.remove(); $('.app').inert=false; done(); };
    ov.querySelector('form').addEventListener('submit',async e=>{
      e.preventDefault(); const v=pin.value.trim(); if(!v) return;
      if(code&&v===code){ delete S.settings.pinHash; await persist('app/settings',S.settings); open(); renderAll(); toast('PIN je zrušený. Nový si nastavíš v záložke Moje údaje.'); }
      else if(await pinHash(v)===S.settings.pinHash) open();
      else{ msg('Nesprávny PIN.'); pin.value=''; pin.focus(); }
    });
    const fg=$('#lock-forgot'); if(fg) fg.addEventListener('click',async()=>{
      const cfg=await window.klimaMail.getConfig();
      if(!cfg.hasPass){ msg('Odosielanie mailov nie je nastavené, kód sa nedá poslať.'); return; }
      fg.disabled=true; msg('Posielam kód…');
      const c=String(crypto.getRandomValues(new Uint32Array(1))[0]%1000000).padStart(6,'0');

function dokMerge(r){
  const d=r.doc; if(!S.doklady.some(x=>x.id===d.id)) S.doklady.unshift(d);
  Store.lsSet('doklady/'+d.id,d);

  const why={prijemka:'Príjemka',vydajka:'Výdajka',prevodka:'Prevodka',inventura:'Inventúra',vratenie:'Vrátenie'}[d.type]+' '+d.number;
  for(const l of d.lines){ const dl=d.type==='inventura'?l.diff:(d.type==='vydajka'?-l.qty:l.qty); if(d.type==='prevodka'||!dl) continue; S.sklad.log.unshift({ts:Date.now(),sid:l.id,name:l.name,delta:dl,reason:why}); }
  if(S.sklad.log.length>200) S.sklad.log.length=200;

}
function dokLocal(d){
  const typ=d.type, lf=d.loc||'main', lt=d.locTo||null, yr=new Date().getFullYear();
  const pref={prijemka:'PR',vydajka:'VY',prevodka:'PV',inventura:'IN',vratenie:'VR'}[typ]; if(!pref) throw new Error('Neznámy typ dokladu.');
  if(!skLocs().some(l=>l.id===lf)) throw new Error('Neznámy sklad.');
  if(typ==='prevodka'&&(!lt||lt===lf||!skLocs().some(l=>l.id===lt))) throw new Error('Vyber iný cieľový sklad.');
  if(!(d.lines||[]).length) throw new Error('Doklad nemá žiadne položky.');
  const mx=Math.max(0,...S.doklady.filter(x=>(x.number||'').startsWith(pref+'-'+yr+'-')).map(x=>+(x.number.split('-')[2])||0));
  const num=pref+'-'+yr+'-'+String(mx+1).padStart(4,'0'), lines=[], ids={}; const snap=clone(S.sklad.items);
  try{
    for(const ln of d.lines){
      const it=S.sklad.items.find(x=>x.id===ln.id); if(!it) throw new Error('Položka v sklade neexistuje.');
      const l2={id:it.id,name:it.name,unit:it.unit};
      if(typ==='inventura'){ const q=xnum(ln.counted), cur=skAt(it,lf); if(ln.counted===''||ln.counted==null||q<0) throw new Error('Napočítané množstvo musí byť 0 alebo viac.'); Object.assign(l2,{expected:cur,counted:q,diff:r3(q-cur)}); if(l2.diff) skShift(it,lf,l2.diff); }
      else{
        const q=xnum(ln.qty); if(!(q>0)) throw new Error('Množstvo musí byť väčšie ako 0.'); l2.qty=q;
        if(typ==='prijemka'){ const p=xnum(ln.price); if(p>0){ l2.price=p; if(d.updatePrice!==false) it.buy=p; } skShift(it,lf,q); }
        else if(typ==='vydajka') skShift(it,lf,-q);
        else if(typ==='vratenie') skShift(it,lf,q);
        else{ skShift(it,lf,-q); skShift(it,lt,q); }
      }
      lines.push(l2); ids[it.id]=1;
    }
  }catch(e){ S.sklad.items=snap; throw e; }
  const doc={id:num,number:num,type:typ,at:new Date().toISOString(),loc:lf,by:skMyEmail()||'',note:(d.note||'').slice(0,500),lines};
  if(lt) doc.locTo=lt;
  if(typ==='prijemka'){ doc.supplierId=d.supplierId||''; doc.supplierName=(d.supplierName||'').slice(0,200); doc.invoice=(d.invoice||'').slice(0,100); doc.sum=r3(lines.reduce((a,l)=>a+l.qty*(l.price||0),0)); }
  if(d.ref) doc.ref={montazId:d.ref.montazId||'',number:d.ref.number||'',customer:d.ref.customer||''};
  const items={}; for(const id in ids){ const it=S.sklad.items.find(x=>x.id===id); items[id]={stock:it.stock,loc:it.loc,buy:it.buy}; }
  return {number:num,doc,items};
}
async function dokCreate(d){
  let r;
  if(Cloud.on&&Cloud.role!=='citanie'){
    if(Cloud.noDok) throw Object.assign(new Error('Doklady potrebujú SQL č. 7 v Supabase.'),{noDok:true});
    try{ r=await Cloud.http('POST','/rest/v1/rpc/sklad_doklad',{body:{p_doc:d}}); }
    catch(e){ if(e.status===404||/PGRST202|schema cache|sklad_doklad.*does not exist|Could not find the function/i.test(e.message||'')){ Cloud.noDok=true; e.noDok=true; e.message='Doklady potrebujú SQL č. 7 (supabase-doklady.sql) spustené v Supabase.'; } throw e; }
    dokMerge(r);

}

let ZX_LOADED=false;
function zxLoad(){

function xScan(cb){
  const ov=document.createElement('div'); ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:95;display:flex;align-items:center;justify-content:center;padding:14px';
  ov.innerHTML=`<div class="card" style="width:min(520px,100%);margin:0"><div class="card-head"><h3>Skenovať kód</h3><button class="btn small" data-x="close">Zavrieť</button></div>
    <video playsinline muted style="width:100%;max-height:50vh;background:#000;border-radius:10px"></video>
    <p class="hint" id="scan-st" style="margin:8px 0">Pripájam kameru…</p>
    <div style="display:flex;gap:8px"><input type="text" id="scan-man" class="grow" placeholder="…alebo zadaj kód ručne" autocomplete="off" style="flex:1"><button class="btn primary" data-x="ok">Použiť</button></div></div>`;
  document.body.appendChild(ov);
  const v=ov.querySelector('video'), st=ov.querySelector('#scan-st'); let stream=null, stop=false, reader=null, timer=null;
  const done=code=>{ if(stop) return; stop=true; clean(); try{ navigator.vibrate&&navigator.vibrate(60); }catch(e){} cb(String(code).trim()); };
  const clean=()=>{ stop=true; clearTimeout(timer); try{ reader&&reader.reset(); }catch(e){} try{ stream&&stream.getTracks().forEach(t=>t.stop()); }catch(e){} ov.remove(); };
  ov.addEventListener('click',e=>{ const b=e.target.closest('[data-x]'); if(!b) return; if(b.dataset.x==='close') clean(); else { const c=ov.querySelector('#scan-man').value.trim(); if(c) done(c); } });
  ov.querySelector('#scan-man').addEventListener('keydown',e=>{ if(e.key==='Enter'){ const c=e.target.value.trim(); if(c) done(c); } else if(e.key==='Escape') clean(); });
  (async()=>{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ st.textContent='Kamera nie je dostupná (stránka musí bežať cez https). Zadaj kód ručne alebo použi čítačku.'; return; }
    try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}); }
    catch(e){ st.textContent='Kameru sa nepodarilo zapnúť ('+(e.name==='NotAllowedError'?'chýba povolenie':e.message||e.name)+'). Zadaj kód ručne.'; return; }
    if(stop){ stream.getTracks().forEach(t=>t.stop()); return; }
    v.srcObject=stream; try{ await v.play(); }catch(e){}
    st.textContent='Namier kameru na čiarový kód.';
    if('BarcodeDetector' in window){
      try{
        const det=new BarcodeDetector(); const loop=async()=>{ if(stop) return; try{ const r=await det.detect(v); if(r&&r.length){ done(r[0].rawValue); return; } }catch(e){} timer=setTimeout(loop,200); }; loop(); return;
      }catch(e){}
    }
    if(!zxLoad()){ st.textContent='Skener nie je dostupný. Zadaj kód ručne.'; return; }
    try{
      const Z=window.ZXing, hints=new Map(); hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.CODE_128,Z.BarcodeFormat.CODE_39,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E,Z.BarcodeFormat.QR_CODE,Z.BarcodeFormat.ITF]); hints.set(Z.DecodeHintType.TRY_HARDER,true);
      const mr=new Z.MultiFormatReader(); mr.setHints(hints); const cv=document.createElement('canvas'), ctx=cv.getContext('2d',{willReadFrequently:true});
      const loop=()=>{ if(stop) return;
        if(v.videoWidth){ cv.width=v.videoWidth; cv.height=v.videoHeight; ctx.drawImage(v,0,0);
          try{ const res=mr.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(cv)))); if(res){ done(res.getText()); return; } }catch(e){} }
        timer=setTimeout(loop,150); };
      loop();
    }catch(e){ st.textContent='Skener zlyhal: '+(e.message||e)+'. Zadaj kód ručne.'; }
  })();
}

async function dkSave(){

  if(f.type==='prevodka'&&(!f.locTo||f.locTo===f.loc)){ toast('Vyber cieľový sklad (iný než zdroj).'); return; }
  const sup=(S.sklad.suppliers||[]).find(s=>s.id===f.supplierId);

}

  ov.innerHTML=`<div class="card" style="width:min(720px,100%);margin:0"><div class="card-head"><h3>${esc(it.name)}</h3><button class="btn small" data-x="close">Zavrieť</button></div>

    ${own?`<div class="s2"><h4 style="margin:0 0 6px">Nákupná cena</h4><p style="margin:0">Aktuálna: <b>${eur(it.buy)}</b></p>${prices.length?`<p class="hint" style="margin:4px 0 0">Priemer ${eur(avg)} · najnižšia ${eur(Math.min(...prices))} · najvyššia ${eur(Math.max(...prices))} (z ${prices.length} nákupov)</p>`:'<p class="hint" style="margin:4px 0 0">Zatiaľ žiadna príjemka s cenou.</p>'}</div>`:''}</div>
    ${own&&ph?`<h4 style="margin:14px 0 6px">História nákupov</h4><div class="tablewrap"><table><thead><tr><th>Dátum</th><th>Dodávateľ</th><th class="r">Množstvo</th><th class="r">Cena €/MJ</th></tr></thead><tbody>${ph}</tbody></table></div>`:''}

function xInput(el,ev){
  const k=el.dataset.xf, tr=el.closest('tr'), f=S.dokForm;
  if(k.startsWith('dk.')&&f){
    const l=tr&&tr.dataset.li!==undefined?f.lines[+tr.dataset.li]:null, fld=k.slice(3);
    if(fld==='q'&&l){ l.q=el.value; if(ev==='change'){ const it=skFind(el.value); l.id=it?it.id:''; if(it){ l.q=skLabel(it); if(f.type==='prijemka'&&!l.price&&it.buy) l.price=String(it.buy).replace('.',','); } renderView(); } else l.id=(skFind(el.value)||{}).id||''; }
    else if(l&&(fld==='qty'||fld==='price')) l[fld]=el.value;
    else if(fld==='loc'&&ev==='change'){ f.loc=el.value; if(f.locTo===f.loc) f.locTo=''; renderView(); }
    else if(fld==='locTo'&&ev==='change') f.locTo=el.value;
    else if(fld==='supplier'&&ev==='change') f.supplierId=el.value;
    else if(fld==='invoice') f.invoice=el.value;
    else if(fld==='note') f.note=el.value;
    else if(fld==='updatePrice'&&ev==='change') f.updatePrice=el.checked;
    return;
  }
  if(k.startsWith('iv.')){
    const iv=ivState(), fld=k.slice(3);
    if(fld==='count'){ iv.counts[tr.dataset.sid]=el.value; const it=S.sklad.items.find(x=>x.id===tr.dataset.sid), c=el.value, d=c===''?null:r3(xnum(c)-skAt(it,iv.loc));
      tr.querySelector('.iv-d').innerHTML=d===null?'':`<b style="color:${d<0?'var(--bad)':d>0?'var(--good,#16a34a)':'var(--muted)'}">${d>0?'+':''}${fq(d)}</b>`;
      const n=Object.values(iv.counts).filter(v=>v!==''&&v!==undefined).length; $('#iv-n').textContent='Zadaných položiek: '+n; const sb=$('[data-act=x-iv-save]'); if(sb) sb.disabled=!n; }
    else if(fld==='loc'&&ev==='change'){ iv.loc=el.value; iv.counts={}; renderView(); }
    else if(fld==='nz'&&ev==='change'){ iv.nz=el.checked; renderView(); }
    return;
  }
  if(k.startsWith('sc.')&&tr){
    const i=+tr.dataset.i, fld=k.slice(3);
    if(fld==='locName'){ S.sklad.locs[i].name=el.value; }
    else if(fld==='locOwner'){ S.sklad.locs[i].owner=el.value.trim(); }
    else{ const s=S.sklad.suppliers[i]; if(!s) return; s[{supName:'name',supPhone:'phone',supEmail:'email',supNote:'note'}[fld]]=el.value; }
    xSaveSk();
  }
}

/* ============ import katalógu dodávateľa ============ */
const IM_SHOP='Klíma pre Teba';
const IM_SKIP=[
  [/^(profylaktick[ýy] servis|teória a montáž|tepelné čerpadlá$|asistencia servisného)|hviezdne nebo/i,'služba / nie tovar'],
  [/^limitovaná akcia/i,'akciový balík viacerých kusov'],
  [n=>/AUX/i.test(n)&&/klimatizác|split|jednotk|set\b/i.test(n)&&!/wifi|deflektor|modul|kábel|ovládač/i.test(n),'AUX klimatizácia (už ju máš v sklade)']
];
const IM_UNIT={ks:'ks',pcs:'ks',bal:'bal',balenie:'bal',komplet:'kpl',sada:'sada',litre:'l'};
const IM_STOP=new Set(['pre','na','do','od','so','set','split','mm','kw','nastenna','klimatizacia','jednotka']);
const imNorm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/(\d),(\d)/g,'$1.$2');
const imTok=s=>new Set((imNorm(s).match(/[a-z0-9.]+/g)||[]).filter(t=>t.length>=2&&!IM_STOP.has(t)));
function imParse(txt){
  const L=String(txt).replace(/^﻿/,'').split(/\r?\n/).filter(l=>l.trim());
  if(L.length<2) throw new Error('Súbor je prázdny.');
  const sep=L[0].includes('\t')?'\t':L[0].includes(';')?';':',';
  const h=L[0].split(sep).map(x=>x.trim().toLowerCase()), c=n=>h.indexOf(n);
  const ci={sku:c('sku'),name:c('nazov'),bez:c('cena_bez_dph'),dph:c('cena_s_dph'),mj:c('mj'),av:c('dostupnost'),kat:c('kategoria'),url:c('url')};
  if(ci.sku<0||ci.name<0||ci.bez<0) throw new Error('Súbor musí mať stĺpce sku, nazov a cena_bez_dph.');
  const num=s=>{ const v=parseFloat(String(s||'').replace(/\s/g,'').replace(',','.')); return isFinite(v)?v:null; };
  const seen=new Set(), rows=[];
  for(const l of L.slice(1)){
    const p=l.split(sep), g=i=>i>=0?(p[i]||'').trim():'';
    const sku=g(ci.sku); if(!sku||seen.has(sku)) continue; seen.add(sku);
    const kat=g(ci.kat), mj=g(ci.mj).toLowerCase();
    const pr=num(g(ci.bez)), gr=num(g(ci.dph)); let vat=null; if(pr>0&&gr>pr){ const v=Math.round((gr/pr-1)*100); vat=[5,19,23].includes(v)?v:null; }
    rows.push({sku,name:g(ci.name),price:pr,vat,unit:IM_UNIT[mj]||mj||'ks',avail:g(ci.av),kat,url:g(ci.url),
      cat:/^(klimatizacie|tepelne-cerpadla|rekuperacia)/.test(kat)?'Zariadenie':'Materiál'});
  }
  return rows;
}
function imSupplier(name){
  name=(name||'').trim(); if(!name) return null;
  return (S.sklad.suppliers||[]).find(s=>s.name.trim().toLowerCase()===name.toLowerCase())||null;
}
function imPlan(rows,supName){
  const sup=imSupplier(supName), supId=sup?sup.id:null;
  const mine=S.sklad.items.filter(it=>it.scode&&(supId?it.supplierId===supId:false)), bySku={}; for(const it of mine) bySku[it.scode]=it;
  const plan=rows.map(r=>({r,kind:'new',act:'new',it:null,reason:''}));
  const used=new Set();
  for(const p of plan){ const it=bySku[p.r.sku]; if(it){ p.kind='upd'; p.it=it; used.add(it.id); } }
  // podobné existujúce položky bez kódu dodávateľa
  const free=S.sklad.items.filter(it=>!it.scode&&!used.has(it.id)), ft=free.map(it=>imTok(it.name));
  const pairs=[];
  plan.forEach((p,pi)=>{ if(p.it) return; const a=imTok(p.r.name); free.forEach((it,fi)=>{ const b=ft[fi]; if(!a.size||!b.size) return; let n=0; for(const t of b) if(a.has(t)) n++; const sc=n/Math.min(a.size,b.size); if(n>=3&&sc>=0.75) pairs.push([sc,n,pi,fi]); }); });
  pairs.sort((x,y)=>y[0]-x[0]||y[1]-x[1]);
  const pu=new Set(), fu=new Set();
  for(const [sc,n,pi,fi] of pairs){ if(pu.has(pi)||fu.has(fi)) continue; pu.add(pi); fu.add(fi); plan[pi].kind='link'; plan[pi].it=free[fi]; }
  for(const p of plan){
    p.act=p.kind; let why=''; if(p.r.price==null||p.r.price<=0) why='bez ceny';
    else for(const [rx,t] of IM_SKIP){ if(typeof rx==='function'?rx(p.r.name):rx.test(p.r.name)){ why=t; break; } }
    if(why&&p.kind==='new'){ p.act='skip'; p.reason=why; }      // už existujúce položky sa vždy aktualizujú
    else if(why&&p.kind==='link'){ p.reason=why; }
    if(p.r.price==null||p.r.price<=0) p.act='skip';
  }
  const gone=mine.filter(it=>!rows.some(r=>r.sku===it.scode));
  return {sup:supName,plan,gone};
}
const imChg=p=>p.it&&p.r.price!=null&&Math.abs((+p.it.buy||0)-p.r.price)>0.004;
function imCounts(P){
  const c={all:P.plan.length,new:0,chg:0,link:0,skip:0,same:0,on:0};
  for(const p of P.plan){ if(p.act==='skip') c.skip++; else c.on++; if(p.kind==='new'&&p.act!=='skip') c.new++; if(p.kind==='link') c.link++; if(p.kind==='upd'){ if(imChg(p)) c.chg++; else c.same++; } }
  return c;
}
function imApply(){

    if(p.act==='new'||!p.it){

      if(imChg(p)||!(it.buyLog||[]).length){ it.buyLog=[{d:t,buy:r.price}].concat(it.buyLog||[]).slice(0,40); if(imChg(p)) nPrice++; it.buy=r.price; it.buyAt=t; }

function imRows(){
  const P=S.cim; if(!P) return ''; const F=S.cimF||'all', q=imNorm(S.cimQ||'').trim();

    const price=p.it?`${old?eur(old)+' → ':''}<b>${eur(r.price)}</b>${d!==null&&Math.abs(d)>=0.5?` <small style="color:${d>0?'var(--bad)':'var(--good,#16a34a)'}">${d>0?'+':''}${d.toFixed(1).replace('.',',')} %</small>`:''}`:`<b>${eur(r.price)}</b> <small style="color:var(--muted)">/ ${esc(r.unit)}</small>`;

    return `<tr data-i="${i}" style="${p.act==='skip'?'opacity:.55':''}"><td>${esc(r.sku)}</td><td>${esc(r.name)}${p.kind==='link'?`<small class="tl-sub" style="margin:3px 0 0">↔ v sklade: ${esc(p.it.name)}</small>`:''}${p.reason?`<small class="tl-sub" style="margin:3px 0 0">${esc(p.reason)}</small>`:''}</td><td class="num">${price}</td><td>${esc(r.avail||'–')}</td><td>${sel}</td></tr>`;
  }).join('');

function imList(){
  const P=S.cim; if(!P) return []; const F=S.cimF||'all', q=imNorm(S.cimQ||'').trim();
  return P.plan.filter(p=>{
    if(q&&!imNorm(p.r.sku+' '+p.r.name).includes(q)) return false;

    if(F==='chg') return p.kind==='upd'&&imChg(p);
    if(F==='same') return p.kind==='upd'&&!imChg(p);

    if(F==='skip') return p.act==='skip';

  });

/* priradenie položiek dodávateľa do kategórie (Zariadenie / Materiál / Náradie) a do riadku či skupiny ponuky; už zaradené položky sa nemenia */
function skAutoSlot(ids){
  const rows=S.catalog.rows||[]; let h1='';
  const items=rows.filter(r=>r.kind==='item').map(r=>({id:r.id,l:rowLabel(r)})), grps=rows.filter(r=>r.kind!=='item').map(r=>({id:r.id,l:r.title}));
  let zar=null; for(const r of rows){ if(r.kind==='h1') h1=r.title; else if(r.kind==='item'&&!zar&&/zariadenie/i.test(h1)) zar=r.id; }
  const row=rx=>(items.find(x=>rx.test(x.l))||{}).id||'', grp=rx=>(grps.find(x=>rx.test(x.l))||{}).id||'';
  let n=0, nar=0;
  for(const it of S.sklad.items){
    if(!it.scode||it.slot||(ids&&!ids.includes(it.id))) continue;
    const seg=((it.skat||'').replace(/\//g,'')||((it.curl||'').match(/^\/([^/]+)\//)||[])[1]||''), nm=it.name||'';
    let slot='', cat=it.cat;
    const dev=/^(klimatizacie|tepelne-cerpadla|rekuperacia)/.test(seg)&&!/wifi|modul|deflektor|ovláda|kábel|konzol|držiak|filter/i.test(nm);
    if(/^naradie/.test(seg)){ cat='Náradie'; }
    else if(dev){ cat='Zariadenie'; slot=/multi/i.test(nm)&&/vnútorn/i.test(nm)?row(/multisplit.*vnútorn/i):/multi/i.test(nm)&&/vonkaj/i.test(nm)?row(/multisplit.*vonkaj/i):(zar||''); }
    else{
      cat='Materiál';
      if(/cyky.*5\s*g|5\s*[gx]\s*1[,.]5|komunika/i.test(nm)) slot=row(/komunika/i);
      else if(/cyky.*3\s*g|3\s*[gx]\s*2[,.]5|napájac/i.test(nm)) slot=row(/napájac/i);
      else if(/h05|ohybn/i.test(nm)) slot=row(/ohybn|h05/i);
      else if(/kábel|kabel/i.test(nm)) slot=grp(/kabel/i);
      else if(/istič/i.test(nm)) slot=row(/^istič/i);
      else if(/vidlic/i.test(nm)) slot=row(/vidlic/i);
      else if(/kondenz/i.test(nm)&&/hadic/i.test(nm)) slot=row(/kondenzn.*hadica/i);
      else if(/kondenz/i.test(nm)&&/čerpadl/i.test(nm)) slot=row(/^čerpadlo/i);
      else if(/kondenz|odvod/i.test(nm)) slot=grp(/odvod kondenz/i);
      else if(/lišt|žľab|zlab|žlab/i.test(nm)) slot=row(/lišta na cu|plastov.*lišta/i);
      else if(/cu\b|medený|medená|medene|predizol|potrubie/i.test(nm)) slot=row(/cu potrubie/i)||grp(/cu rozvody/i);
      else if(/izolác|páska|pásk/i.test(nm)) slot=grp(/cu rozvody/i);
      else if(/konzol|silentblok|podstav|držiak/i.test(nm)) slot=row(/konzola/i);
      else if(/kotv|hmoždink|skrut|matic|redukc|mosadz|tvarovk/i.test(nm)) slot=grp(/^mont.*kotv/i)||grp(/kotviac/i);
    }
    it.cat=cat; if(slot){ it.slot=slot; n++; } else if(cat==='Náradie') nar++;
  }
  return {n,nar};
}

  const b=e.target.closest('[data-act^="x-im-"]'); if(!b) return; const a=b.dataset.act;
  if(a==='x-im-flt'){ S.cimF=b.dataset.v; renderView(); }
  else if(a==='x-im-bulk'){ for(const p of imList()) p.act=b.dataset.v==='on'?(p.act==='skip'?p.kind:p.act):'skip'; renderView(); }
  else if(a==='x-im-go') imApply();
  else if(a==='x-im-shop') imShopUpdate();
  else if(a==='x-im-slots'){ const r=skAutoSlot(null); saveSklad(); renderView(); toast(`Zaradených do ponuky: ${r.n}, náradie: ${r.nar}. Ostatné ostávajú nezaradené – zmeníš ich v stĺpci „Použitie v ponuke“.`); }
  else if(a==='x-im-cancel'){ S.cim=null; renderView(); }
});

view.addEventListener('dragstart',e=>{ const th=e.target.closest&&e.target.closest('#sk-head th[data-k]'); if(th){ S.skDrag=th.dataset.k; try{ e.dataTransfer.setData('text/plain',th.dataset.k); e.dataTransfer.effectAllowed='move'; }catch(x){} } });
view.addEventListener('dragover',e=>{ if(S.skDrag&&e.target.closest&&e.target.closest('#sk-head th[data-k]')) e.preventDefault(); });
view.addEventListener('drop',e=>{ const th=e.target.closest&&e.target.closest('#sk-head th[data-k]'); if(!th||!S.skDrag) return; e.preventDefault();
  const from=S.skDrag, to=th.dataset.k; S.skDrag=null; if(from===to) return; const q=skColPrefs(), a=q.order.indexOf(from), t0=q.order.indexOf(to); if(a<0||t0<0) return;
  q.order.splice(a,1); const t=q.order.indexOf(to); q.order.splice(a<t0?t+1:t,0,from); skColSave(q); skColRefresh(); });
view.addEventListener('dragend',()=>{ S.skDrag=null; });

/* ============ objednávka dodávateľovi (PDF + e-mail) ============ */
const odKey='klima.ord';
function odState(){
  if(!S.ord){ let d=null; try{ d=JSON.parse(localStorage.getItem(odKey)||'null'); }catch(e){} S.ord=Object.assign({supId:'',lines:[],note:'',q:''},d||{},{q:''}); }
  return S.ord;
}
const odSave=()=>{ try{ const o=odState(); localStorage.setItem(odKey,JSON.stringify({supId:o.supId,lines:o.lines,note:o.note})); }catch(e){} };
const odUnit=it=>skGross(it.buy,skVat(it));
const odLine=l=>{ const it=S.sklad.items.find(x=>x.id===l.id); if(!it) return null; const q=xnum(l.qty)||0, u=odUnit(it); return {it,q,u,sum:Math.round(q*u*100)/100}; };
const odRows=()=>odState().lines.map(odLine).filter(Boolean);
const odTotal=()=>Math.round(odRows().reduce((a,r)=>a+r.sum,0)*100)/100;
function odMatches(q){
  const o=odState(), t=imNorm(q).split(/\s+/).filter(Boolean); if(!t.length) return [];
  const have=new Set(o.lines.map(l=>l.id));
  return S.sklad.items.filter(it=>(!o.supId||it.supplierId===o.supId)&&!have.has(it.id)&&t.every(w=>imNorm([it.name,it.scode,it.ean,it.spec,it.place].join(' ')).includes(w))).slice(0,8);
}
function odAdd(id,qty){ const o=odState(); if(!S.sklad.items.some(x=>x.id===id)||o.lines.some(l=>l.id===id)) return; o.lines.push({id,qty:String(qty||1)}); o.q=''; odSave(); renderView(); }
function odBuildHtml(){
  const s=S.settings, o=odState(), rows=odRows(), sup=(S.sklad.suppliers||[]).find(x=>x.id===o.supId);
  const body=rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.it.name)}</td><td>${esc(r.it.scode||'')}</td><td class="r">${fq(r.q)} ${esc(r.it.unit)}</td><td class="r">${eur(r.u)}</td><td class="r">${eur(r.sum)}</td></tr>`).join('');
  return `<!DOCTYPE html><html lang="sk"><head><meta charset="utf-8"><title>Objednávka ${esc(dfmt(today()))}</title><style>
body{font-family:"Segoe UI",Arial,sans-serif;color:#0f1b2d;margin:34px 40px;font-size:13px}h1{margin:0 0 4px;font-size:24px}.top{display:flex;justify-content:space-between;gap:30px;border-bottom:3px solid #0284c7;padding-bottom:14px;margin-bottom:18px}.sub{color:#556;font-size:12px;line-height:1.5}
table{width:100%;border-collapse:collapse;margin-top:10px}th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#556;text-align:left;padding:7px 8px;border-bottom:2px solid #cbd5e1}td{padding:7px 8px;border-bottom:1px solid #e5eaf1}.r{text-align:right;white-space:nowrap}th.r{text-align:right}
.tot{margin-top:14px;text-align:right;font-size:16px}.tot b{font-size:20px}.note{margin-top:18px;white-space:pre-wrap}</style></head><body>
<div class="top"><div><h1>Objednávka</h1><div class="sub">Dátum: ${esc(dfmt(today()))}${sup?`<br>Dodávateľ: <b>${esc(sup.name)}</b>`:''}</div></div>
<div class="sub" style="text-align:right"><b>${esc(s.company||'')}</b><br>${[s.address,s.ico?'IČO: '+s.ico:'',s.phone,s.email].filter(Boolean).map(esc).join('<br>')}</div></div>
<table><thead><tr><th>#</th><th>Názov</th><th>Cudzí názov</th><th class="r">Počet</th><th class="r">Cena s DPH / MJ</th><th class="r">Celkom s DPH</th></tr></thead><tbody>${body}</tbody></table>
<div class="tot">Celkom s DPH: <b>${eur(odTotal())}</b></div>${o.note?`<div class="note">${esc(o.note)}</div>`:''}</body></html>`;
}
function odPrint(){
  if(!odRows().length){ toast('Objednávka je prázdna.'); return; }
  const w=window.open('','_blank'); if(!w){ toast('Prehliadač zablokoval nové okno. Povoľ ho a skús znova.'); return; }
  w.document.write(odBuildHtml()); w.document.close(); setTimeout(()=>{ try{ w.focus(); w.print(); }catch(e){} },300);
}
function odMail(){
  if(!window.klimaMail){ toast('Odosielanie mailov funguje len v nainštalovanej aplikácii Klima Office. Použi Tlačiť / uložiť PDF.'); return; }
  if(!odRows().length){ toast('Objednávka je prázdna.'); return; }
  const d=dfmt(today());
  openMail({kind:'order',to:S.settings.orderEmail||'',subject:'Objednávka '+d+(S.settings.company?' – '+S.settings.company:''),vars:{datum:d},
    filename:'Objednavka-'+today()+'.pdf',html:()=>odBuildHtml(),onSent:async()=>{},okMsg:to=>'Objednávka bola odoslaná na '+to.join(', ')+'.'});
}
function odResHtml(){
  const o=odState(), m=odMatches(o.q);
  if(!o.q.trim()) return '';
  return m.length?m.map(it=>`<button type="button" class="btn small ghost" data-act="x-od-add" data-id="${esc(it.id)}" style="display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;margin:2px 0"><span>${esc(it.name)}${it.scode?` <small style="color:var(--muted)">· ${esc(it.scode)}</small>`:''}</span><b>${eur(odUnit(it))}</b></button>`).join(''):'<p class="hint" style="margin:6px 0">Nič sa nenašlo.</p>';
}
function odBody(){
  const o=odState(), rows=o.lines.map((l,i)=>({l,i,r:odLine(l)})).filter(x=>x.r);
  return rows.length?rows.map(x=>`<tr data-i="${x.i}"><td>${esc(x.r.it.name)}</td><td>${esc(x.r.it.scode||'')}</td><td class="num">${x.r.u?eur(x.r.u):'<span style="color:var(--bad)">bez ceny</span>'}</td><td class="num"><input type="number" class="n" min="0" step="any" data-xf="od.qty" value="${esc(o.lines[x.i].qty)}" style="width:80px"> <small>${esc(x.r.it.unit)}</small></td><td class="num od-sum">${eur(x.r.sum)}</td><td><button class="x" data-act="x-od-del" title="Odstrániť">${ICON.trash}</button></td></tr>`).join(''):'<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:26px">Objednávka je prázdna. Vyhľadaj položku vyššie.</td></tr>';
}
function viewSkOd(){
  const o=odState(), sups=S.sklad.suppliers||[];
  return `<div class="page-head"><div><h1>Sklad materiálu</h1><p>Vyber položky zo skladu, zadaj počet a pošli objednávku ako PDF na e-mail.</p></div><div>${skTabs()}</div></div>
  <section class="card"><div class="card-head"><h3>Objednávka dodávateľovi</h3><button class="btn small ghost" data-act="x-od-clear">Vyčistiť</button></div>
    <div class="toolbar" style="margin-bottom:8px"><label class="f" style="margin:0">Dodávateľ<select data-xf="od.sup"><option value="">Všetci</option>${sups.map(s=>`<option value="${esc(s.id)}" ${s.id===o.supId?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label>
      <input type="text" data-xf="od.q" class="grow" placeholder="Hľadať položku podľa názvu alebo kódu a pridať…" value="${esc(o.q)}" style="max-width:420px"><button class="btn" data-act="x-od-scan" title="Skenovať kód">${ICON_SCAN}</button><button class="btn" data-act="x-od-need" title="Pridať položky pod minimom">Doplniť podľa návrhu</button></div>
    <div id="od-res" style="max-width:640px">${odResHtml()}</div>
    <div class="tablewrap"><table><thead><tr><th>Názov</th><th>Cudzí názov</th><th class="r">Nák. cena s DPH / MJ</th><th class="r">Počet</th><th class="r">Celkom s DPH</th><th></th></tr></thead><tbody id="od-body">${odBody()}</tbody></table></div>
    <p style="text-align:right;font-size:17px;margin:12px 4px">Celkom s DPH: <b id="od-total">${eur(odTotal())}</b></p>
    <label class="f">Poznámka v objednávke<textarea data-xf="od.note" style="min-height:70px" placeholder="Napr. dodacia adresa, termín…">${esc(o.note)}</textarea></label>
    <label class="f">E-mail, na ktorý sa objednávka posiela<input type="text" data-xf="od.email" value="${esc(S.settings.orderEmail||'')}" placeholder="objednavky@dodavatel.sk" style="max-width:360px"></label>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" data-act="x-od-mail" ${window.klimaMail?'':'title="Len v aplikácii pre PC"'}>${ICON.mail} Odoslať e-mailom (PDF)</button><button class="btn" data-act="x-od-print">Tlačiť / uložiť PDF</button></div>
  </section>`;
}
function odRefresh(){ const b=$('#od-body'); if(b) b.innerHTML=odBody(); const t=$('#od-total'); if(t) t.textContent=eur(odTotal()); }
view.addEventListener('input',e=>{
  const el=e.target, k=el.dataset&&el.dataset.xf; if(!k||!k.startsWith('od.')) return; const o=odState();
  if(k==='od.q'){ o.q=el.value; const r=$('#od-res'); if(r) r.innerHTML=odResHtml(); }
  else if(k==='od.note'){ o.note=el.value; odSave(); }
  else if(k==='od.qty'){ o.lines[+el.closest('tr').dataset.i].qty=el.value; odSave(); const r=odLine(o.lines[+el.closest('tr').dataset.i]); el.closest('tr').querySelector('.od-sum').textContent=eur(r.sum); $('#od-total').textContent=eur(odTotal()); }
  else if(k==='od.email'){ S.settings.orderEmail=el.value.trim(); saveSettings(); }
});
view.addEventListener('change',e=>{ const el=e.target, k=el.dataset&&el.dataset.xf; if(k==='od.sup'){ odState().supId=el.value; odSave(); renderView(); } });
view.addEventListener('keydown',e=>{ const el=e.target; if(e.key==='Enter'&&el.dataset&&el.dataset.xf==='od.q'){ e.preventDefault(); const q=el.value.trim(), ex=S.sklad.items.find(it=>q&&(String(it.ean||'')===q||String(it.scode||'')===q)), m=ex?[ex]:odMatches(q); if(m[0]) odAdd(m[0].id,1); else toast('Nič sa nenašlo.'); } });
view.addEventListener('click',e=>{
  const b=e.target.closest('[data-act^="x-od-"]'); if(!b) return; const a=b.dataset.act, o=odState();
  if(a==='x-od-add') odAdd(b.dataset.id,1);
  else if(a==='x-od-del'){ o.lines.splice(+b.closest('tr').dataset.i,1); odSave(); renderView(); }
  else if(a==='x-od-clear'){ o.lines=[]; o.note=''; odSave(); renderView(); }
  else if(a==='x-od-need'){ let n=0; for(const x of skNeeds()){ if(o.supId&&x.it.supplierId!==o.supId) continue; if(o.lines.some(l=>l.id===x.it.id)) continue; o.lines.push({id:x.it.id,qty:String(skOrderQty(x))}); n++; } odSave(); renderView(); toast(n?`Pridaných ${n} položiek podľa návrhu.`:'Nie je čo doplniť.'); }
  else if(a==='x-od-scan') xScan(code=>{ const it=S.sklad.items.find(x=>String(x.ean||'')===code||String(x.scode||'')===code); if(!it){ toast('Kód '+code+' sa v sklade nenašiel.'); return; } odAdd(it.id,1); });
  else if(a==='x-od-print') odPrint();
  else if(a==='x-od-mail') odMail();
});

/* ============ štart ============ */
async function boot(){
  routeFromHash(); renderAll();
  await Store.init(); await Cloud.start();
  try{
    const [cat,set,dr,sk,qs,ms,nr,cu,ev,ex,cs,dk]=await Promise.all([Store.get('app/catalog'),Store.get('app/settings'),Store.get('app/draft'),Store.get('app/sklad'),Store.list('quotes'),Store.list('montaze'),Store.get('app/naradie'),Store.list('customers'),Store.list('events'),Store.list('expenses'),Store.list('cases'),Store.list('doklady')]);
    S.doklady=dk||[]; S.customers=cu||[]; S.events=ev||[]; S.expenses=ex||[]; S.cases=cs||[];
    if(nr&&Array.isArray(nr.items)) S.tools={items:nr.items,log:nr.log||[]};
    S.quotes=(qs||[]).map(d=>Object.assign(d,{status:cpStatus(d)})); S.montaze=ms||[];
    if(sk&&Array.isArray(sk.items)) S.sklad=skMake(sk);
    if(cat&&Array.isArray(cat.rows)&&cat.rows.length) S.catalog.rows=cat.rows;
    if(set) Object.assign(S.settings,set);
    if(dr&&dr.q){ const q=dr.q; Q=Object.assign(newQuote(),q,{customer:Object.assign(newQuote().customer,q.customer||{}),lines:q.lines||{},custom:q.custom||[],variants:q.variants||[]}); }
    await migrate();
    setStatus(Store.db?'cloud':'local'); if(Cloud.offline) setStatus('err');
  }catch(e){ Store.ok=false; setStatus('err'); }
  const unlocked=S.settings.pinHash?lockShow():Promise.resolve();
  S.loaded=true; renderAll();
  if(window.klimaPhotos){ try{ S.ph=await window.klimaPhotos.getConfig(); }catch(e){} }
  if(window.klimaBackup){ try{ S.bk=await window.klimaBackup.getConfig(); await autoBackup(); setInterval(()=>autoBackup(),3600e3); }catch(e){} renderView(); }
  await unlocked;
  shareCheckSoon();
  const nf=S.quotes.filter(cpNeedsFollow).length;
  if(nf) toast((nf===1?'1 ponuka čaká':nf<5?nf+' ponuky čakajú':nf+' ponúk čaká')+` na odpoveď dlhšie ako ${CP_FOLLOW_DAYS} dní.`,'Zobraziť',()=>{ S.moId=null; S.cpTab='cp'; S.cpFilter='follow'; S.module='cp'; location.hash='#evidencia-cp'; renderAll(); });
}
boot();
</script>
