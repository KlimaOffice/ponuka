<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klima Office – Nová klimatizácia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6fb; --surface:#ffffff; --ink:#0f1b2d; --muted:#667589; --line:#e2e8f0;
  --navy:#0b1f3a; --navy-2:#12315c; --brand:#0284c7; --brand-soft:#e0f2fe; --band:#e8f1fa;
  --good:#16a34a; --warn:#d97706; --bad:#dc2626; --input:#fff;
  --radius:14px; --shadow:0 1px 2px rgba(15,27,45,.05),0 4px 16px rgba(15,27,45,.05);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0a1220;--surface:#101b2e;--ink:#e6edf7;--muted:#8a9bb2;--line:#22324a;--band:#17263e;--brand-soft:#0c2a40;--input:#0c1626;--shadow:none}
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* layout */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.sidebar{background:linear-gradient(180deg,var(--navy) 0%,#0a2a4d 100%);color:#cbd8ea;padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px}
.brand-mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#38bdf8,#0284c7);display:grid;place-items:center;color:#fff;box-shadow:0 6px 18px rgba(2,132,199,.45)}
.brand b{display:block;color:#fff;font-size:15px;letter-spacing:.2px}
.brand small{color:#7f95b3;font-size:11.5px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;color:#b6c6dc;text-decoration:none;font-weight:500;position:relative;transition:background .15s,color .15s}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.active{background:rgba(56,189,248,.16);color:#fff}
.nav a.active::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:#38bdf8}
.nav .soon{margin-left:auto;font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:#6f86a6;border:1px solid rgba(255,255,255,.12);padding:1px 6px;border-radius:99px}
.side-foot{margin-top:auto;padding:12px;border-radius:12px;background:rgba(255,255,255,.05);font-size:12px;color:#8ea3c0;display:flex;gap:9px;align-items:flex-start}
.dot{width:8px;height:8px;border-radius:50%;background:#4ade80;margin-top:5px;flex:none}
.dot.err{background:#f87171}.dot.local{background:#fbbf24}

main{padding:28px 32px 60px;min-width:0}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-head h1{margin:0;font-size:24px;letter-spacing:-.4px}
.page-head p{margin:2px 0 0;color:var(--muted)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button.on{background:var(--navy);color:#fff}
@media (prefers-color-scheme:dark){.seg button.on{background:var(--brand)}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:18px}
.card h3{margin:0 0 14px;font-size:14px;font-weight:650;letter-spacing:.1px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-head h3{margin:0}
.quote-grid{display:grid;grid-template-columns:minmax(0,1fr) 316px;gap:20px;align-items:start}
.summary{position:sticky;top:20px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.form-grid .wide{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:500}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=number],input[type=password],textarea,select{background:var(--input);border:1px solid var(--line);border-radius:9px;padding:9px 11px;outline:none;width:100%;color:var(--ink);transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(2,132,199,.16)}
textarea{min-height:72px;resize:vertical}
::placeholder{color:#a3b0c2}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:550;transition:transform .05s,background .15s,border-color .15s}
.btn:hover{border-color:#b9c6d8}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#0369a1}
.btn.ghost{background:transparent}
.btn.small{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn svg.i{width:17px;height:17px}
.link{background:none;border:0;color:var(--brand);cursor:pointer;font-weight:550;padding:4px 2px}
.link:hover{text-decoration:underline}

/* tables */
.tablewrap{overflow-x:auto;margin:0 -6px;padding:0 6px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
thead th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th.r,td.r{text-align:right}
td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.name{min-width:260px}
td.unit{color:var(--muted);width:64px;white-space:nowrap}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.band td{border:0;font-weight:650;padding:9px 12px}
tr.band.h1 td{background:var(--navy);color:#fff;font-size:13px;letter-spacing:.3px}
tr.band.h1 td:first-child{border-radius:9px 0 0 9px}tr.band.h1 td:last-child{border-radius:0 9px 9px 0}
tr.band.h2 td{background:var(--band);color:var(--ink);font-size:12.5px}
tr.band.h1 td, tr.band.h2 td{border-bottom:0}
tr.spacer td{border:0;padding:5px}
tr.item:hover td{background:rgba(2,132,199,.04)}
tr.item.zero td.name,tr.item.zero td.unit,tr.item.zero td.total{opacity:.5}
tr.addrow td{border:0;padding:2px 10px 6px}
td input.n{width:92px;text-align:right;padding:7px 9px;font-variant-numeric:tabular-nums}
td input.n.qty{width:78px;font-weight:600}
td input.txt{padding:7px 9px}
td input.unit-in{width:62px}
.hide-int .int{display:none}
.int{background:rgba(217,119,6,.045)}
td.profit{color:var(--good);font-weight:550}
td.profit.neg{color:var(--bad)}
td.total{font-weight:650}
.x{border:0;background:none;color:var(--muted);cursor:pointer;padding:4px;border-radius:6px;display:inline-grid;place-items:center}
.x:hover{color:var(--bad);background:rgba(220,38,38,.08)}
.namewrap{display:flex;align-items:center;gap:6px}
.namewrap input{flex:1}

/* kalendár, chips */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cal .wd{background:var(--band);padding:7px;text-align:center;font-size:11px;font-weight:650;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.cal-cell{background:var(--surface);min-height:98px;padding:6px 6px 4px;cursor:pointer;overflow:hidden}
.cal-cell:hover{background:rgba(2,132,199,.05)}
.cal-cell.other{background:var(--bg);opacity:.65}
.cal-cell.today .dn{background:var(--brand);color:#fff}
.cal-cell.sel{outline:2px solid var(--brand);outline-offset:-2px}
.cal-cell .dn{display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;border-radius:99px;font-size:12px;font-weight:650;margin-bottom:3px}
.chip{display:block;font-size:11.5px;padding:2px 6px;border-radius:6px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.montaz{background:rgba(2,132,199,.16);color:var(--brand)}
.chip.servis{background:rgba(217,119,6,.17);color:var(--warn)}
.chip.obhliadka{background:rgba(22,163,74,.15);color:var(--good)}
.chip.ine{background:rgba(120,135,155,.2);color:var(--muted)}
.chip.done{opacity:.6;text-decoration:line-through}
.chip.more{background:none;color:var(--muted)}
.dayitem{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.dayitem .chip{flex:none;min-width:78px;text-align:center}
.dayitem .t{flex:1}.dayitem small{display:block;color:var(--muted)}
@media (max-width:860px){.cal-cell{min-height:64px}.chip{font-size:10.5px}}
/* obrat a zisk */
.viz{--s1:#2a78d6;--s2:#eb6834}
@media (prefers-color-scheme:dark){.viz{--s1:#3987e5;--s2:#d95926}}
.stats.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1120px){.stats.k4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){.stats.k4{grid-template-columns:1fr}}
.legend{display:flex;gap:18px;align-items:center;color:var(--muted);font-size:12.5px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chartbox{position:relative;overflow-x:auto}
.chartbox svg{display:block;width:100%;min-width:600px;height:auto}
.ob-tick{fill:var(--muted);font-size:11px}
.ob-tip{position:absolute;pointer-events:none;background:var(--navy);color:#fff;border-radius:10px;padding:9px 12px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.28);z-index:5;min-width:170px}
.ob-tip b{display:block;margin-bottom:4px}
.ob-tip div{display:flex;justify-content:space-between;gap:16px;font-variant-numeric:tabular-nums}
.ob-tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.hbar{display:grid;grid-template-columns:minmax(120px,200px) 1fr 100px;gap:12px;align-items:center;padding:6px 0}
.hbar .track{height:18px}
.hbar .fill{height:18px;background:var(--s1);border-radius:0 4px 4px 0;min-width:2px}
.hbar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
@media (max-width:1120px){.ob-two{grid-template-columns:1fr!important}}
tr.totalrow td{font-weight:700;border-top:2px solid var(--line)}
/* náradie */
.badge.off{background:rgba(120,135,155,.18);color:var(--muted)}
.stats.four{grid-template-columns:repeat(3,minmax(0,1fr))}
tr.tl-detail td{background:rgba(2,132,199,.04);padding:14px 16px}
td.name small.tl-sub{display:block;color:var(--muted);font-size:12px;margin:3px 2px 0}
td input.txt-in{min-width:140px}
/* evidencia CP a montáží */
.badge.wait{background:rgba(2,132,199,.14);color:var(--brand)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;box-shadow:var(--shadow)}
.stat small{color:var(--muted);font-size:12px;font-weight:500}
.stat b{display:block;font-size:22px;letter-spacing:-.5px;margin-top:2px}
.stat span{color:var(--muted);font-size:12.5px}
.rowact{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
td.cust small{display:block;color:var(--muted)}
.back{display:inline-flex;gap:6px;align-items:center;border:0;background:none;color:var(--brand);font-weight:600;cursor:pointer;padding:0;margin-bottom:10px}
.proto-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 14px}
.proto-grid .s2{grid-column:span 2}.proto-grid .s4{grid-column:1/-1}
.stockbox{border:1px dashed var(--line);border-radius:10px;padding:10px 14px;margin-top:12px;color:var(--muted);font-size:13px}
@media (max-width:860px){.stats{grid-template-columns:1fr}.proto-grid{grid-template-columns:1fr 1fr}.proto-grid .s2{grid-column:1/-1}}
/* sklad + výber zo skladu */
.stepper{display:inline-flex;align-items:center;gap:4px}
.stepper button{width:28px;height:32px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;font-size:16px;line-height:1;color:var(--ink)}
.stepper button:hover{border-color:var(--brand);color:var(--brand)}
.stepper input{width:76px!important;text-align:center;font-weight:650}
.badge{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.badge.ok{background:rgba(22,163,74,.13);color:var(--good)}
.badge.low{background:rgba(217,119,6,.15);color:var(--warn)}
.badge.out{background:rgba(220,38,38,.13);color:var(--bad)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .grow{flex:1;min-width:200px}
.stk{display:block;font-size:11.5px;margin-top:3px;color:var(--muted)}
.stk.warn{color:var(--bad);font-weight:600}.stk.good{color:var(--good)}
select.pick{font-weight:550}
.log{margin:0;padding:0;list-style:none;font-size:13px}
.log li{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.log time{color:var(--muted);min-width:96px;white-space:nowrap}
.log .d{font-weight:700;min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.log .d.m{color:var(--bad)}.log .d.p{color:var(--good)}
.log em{color:var(--muted);font-style:normal}
td select{padding:7px 9px}
/* summary */
.sum-hero{background:linear-gradient(145deg,var(--navy),var(--navy-2) 60%,#0369a1);color:#fff;border-radius:var(--radius);padding:20px;box-shadow:0 10px 30px rgba(2,60,110,.28);margin-bottom:14px}
.sum-hero small{color:#9fc3e6;font-size:12px;font-weight:500;letter-spacing:.4px;text-transform:uppercase}
.sum-hero .big{font-size:34px;font-weight:700;letter-spacing:-1px;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.sum-hero .sub{color:#9fc3e6;font-size:12.5px}
.sum-int{border:1.5px dashed #e3b36a;border-radius:var(--radius);padding:14px 16px;background:rgba(217,119,6,.06);margin-bottom:14px}
.sum-int h4{margin:0 0 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--warn);display:flex;gap:6px;align-items:center}
.sum-int h4 svg.i{width:14px;height:14px}
.kv{display:flex;justify-content:space-between;padding:4px 0;font-variant-numeric:tabular-nums}
.kv span:first-child{color:var(--muted)}
.kv b{font-weight:650}
.kv.pr b{color:var(--good);font-size:17px}
.actions{display:grid;gap:9px}
.numtag{font-size:12px;color:var(--muted);margin-top:8px}
.numtag b{color:var(--ink)}

/* placeholders */
.soon-card{max-width:620px;text-align:center;padding:48px 32px;margin:40px auto}
.soon-card .ico{width:64px;height:64px;border-radius:18px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;margin:0 auto 16px}
.soon-card .ico svg.i{width:30px;height:30px}
.soon-card h2{margin:0 0 6px}
.soon-card p{color:var(--muted);margin:0 auto 14px;max-width:460px}
.soon-card ul{display:inline-block;text-align:left;color:var(--muted);margin:0;padding-left:18px}

.hint{color:var(--muted);font-size:12.5px;margin:-6px 0 12px}
.empty-load{padding:60px;text-align:center;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--navy);color:#fff;padding:11px 16px;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.3);display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:all .25s;z-index:50}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
/* ---- okno Odoslať mail ---- */
#map .leaflet-tooltip.map-no{background:transparent;border:0;box-shadow:none;color:#fff;font-weight:700;font-size:12px;padding:0}#map .leaflet-tooltip.map-no::before{display:none}
#map{font:inherit}
.mail-ov{position:fixed;inset:0;background:rgba(5,12,24,.6);display:grid;place-items:center;z-index:40;padding:20px}
.mail-win{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);width:min(780px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.mail-top{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line)}
.mail-top .from{font-weight:600;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mail-top .sp{flex:1}
.mail-main{padding:6px 16px 16px;overflow:auto}
.mail-row{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:7px 0}
.mail-row .lbl{flex:none;width:112px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;text-align:center;font-weight:600;font-size:13px}
.mail-row input,.mail-win textarea.body{border:0;background:transparent;border-radius:0;padding:8px 4px}
.mail-row input:focus,.mail-win textarea.body:focus{box-shadow:none}
.mail-row input.subj{font-size:15px}
.mail-win textarea.body{min-height:230px;resize:vertical;line-height:1.5;margin-top:6px}
.mail-att{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:6px 11px;margin-top:11px;font-size:12.5px;font-weight:550}
.mail-att svg.i{width:15px;height:15px}
.mail-set{background:var(--band);border-radius:10px;padding:12px 14px;margin-top:10px}
.mail-set p{margin:0 0 10px;font-size:12.5px;color:var(--muted);line-height:1.45}
.mail-set .form-grid{align-items:end}
.mail-err{color:var(--bad);font-size:12.5px;font-weight:550;margin-top:10px}
.mail-err:empty{display:none}
.cal-steps{margin:0 0 12px;padding-left:20px;font-size:13px;line-height:1.55;color:var(--ink)}.cal-steps li{margin-bottom:6px}
.gs{display:flex;gap:6px;margin:0 0 4px}
#gs{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:8px 11px;min-width:0}
#gs::placeholder{color:#7f95b3}
#lock-now{flex:none;width:36px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.07);color:#cfe0f5;cursor:pointer;display:grid;place-items:center}
#lock-now[hidden],#gs-res[hidden]{display:none}
#gs-res{position:fixed;left:256px;top:74px;width:min(440px,calc(100vw - 24px));max-height:72vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px rgba(0,0,0,.3);z-index:35;padding:6px}
.gs-g{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:8px 10px 4px}
.gs-item{display:block;width:100%;text-align:left;background:none;border:0;padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--ink)}
.gs-item:hover,.gs-item.on{background:var(--band)}
.gs-item small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
@media (max-width:860px){.gs{min-width:170px}#gs-res{left:12px;top:62px}}
#lock{position:fixed;inset:0;z-index:100;background:var(--navy);display:grid;place-items:center;padding:20px}
.lock-box{background:var(--surface);border-radius:var(--radius);padding:28px;width:min(340px,100%);display:flex;flex-direction:column;gap:12px;text-align:center}
.lock-box h2{margin:0 0 4px;font-size:17px}.lock-box .brand-mark{margin:0 auto}
.lock-box input{text-align:center;font-size:17px;letter-spacing:3px}
.lock-msg{font-size:12.5px;color:var(--warn);font-weight:550}.lock-msg:empty{display:none}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.ph{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:7px;cursor:zoom-in;background:var(--band)}
.ph-meta{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--muted)}
.ph-ov{position:fixed;inset:0;background:rgba(5,12,24,.88);display:grid;place-items:center;z-index:45;cursor:zoom-out}
.ph-ov img{max-width:94vw;max-height:94vh;border-radius:8px}
.packs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px;font-size:12.5px;color:var(--muted)}
.vtot{font-size:12px;color:var(--muted)}.vtot b{color:var(--ink)}
.sum-vars .kv span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;padding-right:8px}
.sum-vars .vsub{font-size:11.5px;color:var(--muted);margin:-2px 0 8px;text-align:right}
.sum-vars[hidden]{display:none}
.mail-chk{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:12.5px;cursor:pointer}
.mail-tpl{display:flex;gap:14px;font-size:12.5px;margin-top:2px}
.mail-win [hidden]{display:none}
.mail-win .btn:disabled{opacity:.6;cursor:default}
#toast button{background:none;border:0;color:#7dd3fc;font-weight:650;cursor:pointer}

@media (max-width:1120px){
  .quote-grid{grid-template-columns:1fr}
  .summary{position:static;order:-1;display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .summary .sum-hero,.summary .sum-int{margin:0}
  .summary .actions{grid-column:1/-1;grid-template-columns:repeat(3,1fr)}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .sidebar{position:sticky;height:auto;flex-direction:row;align-items:center;padding:10px 12px;gap:10px;z-index:20;overflow-x:auto}
  .brand small,.brand b,.side-foot,.nav .soon{display:none}
  .nav{flex-direction:row}
  .nav a span{display:none}
  .nav a.active::before{display:none}
  main{padding:18px 14px 50px}
  .form-grid{grid-template-columns:1fr}
  .summary{grid-template-columns:1fr}
  .summary .actions{grid-template-columns:1fr}
}

<script>
/* ============ pomocné ============ */
const ICON = {

  clock:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>',
  db:'<svg class="i" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>',
  file:'<svg class="i" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v4h4"/></svg>',
  pin:'<svg class="i" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5a7 7 0 0 0-14 0C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  link:'<svg class="i" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7.1-7.1l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7.1 7.1l1.7-1.7"/></svg>'
};
const nf = new Intl.NumberFormat('sk-SK',{minimumFractionDigits:2,maximumFractionDigits:2});
const eur = n => (typeof Cloud!=='undefined'&&['monter','brigadnik'].includes(Cloud.curRole()))?'–':nf.format(n||0)+' €';
const fq = n => (+(+n).toFixed(2)).toLocaleString('sk-SK');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,10);
const clone = o => JSON.parse(JSON.stringify(o));
const today = () => new Date().toLocaleDateString('sv-SE');
const dfmt = iso => { if(!iso) return ''; const [y,m,d]=iso.split('-'); return `${+d}. ${+m}. ${y}`; };
const addDays = (iso,n) => { const d=new Date(iso+'T12:00'); d.setDate(d.getDate()+n); return d.toLocaleDateString('sv-SE'); };
const debounce = (fn,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}};
const withTimeout = (p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]);
const $ = (s,r=document)=>r.querySelector(s);

/* ============ šablóna (podľa Excelu) ============ */
/* ceny sú zámerne 0 – dopĺňajú sa v záložke „Cenník a šablóna“ */
const DEFAULT_ROWS = [
  {id:'g-zar',kind:'h1',title:'Zariadenie'},
  {id:'i-klima',kind:'item',name:'Klimatizácia AUX- C-Smart Premium 3,5 KW',unit:'kpl',q:1,buy:0,sell:0},
  {id:'g-rozv',kind:'h1',title:'Rozvody a kotviaci materiál'},
  {id:'g-cu',kind:'h2',title:'Cu rozvody vrátane príslušenstva'},
  {id:'i-cu',kind:'item',name:'Cu potrubie mäkké predizolované',unit:'m',q:0,buy:0,sell:0},
  {id:'i-cu-lista',kind:'item',name:'Plastová lišta na Cu potrubie vrátane tvaroviek',unit:'m',q:0,buy:0,sell:0},

  {id:'i-vid',kind:'item',name:'Vidlica priechodná',unit:'ks',q:0,buy:0,sell:0},
  {id:'i-istic',kind:'item',name:'Istič',unit:'ks',q:0,buy:0,sell:0},
  {id:'g-mont',kind:'h2',title:'Montážny a kotviaci materiál'},
  {id:'i-konz',kind:'item',name:'Konzola pod vonkajšiu jednotku vrátane konzoly, silentblokov a kotvenia',unit:'ks',q:1,buy:0,sell:0},
  {id:'i-ost',kind:'item',name:'Ostatný kotviaci materiál a montážny materiál',unit:'ks',q:1,buy:0,sell:0},
  {id:'i-plnenie',kind:'item',name:'Plnenie okruhu',unit:'g',q:0,buy:0,sell:0},
  {id:'g-ost',kind:'h1',title:'Ostatné'},
  {id:'i-mdop',kind:'item',name:'Montáž a Doprava',unit:'ks',q:1,buy:0,sell:0}
];

/* ============ úložisko (cloud db, inak localStorage) ============ */
const Store = {
  db:null, dl:null, ok:true, chain:{}, mem:{},
  async init(){
    if(typeof claude!=='undefined' && claude && claude.use){
      try{ this.db = await withTimeout(claude.use('db'),5000); }catch(e){ this.db=null; }
      try{ this.dl = await withTimeout(claude.use('downloads'),5000); }catch(e){ this.dl=null; }
    }
  },
  lsGet(k){ try{ const v=localStorage.getItem('klimaoffice:'+k); if(v!==null) return JSON.parse(v);}catch(e){} return this.mem[k]??null; },
  lsSet(k,v){ this.mem[k]=v; try{ localStorage.setItem('klimaoffice:'+k,JSON.stringify(v)); }catch(e){} },
  async get(path){
    if(this.db){ const s = await withTimeout(this.db.doc(path).get(),8000); return s.exists ? clone(s.data()) : null; }
    return this.lsGet(path);
  },
  async list(col){
    if(this.db){ const s=await withTimeout(this.db.collection(col).get(),8000); return s.docs.map(d=>clone(d.data())); }
    const out=[], pre='klimaoffice:'+col+'/';
    try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k.startsWith(pre)) out.push(JSON.parse(localStorage.getItem(k))); } }catch(e){}
    for(const k in this.mem) if(k.startsWith(col+'/') && !out.some(o=>o.id===k.slice(col.length+1))) out.push(this.mem[k]);
    return out;
  },
  async del(path){
    if(this.db) await this.db.doc(path).delete();
    else { delete this.mem[path]; try{ localStorage.removeItem('klimaoffice:'+path); }catch(e){} }
  },
  set(path,data){
    if(!this.ok) return Promise.reject(new Error('read-failed'));
    const prev=this.chain[path]||Promise.resolve();
    const next=prev.catch(()=>{}).then(async()=>{
      if(this.db) await this.db.doc(path).set(data); else this.lsSet(path,data);
    });
    this.chain[path]=next; return next;
  }
};

/* ============ spoločná databáza (Supabase) ============ */
const CLOUD_ARR=['quotes','montaze','customers','events','expenses','cases'];
const SET_LOCAL=['pinHash','mailTpl','mailBccSelf','bkMail','bkMailAt','lastBackup','autoBkAt','geo','calUrl','calToken','calSync'];
const ROLES={majitel:'Majiteľ',monter:'Montér',brigadnik:'Brigádnik',citanie:'Len čítanie'};
const ROLE_MODS={monter:['sklad','cp','zak','mapa','kal','servis','naradie','zaloha'],brigadnik:['cp','kal','sklad','zak','zaloha'],citanie:['sklad','cp','zak','mapa','kal','servis','naradie','zaloha']};
const roleMods=()=>{ const m=ROLE_MODS[Cloud.curRole()]; return m?MODULES.filter(x=>m.includes(x.key)):MODULES.filter(x=>!x.cloudOwner||(Cloud.on&&Cloud.role==='majitel')); };
const setShared=o=>{ const r={}; for(const k in o) if(!SET_LOCAL.includes(k)) r[k]=o[k]; return r; };
const Cloud = {
  skQ:[], forceSklad:false, legacySklad:false, cfg:null, on:false, offline:false, known:{}, last:'', busy:false, _rf:null, role:'majitel', users:null, usersLoading:false,
  tbl(){ return this.role==='majitel'?'docs':'docs_pub'; },
  curRole(){ return this.on?this.role:((this.cfg&&this.cfg.ses&&this.cfg.role)||'majitel'); },
  load(){ try{ this.cfg=JSON.parse(localStorage.getItem('klimaoffice-cloud')||'null'); }catch(e){ this.cfg=null; } },
  save(){ try{ localStorage.setItem('klimaoffice-cloud',JSON.stringify(this.cfg)); }catch(e){} },
  async auth(grant,body,url,key){
    const r=await withTimeout(fetch(url+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify(body)}),15000);
    const j=await r.json().catch(()=>({}));
    if(!r.ok){ const e=new Error(j.msg||j.error_description||j.error||('HTTP '+r.status)); e.status=r.status; throw e; }
    return {access:j.access_token,refresh:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000};
  },
  async fresh(){
    const c=this.cfg; if(!c||!c.ses) throw new Error('nie si prihlásený');
    if(c.ses.exp-Date.now()>60e3) return;
    if(!this._rf) this._rf=this.auth('refresh_token',{refresh_token:c.ses.refresh},c.url,c.key).then(ses=>{ c.ses=ses; this.save(); }).finally(()=>{ this._rf=null; });
    await this._rf;
  },
  async http(method,path,o){
    o=o||{}; await this.fresh(); const c=this.cfg;
    const h=Object.assign({apikey:c.key,Authorization:'Bearer '+c.ses.access,'Content-Type':'application/json'},o.headers||{});
    const r=await withTimeout(fetch(c.url+path,{method,headers:h,body:o.body!==undefined?JSON.stringify(o.body):undefined}),20000);
    if(!r.ok){ const t=await r.text().catch(()=>''); const e=new Error('HTTP '+r.status+' '+t.slice(0,200)); e.status=r.status; throw e; }
    const t=await r.text(); return t?JSON.parse(t):null;
  },
  async all(q){ const out=[]; for(let off=0;;off+=1000){ const rows=await this.http('GET','/rest/v1/'+this.tbl()+'?'+q+'&limit=1000&offset='+off); out.push(...rows); if(rows.length<1000) break; } return out; },
  split(p){ const i=p.indexOf('/'); return [p.slice(0,i),p.slice(i+1)]; },
  note(r){ this.known[r.col+'/'+r.id]=r.updated_at; if(r.updated_at>this.last) this.last=r.updated_at; },
  q(p){ const [c,i]=this.split(p); return 'col=eq.'+encodeURIComponent(c)+'&id=eq.'+encodeURIComponent(i); },
  async dget(p){
    if(p==='app/draft'){ const v=Store.lsGet(p); return {exists:v!==null,data:()=>v}; }
    const rows=await this.http('GET','/rest/v1/'+this.tbl()+'?'+this.q(p)+'&select=col,id,data,updated_at');
    if(!rows.length) return {exists:false};
    this.note(rows[0]); let d=rows[0].data;
    if(p==='app/settings') d=Object.assign({},Store.lsGet(p)||{},d);
    Store.lsSet(p,d); return {exists:true,data:()=>d};
  },
  async dlist(c){
    const rows=await this.all('col=eq.'+encodeURIComponent(c)+'&select=col,id,data,updated_at&order=id');
    rows.forEach(r=>{ this.note(r); Store.lsSet(c+'/'+r.id,r.data); });
    return {docs:rows.map(r=>({data:()=>r.data}))};
  },
  async dset(p,d){
    if(p==='app/draft'){ Store.lsSet(p,d); return; }
    Store.lsSet(p,d);
    const [c,i]=this.split(p);
    if(this.role!=='majitel'||p==='app/sklad'){
      if(c==='quotes'||c==='expenses'||p==='app/catalog'||p==='app/settings') return;
      if(p==='app/sklad'){ await this.skFlush(); if(this.forceSklad){ d=Object.assign({},d,{_force:true}); this.forceSklad=false; } }
      const ts=await this.http('POST','/rest/v1/rpc/save_doc',{body:{p_col:c,p_id:i,p_data:d}});
      this.note({col:c,id:i,updated_at:ts});
      if(p==='app/sklad'&&!this.legacySklad){   /* server mohol zlúčiť zmeny iných – vezmi výsledný stav */
        const rows=await this.http('GET','/rest/v1/'+this.tbl()+'?'+this.q(p)+'&select=col,id,data,updated_at');
        if(rows[0]){ this.note(rows[0]); const before=JSON.stringify(S.sklad.items.map(x=>x.stock)); this.apply('app','sklad',rows[0].data); if(before!==JSON.stringify(S.sklad.items.map(x=>x.stock))&&!this.typing()) renderView(); }
      }
      return;
    }
    const rows=await this.http('POST','/rest/v1/docs?on_conflict=col,id',{headers:{Prefer:'resolution=merge-duplicates,return=representation'},body:{col:c,id:i,data:p==='app/settings'?setShared(d):d}});
    if(rows&&rows[0]) this.note(rows[0]);
  },
  async ddel(p){
    const [c,i]=this.split(p); delete this.known[p];
    try{ localStorage.removeItem('klimaoffice:'+p); }catch(e){} delete Store.mem[p];
    if(this.role!=='majitel'){
      try{ await this.http('POST','/rest/v1/rpc/delete_doc',{body:{p_col:c,p_id:i}}); }
      catch(e){ toast('Mazanie nie je povolené – nemáš oprávnenie.'); this.known={}; this.poll(); throw e; }
      return;
    }
    await this.http('DELETE','/rest/v1/docs?'+this.q(p));
  },
  async sto(method,path,o){
    o=o||{}; await this.fresh(); const c=this.cfg;
    const r=await withTimeout(fetch(c.url+'/storage/v1/object/'+path,{method,headers:Object.assign({apikey:c.key,Authorization:'Bearer '+c.ses.access},o.headers||{}),body:o.body}),60000);
    if(!r.ok){ const t=await r.text().catch(()=>''); const e=new Error('HTTP '+r.status+' '+t.slice(0,200)); e.status=r.status; throw e; }
    return r;
  },
  async skFlush(){
    if(!this.skQ.length) return;
    const q=this.skQ.slice();
    try{
      const res=await this.http('POST','/rest/v1/rpc/sklad_adjust',{body:{p_changes:q}});
      this.skQ.splice(0,q.length); let diff=false;
      for(const id in res){ const it=S.sklad.items.find(x=>x.id===id); if(it&&it.stock!==res[id]){ it.stock=res[id]; diff=true; } }
      if(diff&&!this.typing()) renderView();
    }catch(e){ if(e.status===404){ this.skQ.splice(0,q.length); this.legacySklad=true; } else throw e; }   /* starý server bez funkcie: ukladá sa celý dokument */
  },
  async getRole(){
    try{ return await this.http('POST','/rest/v1/rpc/my_role',{body:{}}); }
    catch(e){ if(e.status===404) return 'majitel'; throw e; }
  },
  async loadUsers(){
    if(this.usersLoading||this.role!=='majitel') return; this.usersLoading=true;
    try{ this.users=await this.http('POST','/rest/v1/rpc/list_users',{body:{}}); }catch(e){ this.users=[]; this.usersErr=e.message||String(e); }
    this.usersLoading=false; if(!this.typing()) renderView();
  },
  adapter(){ const me=this; return {
    doc:p=>({get:()=>me.dget(p),set:d=>me.dset(p,d),delete:()=>me.ddel(p)}),
    collection:c=>({get:()=>me.dlist(c)}) }; },
  async counter(min){ const n=await this.http('POST','/rest/v1/rpc/next_counter',{body:{p_name:'quote',p_min:min}}); return Number(n); },
  /* štart aplikácie: ak je cloud nastavený, prepne úložisko naň */
  async start(){
    this.load(); if(!this.cfg||!this.cfg.ses) return;
    try{
      await this.fresh();
      const r=await this.getRole();
      if(!r){ const e=new Error('norole'); e.norole=true; throw e; }
      this.role=r; this.cfg.role=r; this.save();
      await this.http('GET','/rest/v1/'+this.tbl()+'?select=id&limit=1');
      this.on=true; Store.db=this.adapter();
    }catch(e){
      this.offline=true; this.err=e&&e.norole?'Nemáš pridelenú rolu – požiadaj majiteľa, aby ti ju nastavil.':(e&&e.status===400||e&&e.status===401)?'Prihlásenie vypršalo – prihlás sa znova v časti Záloha údajov.':'Cloud je nedostupný – údaje sa zobrazujú z lokálnej kópie a nedajú sa meniť.';
      Store.ok=false;
    }
  },
  /* prvé pripojenie: prihlásenie + prenos údajov */
  async connect(url,key,email,pw){
    url=url.trim().replace(/\/+$/,''); key=key.trim(); email=email.trim();
    if(!/^(https:\/\/[^/\s]+|http:\/\/(localhost|127\.0\.0\.1)(:\d+)?)$/.test(url)) throw new Error('Project URL má vyzerať ako https://xxxx.supabase.co');
    if(!key||!email||!pw) throw new Error('Vyplň všetky polia.');
    const ses=await this.auth('password',{email,password:pw},url,key);
    const had=!!(this.cfg&&this.cfg.url===url);
    this.cfg={url,key,email,ses}; this.save(); let note='';
    if(!had){
      const role=await this.getRole();
      if(!role) throw new Error('Nemáš pridelenú rolu – požiadaj majiteľa, aby ti ju nastavil.');
      this.role=role; this.cfg.role=role; this.save();
      const remote=await this.http('GET','/rest/v1/'+this.tbl()+'?select=col,id&limit=1');
      const local=await Cloud.localDocs();
      const hasLocal=local.some(d=>d.col!=='app')||local.some(d=>d.id==='sklad'&&(d.data.items||[]).length);
      if(role==='majitel'&&!remote.length&&local.length){
        for(let i=0;i<local.length;i+=100) await this.http('POST','/rest/v1/docs?on_conflict=col,id',{headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:local.slice(i,i+100)});
        note='upload';
      } else if(remote.length&&hasLocal){ note='backup'; }
    }
    return note;
  },
  async localDocs(){
    const out=[]; const add=(col,id,data)=>{ if(data) out.push({col,id,data:col==='app'&&id==='settings'?setShared(data):data}); };
    for(const k of ['catalog','settings','sklad','naradie']) add('app',k,await Store.get('app/'+k));
    for(const c of CLOUD_ARR) for(const d of await Store.list(c)) if(d&&d.id) add(c,d.id,d);
    return out;
  },
  /* synchronizácia zmien od iných používateľov */
  typing(){ const a=document.activeElement; return !!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)); },
  async poll(){
    if(!this.on||this.busy||this.typing()) return; this.busy=true;
    try{
      const ids=await this.all('select=col,id,updated_at&order=col,id');
      const seen=new Set(), ch=[];
      for(const r of ids){ const k=r.col+'/'+r.id; seen.add(k); if(this.known[k]!==r.updated_at) ch.push(r); }
      const gone=Object.keys(this.known).filter(k=>!seen.has(k));
      if(!ch.length&&!gone.length) return;
      if(this.typing()) return;
      let dirty=false;
      for(const r of ch){
        const rows=await this.http('GET','/rest/v1/'+this.tbl()+'?'+this.q(r.col+'/'+r.id)+'&select=col,id,data,updated_at');
        if(rows[0]){ this.note(rows[0]); Store.lsSet(r.col+'/'+r.id,rows[0].data); dirty=this.apply(r.col,r.id,rows[0].data)||dirty; }
      }
      for(const k of gone){ delete this.known[k]; const [c,i]=this.split(k); try{ localStorage.removeItem('klimaoffice:'+k); }catch(e){} delete Store.mem[k]; dirty=this.apply(c,i,null)||dirty; }
      if(dirty&&!this.typing()) renderAll();
    }catch(e){ if(e&&(e.status===401||e.status===400)){ this.on=false; this.offline=true; Store.ok=false; Store.db=null; setStatus('err'); toast('Prihlásenie do cloudu vypršalo – prihlás sa znova v časti Záloha údajov.'); } }
    finally{ this.busy=false; }
  },
  apply(c,id,d){
    if(CLOUD_ARR.includes(c)){
      const a=S[c], i=a.findIndex(x=>x.id===id);
      if(d===null){ if(i<0) return false; a.splice(i,1); return true; }
      if(c==='quotes') d=Object.assign(d,{status:cpStatus(d)});
      if(i>=0) a[i]=d; else a.push(d); return true;
    }
    if(c!=='app'||d===null) return false;
    if(id==='catalog'&&Array.isArray(d.rows)&&d.rows.length) S.catalog.rows=d.rows;
    else if(id==='sklad'&&Array.isArray(d.items)) S.sklad={items:d.items,log:d.log||[]};
    else if(id==='naradie'&&Array.isArray(d.items)) S.tools={items:d.items,log:d.log||[]};
    else if(id==='settings') Object.assign(S.settings,d);
    else return false;
    return true;
  }
};

const r3 = n => Math.round(n*1000)/1000;
const rowLabel = r => r.label || (r.id==='i-klima' ? 'Zariadenie' : r.name);
const stockFor = rid => S.sklad.items.filter(x=>x.slot===rid);
/* skladové položky priradené k podskupine / hlavnej skupine, do ktorej riadok patrí */
function stockForGroups(rid){
  const rows=S.catalog.rows; let i=rows.findIndex(x=>x.id===rid); if(i<0) return [];
  const ids=[];
  for(i--;i>=0;i--){
    const k=rows[i].kind; if(k==='item') continue;
    if(!ids.length||k==='h1'){ ids.push(rows[i].id); if(k==='h1') break; }
  }
  return S.sklad.items.filter(x=>ids.includes(x.slot));
}
const stockOpt = (o,sel)=>`<option value="${esc(o.id)}" ${o.id===sel?'selected':''}>${esc(o.name)} · skladom ${fq(o.stock)} ${esc(o.unit)}</option>`;
const pickOptions = it => it.opts.map(o=>stockOpt(o,it.stockId)).join('');
function resolveCatalogRow(r){
  const o=Q.lines[r.id]||{};
  const direct=stockFor(r.id);
  const opts=direct.concat(stockForGroups(r.id).filter(x=>!direct.includes(x)));
  let pickId=o.pick; if(pickId===undefined && direct.length===1) pickId=direct[0].id;
  const st=pickId?opts.find(x=>x.id===pickId):null;
  const varSlot=r.id==='i-klima';   // pri variantoch zariadenie nahrádzajú riadky variantov
  return {id:r.id,name:st?st.name:r.name,tplName:rowLabel(r),unit:st?st.unit:r.unit,custom:false,varSlot,
    qty:varSlot&&Q.variants.length?0:(o.qty!==undefined?o.qty:(r.q||0)),
    buy:o.buy!==undefined?o.buy:(st?st.buy:(r.buy||0)),
    sell:o.sell!==undefined?o.sell:(st?st.sell:(r.sell||0)),
    buySet:o.buy!==undefined, sellSet:o.sell!==undefined,
    defBuy:st?st.buy:(r.buy||0), defSell:st?st.sell:(r.sell||0),
    opts, stockId:st?st.id:null, stock:st?st.stock:null, spec:st?st.spec:''};
}
function collect(){
  const groups=[]; let cur=null;
  for(const r of S.catalog.rows){
    if(r.kind==='item'){
      if(!cur){cur={header:null,items:[]};groups.push(cur);}
      cur.items.push(resolveCatalogRow(r));
    } else { cur={header:r,items:[]}; groups.push(cur); }
  }
  if(!groups.length) groups.push({header:null,items:[]});
  const known=new Set(groups.map(g=>g.header?g.header.id:'_'));
  for(const c of Q.custom){
    let g=groups.find(g=>(g.header?g.header.id:'_')===c.group);
    if(!g) g=groups[groups.length-1];
    const ids=groupSlotIds(g), opts=S.sklad.items.filter(x=>ids.includes(x.slot));
    const st=c.stockId?S.sklad.items.find(x=>x.id===c.stockId):null;
    g.items.push({id:c.id,name:c.name,unit:c.unit,custom:true,qty:c.qty||0,buy:c.buy||0,sell:c.sell||0,
      buySet:true,sellSet:true,defBuy:0,defSell:0,opts,stockId:st?st.id:null,stock:st?st.stock:null,spec:st?st.spec:''});
  }
  return groups;
}
/* id skupiny + id nadradenej hlavnej skupiny (pre priradenie skladu k celej skupine) */
function groupSlotIds(g){
  if(!g.header) return [];
  const ids=[g.header.id];
  if(g.header.kind==='h2'){
    const rows=S.catalog.rows;
    for(let i=rows.findIndex(r=>r.id===g.header.id)-1;i>=0;i--) if(rows[i].kind==='h1'){ ids.push(rows[i].id); break; }
  }
  return ids;
}
function calc(it){ const total=it.qty*it.sell, cost=it.qty*it.buy; return {total,cost,profit:total-cost}; }
function totals(){
  let total=0,cost=0,count=0;
  for(const g of collect()) for(const it of g.items){ const c=calc(it); total+=c.total; cost+=c.cost; if(it.qty>0) count++; }
  const profit=total-cost;
  return {total,cost,profit,margin: total>0 ? profit/total*100 : 0, count};
}

function lineInput(el){
  const tr=el.closest('tr'); if(!tr) return; const id=tr.dataset.id, f=el.dataset.f;
  const c=Q.custom.find(x=>x.id===id);
  if(f==='name'||f==='unit'){ if(c) c[f]=el.value; saveDraft(); return; }
  const raw=el.value.trim(); let v=raw===''?undefined:parseFloat(raw.replace(',','.'));
  if(v!==undefined && (isNaN(v)||v<0)) v=undefined;
  if(c){ c[f]=v===undefined?0:v; }
  else{

  }

}

/* pripomienky všetkým ponukám bez odpovede naraz; nič neodíde bez potvrdenia */
async function followAll(){
  if(!window.klimaMail){ toast('Odosielanie mailov funguje len v nainštalovanej aplikácii Klima Office.'); return; }
  if($('#fu-ov')) return;
  const list=S.quotes.filter(cpNeedsFollow); if(!list.length){ toast('Žiadna ponuka nečaká na pripomenutie.'); return; }
  const cfg=await window.klimaMail.getConfig();
  if(!cfg.hasPass){ toast('Najprv nastav odosielanie mailov (Odoslať mail → Nastaviť).'); return; }
  const mailOf=d=>(d.customer&&d.customer.email)||d.sentTo||'';
  const ov=document.createElement('div'); ov.className='mail-ov'; ov.id='fu-ov';
  ov.innerHTML=`<div class="mail-win" role="dialog" aria-label="Pripomienky k ponukám">
    <div class="mail-top"><button class="btn primary" data-f="send" id="fu-send">${ICON.mail} Odoslať pripomienky</button><span class="from">Od: ${esc(cfg.user)}</span><span class="sp"></span><button class="btn small ghost" data-f="close" title="Zavrieť">${ICON.x}</button></div>
    <div class="mail-main"><p class="hint" style="margin:0 0 10px">Každému zaškrtnutému zákazníkovi odíde samostatný mail s textom nižšie. Značky {cislo} a {datum} sa doplnia podľa ponuky.</p>
      <div class="tablewrap" style="max-height:220px;overflow:auto"><table><tbody>${list.map(d=>{ const m=mailOf(d); return `<tr><td style="width:30px"><input type="checkbox" data-fu="${esc(d.id)}" ${m?'checked':'disabled'}></td><td><b>${esc(d.number)}</b></td><td>${esc((d.customer&&d.customer.name)||'–')}</td><td>${m?esc(m):'<span class="badge low">bez e-mailu</span>'}</td><td>bez odpovede ${cpSilentDays(d)} d</td></tr>`; }).join('')}</tbody></table></div>
      <textarea class="body" id="fu-text">${esc(mailTpl('cpRem'))}</textarea><div class="mail-err" id="fu-err"></div></div></div>`;
  const send=async()=>{
    const ids=[...ov.querySelectorAll('[data-fu]:checked')].map(x=>x.dataset.fu), btn=$('#fu-send');
    if(!ids.length){ $('#fu-err').textContent='Nie je zaškrtnutá žiadna ponuka.'; return; }
    if(btn.disabled) return; btn.disabled=true;
    const text=$('#fu-text').value, fails=[]; let n=0;
    for(const d of list.filter(x=>ids.includes(x.id))){
      btn.textContent='Odosielam '+(n+fails.length+1)+' / '+ids.length+'…';
      let r; try{ r=await window.klimaMail.send({to:mailOf(d).split(/[;,\s]+/).filter(Boolean),bcc:S.settings.mailBccSelf!==false?[cfg.user]:[],subject:'Cenová ponuka č. '+d.number+' – pripomienka',text:mailFill(text,{cislo:d.number,datum:dfmt(isoDay(d.sentAt))}),fromName:S.settings.company||''}); }
      catch(e){ r={ok:false,error:String(e&&e.message||e)}; }
      if(r.ok){ n++; d.remindedAt=new Date().toISOString(); await cpSave(d); if(Q.id===d.id) Q.remindedAt=d.remindedAt; } else fails.push('č. '+d.number+': '+r.error);
    }
    ov.remove(); renderView();
    toast((n===1?'Odoslaná 1 pripomienka.':n>=2&&n<=4?'Odoslané '+n+' pripomienky.':'Odoslaných '+n+' pripomienok.')+(fails.length?' Neodoslané: '+fails.join('; '):''));
  };
  ov.addEventListener('click',e=>{ const b=e.target.closest('[data-f]'); if(!b) return; if(b.dataset.f==='close') ov.remove(); else send(); });
  ov.addEventListener('keydown',e=>{ if(e.key==='Escape') ov.remove(); });
  document.body.appendChild(ov);
}
/* pripomienka servisnej prehliadky */
function mailSvc(m){
  const next=svcNextOf(m).next;
  openMail({kind:'svc',to:m.customer.email||'',subject:'Servisná prehliadka klimatizácie',vars:{termin:dfmt(next)},
    onSent:async()=>{ m.svcRemAt=new Date().toISOString(); m.svcRemFor=next; await persist('montaze/'+m.id,m); renderView(); },
    okMsg:to=>'Pripomienka servisnej prehliadky bola odoslaná na '+to.join(', ')+'.'});
}
/* ---- zdieľanie ponuky cez odkaz: stránku s ponukou zobrazuje skript v Google účte (ten istý ako pre kalendár) ---- */
const shareOn = () => !!(window.klimaCal && calUrl());
const shareLink = d => calUrl()+'?p='+d.shareId;
async function shareQuote(){
  if(!shareOn()){ toast('Zdieľanie cez odkaz používa prepojenie s Google. Nastav ho v module Kalendár montáží.'); return; }
  await saveQuote(true);
  const s=S.settings, c=Q.customer, items=[];
  for(const g of collect()){ const its=g.items.filter(i=>i.qty>0); if(!its.length) continue;
    if(g.header) items.push({group:g.header.title,kind:g.header.kind});
    for(const it of its) items.push({name:it.name,unit:it.unit,qty:it.qty,total:calc(it).total}); }
  const data={url:calUrl(),number:Q.number,date:Q.date,validUntil:Q.validUntil||(s.validity>0?addDays(Q.date,+s.validity):''),
    company:s.company||'',sup:[s.address,s.ico?'IČO: '+s.ico:'',s.phone,s.email].filter(Boolean),
    custName:c.name||'',custInfo:[c.address,c.phone,c.email].filter(Boolean).join(' · '),
    items,total:totals().total,variants:Q.variants.map((v,i)=>({id:v.id,name:v.name||'Variant '+varKey(i),sell:v.sell||0})),note:Q.note||'',footer:s.footer||''};
  const pid=Q.shareId||[...crypto.getRandomValues(new Uint8Array(12))].map(b=>b.toString(16).padStart(2,'0')).join('');
  const r=await calSend({action:'quote_save',pid,data});
  if(!r.ok){ toast(/^(Nepodarilo|Skript neodpovedal|Kľúč|Ponuka)/.test(r.error||'') ? r.error : 'Skript v Google účte je staršia verzia a ponuky ešte nevie. Vymeň ho podľa návodu v module Kalendár montáží.'); return; }
  /* nové zdieľanie = zákazník vidí aktuálne znenie, jeho staršia odpoveď už neplatí (pripomienky ostávajú) */
  Q.shareId=pid; Q.sharedAt=new Date().toISOString(); Q.approvedAt=''; Q.rejectedAt=''; await saveQuote(true); renderView();
  const copied=await copyText(shareLink(Q));
  toast(r.v>=2 ? (copied ? 'Odkaz na ponuku je skopírovaný. Vlož ho zákazníkovi do mailu alebo správy.' : 'Ponuka je zdieľaná. Odkaz nájdeš pod tlačidlami.')
    : 'Ponuka je zdieľaná, ale skript v Google účte je staršia verzia: zákazník ju vie len schváliť. Vymeň skript podľa návodu v module Kalendár montáží.');
}
/* zistí, čo zákazníci medzičasom odpovedali na zdieľané ponuky: schválenie, zamietnutie, pripomienky */
async function shareCheckAll(loud){
  if(!shareOn()||Cloud.curRole()!=='majitel') return;
  const msgs=[];
  for(const d of S.quotes.filter(x=>x.shareId&&x.sharedAt&&!x.approvedAt&&!x.rejectedAt)){
    const r=await calSend({action:'quote_status',pid:d.shareId});
    if(!r.ok) continue;
    const notes=r.notes||[], had=(d.shareNotes||[]).length;
    if(!r.approved&&!r.rejected&&notes.length<=had) continue;
    if(notes.length>had){ d.shareNotes=notes; if(!r.approved&&!r.rejected) msgs.push('Zákazník poslal pripomienky k ponuke č. '+d.number+'.'); }
    if(r.approved){
      d.approvedAt=r.approvedAt||new Date().toISOString(); if(cpStatus(d)==='odoslana') d.status='prijata';
      const v=(d.variants||[]).length>1 ? (d.variants.find(x=>r.variantId&&x.id===r.variantId)||d.variants[r.variant]) : null;
      if(v){ d.acceptedVar=v.id; cpApplyVariant(d); }
      let msg='Zákazník schválil ponuku č. '+d.number+(v?' (variant '+varKey(d.variants.indexOf(v))+', '+v.name+')':'')+'.';
      /* montáž sa predvyplní z ponuky; dátum, chladivo a sériové čísla doplní používateľ ručne */
      if(cpStatus(d)==='prijata'&&!cpNeedsVar(d)&&!S.montaze.some(m=>m.quoteId===d.id)){ const m=moFromQuote(d); S.montaze.push(m); await persist('montaze/'+m.id,m); msg+=' Montáž je predvyplnená, doplň dátum.'; }
      else if(cpNeedsVar(d)) msg+=' Variant nevybral, vyber ho v Evidencii CP.';
      msgs.push(msg);
    }
    else if(r.rejected){ d.rejectedAt=r.rejectedAt||new Date().toISOString(); if(cpStatus(d)==='odoslana') d.status='zamietnuta'; msgs.push('Zákazník zamietol ponuku č. '+d.number+'.'); }
    await cpSave(d); if(Q.id===d.id){ Object.assign(Q,{approvedAt:d.approvedAt||'',rejectedAt:d.rejectedAt||'',shareNotes:clone(d.shareNotes||[]),status:d.status,acceptedVar:d.acceptedVar||''}); saveDraft(); }
  }
  if(msgs.length){ renderView(); toast(msgs.join(' ')); } else if(loud) toast('Zatiaľ žiadna nová odpoveď od zákazníka.');
}
let shareCheckedAt=0;
function shareCheckSoon(){ if(Date.now()-shareCheckedAt<600e3) return; shareCheckedAt=Date.now(); shareCheckAll(); }
const shareNotesHtml = d => (d.shareNotes||[]).map(n=>`<div style="margin-top:6px;font-size:12.5px;white-space:pre-wrap"><span style="color:var(--muted)">${dfmt(isoDay(n.at))}</span> ${esc(n.text)}</div>`).join('');
function shareInfo(){
  if(!Q.sharedAt||!Q.shareId) return '';
  const done=Q.approvedAt||Q.rejectedAt;
  return `<div class="sum-int"><h4>${ICON.link} ${Q.approvedAt?'Zákazník ponuku schválil '+dfmt(isoDay(Q.approvedAt)):Q.rejectedAt?'Zákazník ponuku zamietol '+dfmt(isoDay(Q.rejectedAt)):'Zdieľaná cez odkaz '+dfmt(isoDay(Q.sharedAt))}</h4>
    <input type="text" readonly value="${esc(shareLink(Q))}" onfocus="this.select()" style="width:100%;font-size:12px">
    <div style="display:flex;gap:8px;margin-top:8px"><button class="btn small" data-act="share-copy">Kopírovať odkaz</button>${done?'':'<button class="btn small ghost" data-act="share-check">Skontrolovať odpoveď</button>'}</div>
    ${(Q.shareNotes||[]).length?`<div style="margin-top:10px"><b style="font-size:12.5px">Pripomienky zákazníka</b>${shareNotesHtml(Q)}</div>`:''}
    <p class="hint" style="margin:8px 0 0">Po úprave ponuky klikni znova na Zdieľať cez odkaz, inak zákazník vidí pôvodné znenie.</p></div>`;
}
/* ponuky odoslané mailom, na ktoré zákazník neodpovedal */
const cpLastMail = d => [d.sentAt,d.remindedAt].filter(Boolean).sort().pop()||'';
const cpSilentDays = d => { const l=cpLastMail(d); return l ? -dayDiff(isoDay(l)) : null; };
const cpNeedsFollow = d => cpState(d)==='odoslana' && cpSilentDays(d)!==null && cpSilentDays(d)>=CP_FOLLOW_DAYS;
function newQuoteAction(){
  const snap=Q; Q=newQuote(); saveDraft(); renderView();
  toast('Začatá nová ponuka.','Späť',()=>{ Q=snap; saveDraft(); renderView(); });
}

/* ============ balíčky (3, nastaviteľné v záložke Cenník a šablóna) ============ */
const PACK_DEFAULT = () => [
  {name:'Základná montáž',lines:{'i-cu':{qty:3},'i-cu-lista':{qty:2},'i-hadica':{qty:3},'i-cyky':{qty:5},'i-cyky3':{qty:5},'i-vid':{qty:1},'i-lis':{qty:2},'i-konz':{qty:1},'i-ost':{qty:1},'i-mdop':{qty:1,sell:200,buy:0}}},
  {name:'Balíček 2',lines:{}},{name:'Balíček 3',lines:{}}];
const packs = () => S.settings.packs || (S.settings.packs=PACK_DEFAULT());
function viewPacks(){
  const P=packs();
  const rows=S.catalog.rows.map(r=>{
    if(r.kind!=='item') return `<tr class="band ${r.kind}"><td colspan="${2+P.length*2}">${esc(r.title)}</td></tr>`;
    if(r.id==='i-klima') return '';
    return `<tr data-rid="${esc(r.id)}"><td>${esc(r.name)}</td><td>${esc(r.unit)}</td>`+P.map((p,i)=>{ const l=p.lines[r.id]||{};
      return `<td class="num"><input type="number" class="n" min="0" step="any" data-pk="${i}" data-pf="qty" value="${l.qty||''}" placeholder="0"></td>
        <td class="num"><input type="number" class="n" min="0" step="any" data-pk="${i}" data-pf="sell" value="${l.sell!==undefined?l.sell:''}" placeholder="cenník" title="Prázdne = cena z cenníka alebo skladu"></td>`; }).join('')+'</tr>';
  }).join('');
  return `<section class="card"><h3>Balíčky</h3>
    <p class="hint">Balíček v ponuke jedným kliknutím nastaví množstvá. Riadky bez množstva vynuluje, zariadenie nechá tak. Cenu vyplň len vtedy, ak má byť iná ako v cenníku alebo na sklade.</p>
    <div class="tablewrap"><table><thead><tr><th rowspan="2">Položka</th><th rowspan="2">MJ</th>${P.map((p,i)=>`<th colspan="2"><input type="text" data-pk="${i}" data-pf="name" value="${esc(p.name)}" placeholder="Názov balíčka ${i+1}" style="font-weight:600;min-width:150px"></th>`).join('')}</tr>
      <tr>${P.map(()=>'<th class="r">Množstvo</th><th class="r">Predaj €/MJ</th>').join('')}</tr></thead><tbody>${rows}</tbody></table></div></section>`;
}
function packInput(el){
  const p=packs()[+el.dataset.pk], f=el.dataset.pf;
  if(f==='name') p.name=el.value;
  else{
    const rid=el.closest('tr').dataset.rid, v=parseFloat(el.value.replace(',','.')), l=p.lines[rid]||(p.lines[rid]={});
    if(isNaN(v)||v<0||(f==='qty'&&v===0)){ delete l[f]; if(f==='sell') delete l.buy; } else l[f]=v;
    if(l.qty===undefined&&l.sell===undefined) delete p.lines[rid];
  }
  saveSettings();
}
function applyPack(i){
  const p=packs()[i]; if(!p) return;
  const snap=clone(Q.lines);
  for(const r of S.catalog.rows){
    if(r.kind!=='item'||r.id==='i-klima') continue;
    const l=p.lines[r.id]||{}, o=Q.lines[r.id]||(Q.lines[r.id]={});
    o.qty=l.qty||0; delete o.sell; delete o.buy;
    if(l.sell!==undefined) o.sell=l.sell;
    if(l.buy!==undefined) o.buy=l.buy;
  }
  $('#tbody').innerHTML=rowsHtml(); updateSummary(); saveDraft();
  toast('Balíček „'+(p.name||'Balíček '+(i+1))+'“ je použitý.','Späť',()=>{ Q.lines=snap; saveDraft(); renderView(); });
}
/* riadok napájacieho kábla CYKY-J 3G2,5 pre šablóny uložené pred verziou 1.0.4 (pridá sa raz) */
async function migrate(){
  if(S.settings.migCyky3) return;
  S.settings.migCyky3=1;
  const rows=S.catalog.rows, i=rows.findIndex(r=>r.id==='i-cyky');
  if(i>=0&&!rows.some(r=>r.id==='i-cyky3')){ rows.splice(i+1,0,{id:'i-cyky3',kind:'item',name:'Kábel napájací CYKY-J 3G2,5',unit:'m',q:0,buy:0,sell:0}); await persist('app/catalog',{rows}); }
  await persist('app/settings',S.settings);
}

/* ============ varianty zariadení (0 až 10): spoločné položky + jedno zariadenie na variant ============ */
const VAR_MAX=10, varKey = i => String.fromCharCode(65+i);
function varOpts(){ const d=stockFor('i-klima'); return d.concat(stockForGroups('i-klima').filter(x=>!d.includes(x))); }
function varRows(){
  const opts=varOpts(), base=totals().total;
  return Q.variants.map((v,i)=>{
    const st=v.stockId?S.sklad.items.find(x=>x.id===v.stockId):null, profit=(v.sell||0)-(v.buy||0);
    return `<tr class="item var" data-vid="${esc(v.id)}">
      <td class="name"><div class="namewrap"><span class="badge wait" style="flex:none">Variant ${varKey(i)}</span><div style="flex:1;display:flex;flex-direction:column;gap:5px;min-width:0">
        ${opts.length?`<select class="pick" data-vf="pick"><option value="">Vlastný názov…</option>${opts.map(o=>stockOpt(o,v.stockId)).join('')}</select>`:''}
        ${st?`<span class="stk ${st.stock<1?'warn':'good'}">Skladom: ${fq(st.stock)} ${esc(st.unit)}</span>`:`<input type="text" class="txt" data-vf="name" value="${esc(v.name)}" placeholder="Názov zariadenia">`}
        <span class="vtot">Cena variantu spolu: <b>${eur(base+(v.sell||0))}</b></span></div>
        <button class="x" data-act="var-del" title="Odstrániť variant">${ICON.x}</button></div></td>
      <td class="unit">kpl</td><td class="num">1</td>
      <td class="num"><input type="number" class="n" inputmode="decimal" min="0" step="any" data-vf="sell" value="${v.sell||''}" placeholder="0,00"></td>
      <td class="num total">${eur(v.sell||0)}</td>
      <td class="int num"><input type="number" class="n" inputmode="decimal" min="0" step="any" data-vf="buy" value="${v.buy||''}" placeholder="0,00"></td>
      <td class="int num profit ${profit<0?'neg':''}">${eur(profit)}</td></tr>`;
  }).join('');
}
const varAddBtn = () => Q.variants.length<VAR_MAX ? `<button class="link" data-act="var-add" style="margin-left:18px">+ Pridať variant zariadenia</button>` : '';
function varRedraw(){ $('#tbody').innerHTML=rowsHtml(); updateSummary(); saveDraft(); }
function varAdd(){
  if(Q.variants.length>=VAR_MAX) return;
  if(!Q.variants.length){   // prvý variant vznikne zo zariadenia, ktoré je v ponuke práve vybrané
    const it=findItem('i-klima');
    if(it&&it.qty>0) Q.variants.push({id:'v-'+uid(),stockId:it.stockId,name:(it.qty>1?fq(it.qty)+'× ':'')+it.name,buy:r3(it.buy*it.qty),sell:r3(it.sell*it.qty)});
  }
  const v={id:'v-'+uid(),stockId:null,name:'',buy:0,sell:0};
  Q.variants.push(v); varRedraw();
  const inp=$(`tr[data-vid="${v.id}"] select, tr[data-vid="${v.id}"] input`); if(inp) inp.focus();
}
function varInput(el){
  const v=Q.variants.find(x=>x.id===el.closest('tr').dataset.vid); if(!v) return; const f=el.dataset.vf;
  if(f==='name') v.name=el.value;
  else{ const n=parseFloat(el.value.replace(',','.')); v[f]=isNaN(n)||n<0?0:n; }
  updateSummary(); saveDraft();
}
function varPick(el){
  const v=Q.variants.find(x=>x.id===el.closest('tr').dataset.vid); if(!v) return;
  const st=S.sklad.items.find(x=>x.id===el.value);
  if(st){ v.stockId=st.id; v.name=st.name; v.buy=st.buy||0; v.sell=st.sell||0; } else v.stockId=null;
  varRedraw();
}
/* uložená ponuka s variantmi: do položiek a súčtov sa počíta prijatý variant (kým nie je vybraný, variant A) */
function cpApplyVariant(d){
  if(!(d.variants&&d.variants.length)) return d;
  const v=d.variants.find(x=>x.id===d.acceptedVar)||d.variants[0], b=d.baseTotals;
  d.items=[{stockId:v.stockId,name:v.name,unit:v.unit,qty:1,buy:v.buy,sell:v.sell,total:v.sell,profit:v.sell-v.buy},...d.baseItems];
  d.totals={total:b.total+v.sell,cost:b.cost+v.buy,profit:b.profit+v.sell-v.buy};
  return d;
}
const cpNeedsVar = d => !!(d.variants&&d.variants.length>1&&!d.acceptedVar);
const cpVarLabel = d => { const i=d.variants.findIndex(x=>x.id===d.acceptedVar); return i>=0?varKey(i):''; };

    <div class="tablewrap"><table><thead><tr><th>Popis položky</th><th>MJ</th><th class="r">Predv. množstvo</th><th class="r">Nákup €/MJ</th><th class="r">Predaj €/MJ</th><th></th></tr></thead>

function catUndo(label,fn){
  const snap=clone(S.catalog.rows); fn(); saveCatalog(); renderView();

}
function catAction(act,btn){
  const rows=S.catalog.rows, rid=btn.closest('tr')?.dataset.rid;
  const idx=rows.findIndex(r=>r.id===rid);
  if(act==='cat-add-item'){
    let j=idx+1; while(j<rows.length&&rows[j].kind==='item') j++;
    const nr={id:'i-'+uid(),kind:'item',name:'',unit:'ks',q:0,buy:0,sell:0};
    rows.splice(j,0,nr); saveCatalog(); renderView();
    const inp=$(`tr[data-rid="${nr.id}"] input`); if(inp) inp.focus();
  } else if(act==='cat-add-group'){
    rows.push({id:'g-'+uid(),kind:'h1',title:'Nová skupina'}); saveCatalog(); renderView();
  } else if(act==='cat-del'){
    const r=rows[idx]; if(!r) return;
    if(r.kind==='item') catUndo('Položka odstránená.',()=>rows.splice(idx,1));
    else catUndo('Skupina odstránená.',()=>{ let j=idx+1; while(j<rows.length&&rows[j].kind==='item') j++; rows.splice(idx,j-idx); });
  } else if(act==='cat-reset'){
    catUndo('Šablóna obnovená.',()=>{ S.catalog.rows=clone(DEFAULT_ROWS); });
  }
}
function catInput(el){
  const tr=el.closest('tr'); const r=S.catalog.rows.find(x=>x.id===tr.dataset.rid); if(!r) return;
  const f=el.dataset.cf;
  if(['q','buy','sell'].includes(f)){ const v=parseFloat(el.value.replace(',','.')); r[f]=isNaN(v)||v<0?0:v; }
  else r[f]=el.value;
  saveCatalog();
}

/* uloženie po zmene stavu zásob: v spoločnej databáze sa posielajú len prírastky, nie celý sklad */
async function skSave(){
  if(Cloud.on&&Cloud.role!=='citanie'&&!Cloud.legacySklad){
    try{ await Cloud.skFlush(); Store.lsSet('app/sklad',clone(S.sklad)); setStatus('cloud'); }
    catch(e){ setStatus('err'); toast(/oprávnenie/.test(e.message||'')?'Táto zmena sa neuložila – nemáš oprávnenie.':'Uloženie zlyhalo – zmeny sa nemusia zachovať.'); }
    if(!Cloud.legacySklad) return;
  }
  await persist('app/sklad',S.sklad);
}
function skLog(it,delta,reason){
  const e={ts:Date.now(),sid:it.id,name:it.name||'(bez názvu)',delta,reason};
  S.sklad.log.unshift(e);
  if(S.sklad.log.length>200) S.sklad.log.length=200;
  if(Cloud.on&&Cloud.role!=='citanie') Cloud.skQ.push({id:it.id,delta,log:e});
}
function skInput(el){
  const it=S.sklad.items.find(x=>x.id===el.closest('tr').dataset.sid); if(!it) return; const f=el.dataset.sf;
  if(['min','buy','sell'].includes(f)){ const v=parseFloat(el.value.replace(',','.')); it[f]=isNaN(v)||v<0?0:v; }
  else it[f]=el.value;
  if(f==='slot'&&el.value) it.cat=skCatOfRow(el.value);
  if(f==='slot'||f==='cat'){ saveSklad(); renderView(); return; }
  if(f==='min'){ const b=el.closest('tr').querySelector('.badge'); const s=skState(it); b.className='badge '+s.cls; b.textContent=s.text; }
  saveSklad();
}
function skStockChange(inp,step){
  const tr=inp.closest('tr'); const it=S.sklad.items.find(x=>x.id===tr.dataset.sid); if(!it) return;
  let nv = step===null ? parseFloat(inp.value.replace(',','.')) : r3(it.stock+step);
  if(isNaN(nv)) nv=it.stock;
  const d=r3(nv-it.stock); inp.value=nv; if(!d) return;
  it.stock=nv; skLog(it,d,'Ručná úprava');
  const b=tr.querySelector('.badge'); const s=skState(it); b.className='badge '+s.cls; b.textContent=s.text;
  skSave();
}
function skCatOfRow(rid){ let h1=''; for(const r of S.catalog.rows){ if(r.kind==='h1') h1=r.title; if(r.id===rid) return /zariadenie/i.test(h1)?'Zariadenie':'Materiál'; } return 'Materiál'; }
function skSeed(){
  let n=0;
  for(const r of S.catalog.rows){
    if(r.kind!=='item'||/mont[aá]ž a doprava/i.test(r.name)) continue;
    if(S.sklad.items.some(i=>i.slot===r.id)) continue;
    S.sklad.items.push({id:'s-'+uid(),name:r.name,unit:r.unit,cat:skCatOfRow(r.id),buy:r.buy||0,sell:r.sell||0,stock:0,min:0,spec:'',slot:r.id}); n++;
  }
  saveSklad(); renderView(); toast(n?`Pridaných ${n} položiek do skladu.`:'Všetky položky šablóny už v sklade sú.');
}

const MON_S=['Jan','Feb','Mar','Apr','Máj','Jún','Júl','Aug','Sep','Okt','Nov','Dec'];
const MON_L=['Január','Február','Marec','Apríl','Máj','Jún','Júl','August','September','Október','November','December'];
const nf0=new Intl.NumberFormat('sk-SK',{maximumFractionDigits:0});
let OB_AGG=[];
function obRecords(withPending){
  const recs=[], done=new Set();
  for(const m of S.montaze){
    if(m.status!=='hotova') continue;
    const d=S.quotes.find(q=>q.id===m.quoteId); if(!d) continue;
    done.add(d.id);
    recs.push({id:d.id,date:((m.startDate||m.completedAt||'').slice(0,10))||d.date,total:d.totals?.total||0,cost:d.totals?.cost||0,profit:d.totals?.profit||0,name:(d.customer?.name||'').trim()||'(bez mena)',pending:false});
  }
  if(withPending) for(const d of S.quotes){
    if(done.has(d.id)||cpStatus(d)!=='prijata') continue;
    recs.push({id:d.id,date:d.date,total:d.totals?.total||0,cost:d.totals?.cost||0,profit:d.totals?.profit||0,name:(d.customer?.name||'').trim()||'(bez mena)',pending:true});
  }
  return recs;
}
function niceTicks(lo,hi){
  const span=Math.max(hi-lo,1), raw=span/4, p=Math.pow(10,Math.floor(Math.log10(raw))), f=raw/p;
  const step=(f<=1?1:f<=2?2:f<=5?5:10)*p, a=Math.floor(lo/step)*step, b=Math.ceil(hi/step)*step, t=[];
  for(let v=a;v<=b+1e-9;v+=step) t.push(Math.round(v*100)/100);
  return t;
}
function barPath(x,y0,y1,w,r){
  const top=Math.min(y0,y1), h=Math.abs(y1-y0); if(h<0.5) return '';
  r=Math.min(r,h,w/2);
  return y1<=y0 ? `M${x},${y0}V${top+r}Q${x},${top} ${x+r},${top}H${x+w-r}Q${x+w},${top} ${x+w},${top+r}V${y0}Z`
                : `M${x},${y0}V${top+h-r}Q${x},${top+h} ${x+r},${top+h}H${x+w-r}Q${x+w},${top+h} ${x+w},${top+h-r}V${y0}Z`;
}
function obChart(){
  const W=760,H=300,m={l:62,r:12,t:12,b:30}, pw=W-m.l-m.r, ph=H-m.t-m.b;
  const maxV=Math.max(1,...OB_AGG.map(a=>Math.max(a.total,a.net))), minV=Math.min(0,...OB_AGG.map(a=>a.net));
  const ticks=niceTicks(minV,maxV), lo=ticks[0], hi=ticks[ticks.length-1];
  const y=v=>m.t+ph*(1-(v-lo)/(hi-lo)), gw=pw/12, bw=Math.min(24,gw*0.34);
  let g='';
  for(const t of ticks) g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text class="ob-tick" x="${m.l-8}" y="${y(t)+4}" text-anchor="end">${nf0.format(t)}</text>`;
  let bars='';
  OB_AGG.forEach((a,i)=>{
    const cx=m.l+gw*i+gw/2;
    bars+=`<path d="${barPath(cx-bw-1,y(0),y(a.total),bw,4)}" fill="var(--s1)"/><path d="${barPath(cx+1,y(0),y(a.net),bw,4)}" fill="var(--s2)"/>
      <text class="ob-tick" x="${cx}" y="${H-10}" text-anchor="middle">${MON_S[i]}</text>
      <rect class="ob-hit" data-m="${i}" x="${m.l+gw*i}" y="${m.t}" width="${gw}" height="${ph}" fill="transparent"/>`;
  });
  const hl=`<rect id="ob-hl" x="0" y="${m.t}" width="${gw}" height="${ph}" fill="var(--ink)" opacity="0" pointer-events="none"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Obrat a čistý zisk po mesiacoch roku ${S.obYear}. Hodnoty sú v tabuľke nižšie.">${g}<line x1="${m.l}" x2="${W-m.r}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-opacity=".5"/>${hl}${bars}</svg><div class="ob-tip" id="ob-tip" hidden></div>`;
}
const EXP_CATS=['Palivo a doprava','Mzdy a odmeny','Poistenie','Náradie a vybavenie','Marketing','Kancelária a služby','Odvody a poplatky','Iné'];

function obYears(recsAll){
  const ys=[new Date().getFullYear(),...recsAll.map(r=>+r.date.slice(0,4)),...S.expenses.map(e=>+(e.date||'').slice(0,4)),...S.quotes.map(d=>+(d.date||'').slice(0,4))].filter(Boolean);

function viewObrat(){

  OB_AGG.forEach(a=>a.net=a.profit-a.exp);
  const T=OB_AGG.reduce((s,a)=>({total:s.total+a.total,cost:s.cost+a.cost,profit:s.profit+a.profit,n:s.n+a.n,exp:s.exp+a.exp,net:s.net+a.net}),{total:0,cost:0,profit:0,n:0,exp:0,net:0});
  const pend=S.quotes.filter(d=>cpStatus(d)==='prijata'&&!S.montaze.some(m=>m.quoteId===d.id&&m.status==='hotova'));

  const kpi=(l,v,sub)=>`<div class="stat"><small>${l}</small><b>${v}</b><span>${sub}</span></div>`;
  const marg=T.total>0?nf.format(T.profit/T.total*100)+' %':'–';
  const byC={}; for(const r of recs){ const k=r.name.toLowerCase(); (byC[k]=byC[k]||{name:r.name,total:0,profit:0,n:0}); byC[k].total+=r.total; byC[k].profit+=r.profit; byC[k].n++; }
  const top=Object.values(byC).sort((a,b)=>b.total-a.total).slice(0,6), topMax=Math.max(1,...top.map(t=>t.total));
  const rows=OB_AGG.map((a,i)=>(a.n||a.exp)?`<tr><td>${MON_L[i]}</td><td class="num">${a.n}</td><td class="num">${eur(a.total)}</td><td class="num">${eur(a.profit)}</td><td class="num">${eur(a.exp)}</td><td class="num"><b>${eur(a.net)}</b></td></tr>`:'').join('');
  const show=T.n||T.exp>0;
  return obHead(years,'Obrat z ukončených montáží, výdavky zadáš v záložke Výdavky.')+`
  <div class="stats k4">${kpi('Obrat '+S.obYear,eur(T.total),T.n+(T.n===1?' zákazka':T.n>=2&&T.n<=4?' zákazky':' zákaziek')+(T.n?' · priemer '+eur(T.total/T.n):''))}${kpi('Hrubý zisk',eur(T.profit),'marža '+marg+' · nákup '+eur(T.cost))}${kpi('Výdavky',eur(T.exp),T.exp?'zo záložky Výdavky':'zatiaľ žiadne')}${kpi('Čistý zisk',eur(T.net),'hrubý zisk mínus výdavky')}</div>
  ${pend.length&&S.obBasis==='hotove'?`<p class="hint" style="margin:-6px 2px 16px">Čaká na ukončenie montáže: <b>${pend.length}</b> ${pend.length===1?'prijatá ponuka':pend.length<=4?'prijaté ponuky':'prijatých ponúk'} za ${eur(pendSum)} – do obratu sa započítajú po ukončení montáže.</p>`:''}
  <section class="card"><div class="card-head"><h3>Obrat a čistý zisk po mesiacoch</h3><div class="legend viz"><span><i style="background:var(--s1)"></i>Obrat</span><span><i style="background:var(--s2)"></i>Čistý zisk</span></div></div>

/* záložka Úspešnosť ponúk: neúspech = zamietnutá alebo vypršaná, čakajúce sa do úspešnosti nepočítajú */
function viewUspech(years){
  const blank=()=>({n:0,ok:0,no:0,exp:0,wait:0,sum:0,okSum:0,okProfit:0});
  const agg=Array.from({length:12},blank), T=blank();
  for(const d of S.quotes){
    if(+(d.date||'').slice(0,4)!==S.obYear) continue;
    const st=cpState(d), tot=d.totals?.total||0;
    for(const a of [agg[(+d.date.slice(5,7)||1)-1],T]){
      a.n++; a.sum+=tot;
      if(st==='prijata'){ a.ok++; a.okSum+=tot; a.okProfit+=d.totals?.profit||0; }
      else if(st==='zamietnuta') a.no++; else if(st==='prepadla') a.exp++; else a.wait++;
    }
  }
  const dec=a=>a.ok+a.no+a.exp;
  const rate=a=>dec(a)?nf.format(a.ok/dec(a)*100)+' %':'–';
  const marg=a=>a.okSum>0?nf.format(a.okProfit/a.okSum*100)+' %':'–';
  const avg=a=>a.n?eur(a.sum/a.n):'–';
  const kpi=(l,v,sub)=>`<div class="stat"><small>${l}</small><b>${v}</b><span>${sub}</span></div>`;
  const row=(l,a,cls='')=>`<tr class="${cls}"><td>${l}</td><td class="num">${a.n}</td><td class="num">${a.ok}</td><td class="num">${a.no}</td><td class="num">${a.exp}</td><td class="num">${a.wait}</td><td class="num"><b>${rate(a)}</b></td><td class="num">${avg(a)}</td><td class="num">${marg(a)}</td></tr>`;
  const rows=agg.map((a,i)=>a.n?row(MON_L[i],a):'').join('');
  return obHead(years,'Koľko ponúk zákazníci prijali. Počítajú sa všetky uložené ponuky podľa dátumu ponuky.')+`
  <div class="stats k4">${kpi('Úspešnosť '+S.obYear,rate(T),dec(T)?`prijaté ${T.ok} z ${dec(T)} vyhodnotených`:'zatiaľ nič vyhodnotené')}${kpi('Ponúk spolu',T.n,`čaká na odpoveď ${T.wait}`)}${kpi('Priemerná hodnota ponuky',avg(T),T.ok?'prijatej '+eur(T.okSum/T.ok):'žiadna prijatá')}${kpi('Marža prijatých ponúk',marg(T),'zisk '+eur(T.okProfit))}</div>
  <section class="card"><h3>Podľa mesiacov</h3>${T.n?`<div class="tablewrap"><table><thead><tr><th>Mesiac</th><th class="r">Ponúk</th><th class="r">Prijaté</th><th class="r">Zamietnuté</th><th class="r">Vypršané</th><th class="r">Čaká</th><th class="r">Úspešnosť</th><th class="r">Priem. hodnota</th><th class="r">Marža prijatých</th></tr></thead>
    <tbody>${rows}${row('Spolu',T,'totalrow')}</tbody></table></div>
    <p class="hint" style="margin:12px 0 0">Úspešnosť = prijaté ÷ (prijaté + zamietnuté + vypršané). Ponuky, ktoré ešte čakajú na odpoveď, sa nepočítajú.</p>`
    :`<p class="hint" style="margin:20px 0">V roku ${S.obYear} zatiaľ nie je uložená žiadna ponuka.</p>`}</section>`;
}

function backupObj(){ return {app:'klima-office',version:1,exportedAt:new Date().toISOString(),

const bkCounts=d=>[['ponúk',(d.quotes||[]).length],['montáží',(d.montaze||[]).length],['zákazníkov',(d.customers||[]).length],['udalostí',(d.events||[]).length],['výdavkov',(d.expenses||[]).length],['zásahov a reklamácií',(d.cases||[]).length],['položiek skladu',((d.sklad||{}).items||[]).length],['kusov náradia',((d.tools||{}).items||[]).length]];
async function doBackup(){

/* automatická záloha (len v nainštalovanej aplikácii – window.klimaBackup dodáva Electron): raz denne do priečinka, voliteľne raz týždenne mailom */
async function autoBackup(force){
  if(!window.klimaBackup||!S.loaded||Store.ok===false) return;
  const obj=backupObj();
  if(!force && (S.settings.autoBkAt===today() || !bkCounts(obj.data).some(x=>x[1]))) return;
  const json=JSON.stringify(obj,null,1), name=`klima-office-zaloha-${today()}.json`;
  const r=await window.klimaBackup.save({filename:name,data:json});
  if(!r.ok){ toast('Automatická záloha zlyhala: '+r.error); return; }
  S.bk=r.cfg; S.settings.autoBkAt=S.settings.lastBackup=today();
  if(S.settings.bkMail && window.klimaMail && (!S.settings.bkMailAt || -dayDiff(S.settings.bkMailAt)>=7)){
    const cfg=await window.klimaMail.getConfig();
    if(!cfg.hasPass){ if(force) toast('Zálohu mailom pošlem, keď nastavíš odosielanie (Odoslať mail → Nastaviť).'); }
    else{
      const m=await window.klimaMail.send({to:[cfg.user],cc:[],bcc:[],subject:'Klima Office – záloha údajov '+dfmt(today()),fromName:'Klima Office',
        text:'V prílohe je automatická záloha údajov z aplikácie Klima Office.\nNahráš ju v module Záloha údajov → Nahrať zálohu.',files:[{filename:name,content:json}]});
      if(m.ok) S.settings.bkMailAt=today(); else toast('Zálohu sa nepodarilo poslať mailom: '+m.error);
    }
  }
  await persist('app/settings',S.settings); renderNav(); if(S.module==='zaloha') renderView();
  if(force) toast('Záloha je uložená v priečinku.');
}
async function replaceCol(col,arr){
  for(const o of S[col]) if(!arr.some(x=>x.id===o.id)) await Store.del(col+'/'+o.id).catch(()=>{});
  for(const x of arr) await persist(col+'/'+x.id,x);
  S[col]=arr;
}
async function applyImport(){
  const d=clone(S.imp.data); S.imp=null;
  if(d.catalog&&Array.isArray(d.catalog.rows)&&d.catalog.rows.length) S.catalog.rows=d.catalog.rows;
  if(d.settings){ if(!d.settings.migCyky3) delete S.settings.migCyky3; S.settings=Object.assign(S.settings,d.settings); }
  if(d.sklad&&Array.isArray(d.sklad.items)) S.sklad={items:d.sklad.items,log:d.sklad.log||[]};
  if(d.tools&&Array.isArray(d.tools.items)) S.tools={items:d.tools.items,log:d.tools.log||[]};
  await persist('app/catalog',{rows:S.catalog.rows}); await persist('app/settings',S.settings); Cloud.skQ=[]; Cloud.forceSklad=true; await persist('app/sklad',S.sklad); await persist('app/naradie',S.tools);
  for(const c of BK_COLS) await replaceCol(c,Array.isArray(d[c])?d[c]:[]);
  await migrate();
  renderAll(); toast('Záloha bola nahraná.');
}

/* ============ modul: Evidencia náradia ============ */
const TL_ST={ok:['ok','V poriadku'],oprava:['low','V oprave'],stratene:['out','Stratené'],vyradene:['off','Vyradené']};
const addMonths=(iso,n)=>{ const d=new Date(iso+'T12:00'); d.setMonth(d.getMonth()+n); return d.toLocaleDateString('sv-SE'); };
const dayDiff=iso=>Math.round((new Date(iso+'T12:00')-new Date(today()+'T12:00'))/864e5);
const tlActive=t=>t.status==='ok'||t.status==='oprava';
const tlNext=t=> t.nextService || (t.lastService&&+t.interval>0 ? addMonths(t.lastService,+t.interval) : '');
const tlById=id=>S.tools.items.find(x=>x.id===id);
function tlSvc(t){
  const n=tlNext(t); if(!n) return {days:null,html:'<span style="color:var(--muted)">–</span>'};
  const d=dayDiff(n);
  const b = d<0 ? `<span class="badge out">po termíne ${-d} d</span>` : d<=30 ? `<span class="badge low">o ${d} d</span>` : `<span class="badge ok">${dfmt(n)}</span>`;
  return {days:d,html:b+(d<0||d<=30?`<div style="font-size:11.5px;color:var(--muted);margin-top:3px">${dfmt(n)}</div>`:'')};
}
function tlWar(t){
  if(!t.warrantyUntil) return '<span style="color:var(--muted)">–</span>';
  const d=dayDiff(t.warrantyUntil);
  return d<0 ? '<span class="badge off">skončila</span>' : d<=60 ? `<span class="badge low">končí o ${d} d</span>` : `<span class="badge ok">do ${dfmt(t.warrantyUntil)}</span>`;
}
function tlLog(t,text){ S.tools.log.unshift({ts:Date.now(),tid:t.id,name:t.name||'(bez názvu)',text}); if(S.tools.log.length>300) S.tools.log.length=300; }
function tlSub(t){ return esc([t.model,t.serial?'SN '+t.serial:''].filter(Boolean).join(' · ')); }
function tlStats(){
  const act=S.tools.items.filter(tlActive);
  const val=act.reduce((s,t)=>s+(+t.price||0),0);
  const rep=act.filter(t=>t.status==='oprava').length;
  const due=act.map(t=>tlSvc(t).days).filter(d=>d!==null&&d<=30);
  const over=due.filter(d=>d<0).length;
  return `<div class="stat"><small>Náradie v používaní</small><b>${act.length}</b><span>hodnota ${eur(val)}</span></div>
    <div class="stat"><small>V oprave</small><b>${rep}</b><span>${rep?'čaká na vrátenie':'všetko funguje'}</span></div>
    <div class="stat"><small>Servis do 30 dní</small><b>${due.length}</b><span>${over?over+' po termíne':'nič po termíne'}</span></div>`;
}
function tlRows(){
  const q=S.tlQuery.trim().toLowerCase(), f=S.tlFilter;
  const list=S.tools.items.filter(t=>{
    if(q && !([t.name,t.model,t.serial,t.location,t.holder].join(' ')).toLowerCase().includes(q)) return false;

      <td class="svc-cell">${tlSvc(t).html}</td><td class="war-cell">${tlWar(t)}</td>
      <td><div class="rowact"><button class="btn small ${S.tlOpen===t.id?'':'ghost'}" data-act="tl-open">Detail ${S.tlOpen===t.id?'▴':'▾'}</button><button class="x" data-act="tl-del" title="Odstrániť">${ICON.trash}</button></div></td></tr>`;

    const fl=(k,l,type='text',cls='',ph='')=>`<label class="f ${cls}">${l}<input type="${type}" data-tl="${k}" value="${esc(t[k]||'')}" ${ph?`placeholder="${esc(ph)}"`:''}></label>`;

      ${fl('model','Výrobca / model','text','s2')}${fl('serial','Sériové číslo','text','s2')}
      ${fl('buyDate','Dátum nákupu','date')}${fl('price','Cena (€)','number')}${fl('warrantyUntil','Záruka do','date')}<span></span>
      ${fl('lastService','Posledný servis / kalibrácia','date')}${fl('interval','Interval (mesiace)','number','','napr. 12')}${fl('nextService','Ďalší servis (voliteľne ručne)','date','',dn?'automaticky '+dfmt(dn):'')}

  }).join('');
}

function tlRefresh(id){
  const t=tlById(id); const tr=$(`#tl-body tr[data-tid="${CSS.escape(id)}"]`); if(!t||!tr) return;

function tlInput(el){
  const f=el.dataset.tl; if(['status','location','holder'].includes(f)) return;

  t[f]=v; saveTools(); tlRefresh(t.id);
